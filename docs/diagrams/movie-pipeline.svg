<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#1c1a16"/>
</marker>
<marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#6b665c"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
<rect x="210" y="20" width="340" height="50" rx="10" fill="#ffffff" stroke="#dcd8d0" stroke-width="1.3"/>
<text x="380.0" y="42" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1c1a16">Gmail email</text>
<text x="380.0" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6b665c">movie / watch topic match</text>
<rect x="180" y="105" width="400" height="62" rx="10" fill="#ffffff" stroke="#dcd8d0" stroke-width="1.3"/>
<text x="380.0" y="129" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1c1a16">Extract candidate title</text>
<text x="380.0" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6b665c">subject → body (LLM) → image (vision LLM)</text>
<polygon points="250,250 380,208 510,250 380,292" fill="#f2e2cd" stroke="#a8631e" stroke-width="1.4"/>
<text x="380" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1a16">Link present?</text>
<rect x="40" y="330" width="290" height="80" rx="10" fill="#e3efe2" stroke="#3f7d4f" stroke-width="1.3"/>
<text x="185.0" y="354" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1c1a16">Dedup by video ID</text>
<text x="185.0" y="374" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6b665c">deterministic, no LLM call</text>
<text x="185.0" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6b665c">skips a stable link straight through</text>
<rect x="430" y="330" width="290" height="80" rx="10" fill="#dfeceb" stroke="#2b6e6a" stroke-width="1.3"/>
<text x="575.0" y="354" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1c1a16">Dedup by LLM title match</text>
<text x="575.0" y="374" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6b665c">fuzzy fallback</text>
<text x="575.0" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6b665c">used only when no link is present</text>
<line x1="380.0" y1="70" x2="380.0" y2="105" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="380.0" y1="167" x2="380" y2="208" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="250" y1="250" x2="185.0" y2="330" stroke="#3f7d4f" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="230" y="268" text-anchor="end" font-size="10.5" fill="#3f7d4f">yes</text>
<line x1="510" y1="250" x2="575.0" y2="330" stroke="#2b6e6a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="530" y="268" text-anchor="start" font-size="10.5" fill="#2b6e6a">no</text>
<line x1="185.0" y1="410" x2="320.0" y2="450" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="575.0" y1="410" x2="440.0" y2="450" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="210" y="450" width="340" height="36" rx="10" fill="#f2e2cd" stroke="#a8631e" stroke-width="1.3"/>
<text x="380.0" y="473" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1c1a16">watch-history.yaml</text>
</svg>
