<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 140" width="1060" height="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#1c1a16"/>
</marker>
<marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#6b665c"/>
</marker>
</defs>
<rect x="0" y="0" width="1060" height="140" fill="#ffffff"/>
<rect x="5.0" y="40" width="190" height="78" rx="10" fill="#f2e2cd" stroke="#a8631e" stroke-width="1.3"/>
<text x="100.0" y="62" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#a8631e">1</text>
<text x="100.0" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">set Redis busy flag</text>
<line x1="195.0" y1="79.0" x2="220.0" y2="79.0" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="220.0" y="40" width="190" height="78" rx="10" fill="#ffffff" stroke="#dcd8d0" stroke-width="1.3"/>
<text x="315.0" y="62" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#a8631e">2</text>
<text x="315.0" y="80" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">unload resident chat model,</text>
<text x="315.0" y="97" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">poll until empty</text>
<line x1="410.0" y1="79.0" x2="435.0" y2="79.0" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="435.0" y="40" width="190" height="78" rx="10" fill="#ffffff" stroke="#dcd8d0" stroke-width="1.3"/>
<text x="530.0" y="62" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#a8631e">3</text>
<text x="530.0" y="80" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">submit to ComfyUI,</text>
<text x="530.0" y="97" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">poll, fetch result</text>
<line x1="625.0" y1="79.0" x2="650.0" y2="79.0" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="650.0" y="40" width="190" height="78" rx="10" fill="#ffffff" stroke="#dcd8d0" stroke-width="1.3"/>
<text x="745.0" y="62" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#a8631e">4</text>
<text x="745.0" y="80" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">free VRAM (endpoint call</text>
<text x="745.0" y="97" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">or full pod restart)</text>
<line x1="840.0" y1="79.0" x2="865.0" y2="79.0" stroke="#6b665c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="865.0" y="40" width="190" height="78" rx="10" fill="#f2e2cd" stroke="#a8631e" stroke-width="1.3"/>
<text x="960.0" y="62" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#a8631e">5</text>
<text x="960.0" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#1c1a16">clear busy flag</text>
</svg>
