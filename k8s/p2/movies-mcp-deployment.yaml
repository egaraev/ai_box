# movies-mcp: the HTTP MCP server Hermes calls for movie questions
# (ask_movies) -- the first of the "specialist agent" family (movies/
# medical/legal/...), each its own tiny pod with its own persistent
# Honcho-backed memory. See apps/movies-mcp/server.py's top-of-file
# comment for the full design writeup (Honcho workspace/peer/session
# layout, why LiteLLM's "auto" route rather than a named local model).
# Source lives in apps/movies-mcp/ in this repo (not published anywhere)
# -- built and run locally on aibox, same no-registry pattern as every
# other *-mcp service here (see media-augment-mcp-deployment.yaml's own
# comment for the full reasoning).
#
# BUILD / DEPLOY (run on aibox -- the image has to exist as a local
# containerd/docker image on the node before this Deployment can start):
#   cd ~/repos/aibox-platform/apps/movies-mcp
#   docker build -t movies-mcp:latest .
#   docker save movies-mcp:latest | sudo k3s ctr images import -
# After editing server.py, repeat both, then:
#   kubectl rollout restart deployment/movies-mcp -n ai-mcp
# When THIS FILE changes -- `kubectl apply -f` it in addition to any
# image rebuild.
#
# No PVC, no GPU. Honcho (k8s/p2/honcho.yaml, already deployed) is the
# persistent store for conversation memory -- but there IS one small
# hostPath volume below, for watch-history.yaml, the structured "what
# Eldar's watched" file the update_watch_history tool edits (see
# server.py's WATCH HISTORY comment). Honcho's dialectic recall isn't a
# good fit for that -- it's a short, exact list needing precise lookups,
# not fuzzy semantic search -- so it's a plain file instead.
#
# MOUNTS THE DIRECTORY, NOT THE FILE (fixed 2026-09-27, real production
# bug): originally this mounted the single file directly (hostPath
# type: File at /app/watch-history.yaml). That's broken by design for
# ANYTHING that writes the file atomically -- server.py's
# _save_watch_history() writes a temp file next to it then
# os.replace()'s it into place, and you cannot rename() onto an actively
# bind-mounted file: confirmed live as `OSError: [Errno 16] Device or
# resource busy`, on every single write, regardless of which model or
# tool called it (this looked at first like the same "model fabricates
# tool success" bug media-gen-mcp hit -- it wasn't; Hermes really was
# calling the tool, the write itself was silently failing every time).
# Fix: mount the PARENT DIRECTORY at /app/data instead, and point
# WATCH_HISTORY_PATH at a file inside it (/app/data/watch-history.yaml)
# -- now the temp file and the real file both live inside the same
# bind-mounted directory, so the rename is a normal same-filesystem
# operation and actually succeeds.
#
# MOVED INTO THE OBSIDIAN VAULT (2026-09-27, Eldar's request): was
# /srv/aibox/movies-mcp (a bare, root-owned, ungrouped spot on the node).
# Eldar wants one single place of truth for all specialist-agent data,
# for easier management and backup -- the vault (/data/obsidian_vault,
# same path vault-mcp and hermes-agent already mount, see vault-mcp-
# deployment.yaml's own top comment) is already backed up as one unit,
# so parking data there instead of scattered hostPath dirs means backing
# up the vault backs this up too. Deliberately kept as a PLAIN YAML file,
# not a real Obsidian note (Eldar considered and declined that -- more
# moving parts, this session already found enough real bugs for one day)
# -- this is purely a location change, server.py's code is untouched,
# WATCH_HISTORY_PATH inside the container stays /app/data/watch-history.yaml.
# _system/ prefix (leading underscore, Obsidian convention) keeps this
# and future specialist agents' raw data visually separate from Eldar's
# actual notes; specialist-agents/movies/ leaves room for medical/legal/
# etc. to each get their own sibling folder the same way later.
#
# ONE-TIME SETUP before the first `kubectl apply` of this file: the
# hostPath below expects the DIRECTORY to already exist on aibox, with
# the seed file inside it. No sudo needed this time -- unlike /srv/aibox,
# the vault is eldar-owned:
#   mkdir -p /data/obsidian_vault/_system/specialist-agents/movies
#   cat > /data/obsidian_vault/_system/specialist-agents/movies/watch-history.yaml <<'EOF'
#   interests: []
#   completed: []
#   on_hold: []
#   suggested_not_yet_watched: []
#   anticipated: []
#   EOF
# After that, the pod owns it -- don't overwrite it by hand again except
# to fix a typo. If migrating from the old /srv/aibox/movies-mcp location
# and it already has real (non-seed) data, copy THAT file's content
# instead of the empty seed above, then it's safe to remove the old
# /srv/aibox/movies-mcp directory.
#
# ALSO NOTE: the eventual plan is for scripts/gmail_sync.py in the n8n
# pod to ALSO write into this same directory (k8s/n8n/n8n-deployment.yaml
# would get its own mount of the same host path) -- NOT actually wired
# up yet as of this fix (checked n8n-deployment.yaml directly, it's still
# a "future" placeholder there), so no two-pod concurrency to worry about
# for now. When that does get built, mount the SAME directory there too
# (not the single file), for the same reason as above.
#
# tmdb-secret (added 2026-09-27, check_anticipated tool): NOT defined here,
# same convention as litellm-secret -- created directly on the cluster,
# never committed to git (see k8s/secrets/README.md). Already created on
# the cluster (kubectl get secret tmdb-secret -n ai-mcp to confirm).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-mcp
  namespace: ai-mcp
  labels:
    app: movies-mcp
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: movies-mcp
    spec:
      containers:
        - name: movies-mcp
          image: movies-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LITELLM_URL
              value: "http://litellm.ai-models.svc.cluster.local:4000/v1"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master_key
            - name: HONCHO_URL
              value: "http://honcho-api.ai-memory.svc.cluster.local:8000"
            # No HONCHO_API_KEY entry -- honcho-config's AUTH_USE_AUTH is
            # "false" today, so there's no secret to source one from. If
            # that ever changes, add a secretKeyRef here the same way
            # LITELLM_API_KEY does above.
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tmdb-secret
                  key: api_key
            # ADDED with the directory-mount fix -- overrides server.py's
            # own default of /app/watch-history.yaml (which no longer
            # exists directly; the mount is now the directory below).
            - name: WATCH_HISTORY_PATH
              value: "/app/data/watch-history.yaml"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: watch-history
              mountPath: /app/data
      volumes:
        # DIRECTORY hostPath now, not a single file -- see the top-of-file
        # "MOUNTS THE DIRECTORY, NOT THE FILE" comment for why. type:
        # Directory (not DirectoryOrCreate) so this still fails fast if
        # the ONE-TIME SETUP above wasn't done, same fail-fast intent as
        # the old type: File had.
        - name: watch-history
          hostPath:
            path: /data/obsidian_vault/_system/specialist-agents/movies
            type: Directory
  selector:
    matchLabels:
      app: movies-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: movies-mcp
  namespace: ai-mcp
spec:
  selector:
    app: movies-mcp
  ports:
    - port: 8000
      targetPort: 8000
      name: http
