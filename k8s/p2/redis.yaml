# Redis for Honcho — cache + queue-management layer (not the source of
# truth: that's Postgres). emptyDir is fine here: losing Redis on a pod
# restart loses cached data and in-flight queue state, not committed
# observations/memory, so a PVC isn't worth the extra moving part.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-memory
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.2
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-memory
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
