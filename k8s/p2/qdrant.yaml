# Qdrant — vector storage backend for Honcho's memory embeddings.
# Honcho has native support for Qdrant as its vector_store backend
# (VECTOR_STORE_TYPE=qdrant), so this isn't a bolt-on: Honcho talks to it
# directly for all embedding storage/search. Postgres (postgres.yaml) still
# holds the relational data (workspaces, peers, sessions, messages) — Qdrant
# only holds vectors.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: ai-memory
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: ai-memory
  labels:
    app: qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate   # single PVC, only one writer at a time
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai-memory
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
