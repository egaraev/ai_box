# Honcho — memory library (API server + Deriver background worker), the
# core of P2. Image is the real published ghcr.io/plastic-labs/honcho:latest
# (confirmed pullable — built by their own docker-build.yml workflow from
# the same Dockerfile their docker-compose.yml.example builds locally), so
# no in-cluster image build is needed, same as llama-swap/Open WebUI.
#
# Vector store: pgvector (Postgres), NOT Qdrant. Originally planned to route
# vectors to Qdrant (Honcho has native VECTOR_STORE_TYPE=qdrant support), but
# the published image doesn't bundle the qdrant-client Python package (it's
# a real optional extra in Honcho's pyproject.toml, just not one their
# Dockerfile's build-arg exposes) -- using it crashes both the API and
# scripts/configure_embeddings.py with ModuleNotFoundError. Fixing that would
# mean building/maintaining a custom image, which isn't worth it just to use
# Qdrant instead of the pgvector Honcho already needs anyway for relational
# data. The qdrant.yaml deployment was removed from this directory.
#
# LLM routing: Honcho requires an LLM provider for memory extraction
# (deriver), dialectic chat, summarization, and dream consolidation, PLUS a
# separate embeddings endpoint (EMBED_MESSAGES=true by default). All of it is
# routed through LiteLLM (k8s/p1/litellm.yaml) rather than straight to
# llama-swap, via per-feature OVERRIDES__BASE_URL -- same two llama-swap
# roster entries as before, LiteLLM just now sits in between:
#   - qwen3-1.7b-gpu          -- deriver/dialectic/summary/dream (tool-calling
#     capable, dedicated to Honcho on its own GPU -- see
#     k8s/p1/llama-swap-configmap.yaml's own comment; RENAMED 2026-09-16 from
#     qwen3-1.7b-cpu after the second-GPU migration moved it off CPU)
#   - nomic-embed-text-v1.5   -- embeddings
# LLM_OPENAI_API_KEY is no longer a "none" placeholder -- LiteLLM enforces a
# real master_key (see litellm.yaml's top comment for why), so it's now an
# explicit env: entry on both Deployments below, sourced from litellm-secret
# (created directly on the cluster, same as postgres-secret -- see
# k8s/secrets/README.md).
#
# DIALECTIC_MAX_INPUT_TOKENS/DERIVER_MAX_INPUT_TOKENS were originally
# reduced from Honcho's defaults (100000/25000) just to fit inside
# qwen3-1.7b-gpu's -c 32768 context (named qwen3-1.7b-cpu at the time) --
# that was a CONTEXT-SIZE constraint
# only, never a latency one, and it left DIALECTIC_MAX_INPUT_TOKENS at
# 28000, which turned out to be the real cause of the "Jarvis just hangs"
# reports (2026-09-15).
#
# DIALECTIC_MAX_INPUT_TOKENS 28000 -> 1500 CHANGED 2026-09-15: real
# production logs showed Hermes's `plugins.memory.honcho.session` hitting
# "Request timed out after 30.0s" repeatedly, every single time dialectic
# fired, blocking the reply behind it -- that's the actual mechanism behind
# needing 2-3 nudges before Jarvis answers. Root-caused via
# bench_qwen17b_prefill_scaling.py (hits llama-swap's native /completion
# endpoint directly, real llama.cpp timings, zero concurrency): prefill
# speed on this model's current -t 4 degrades as context grows (94.66 t/s
# at 1,281 tokens -> 89.60 t/s at 2,601 -> 74.47 t/s at 5,161), and the
# 30s wall lands right around 2,600 tokens even with NOTHING else
# contending for the model -- and it keeps getting worse, not linearly:
# 59.24 t/s / 174.2s at 10,321 tokens. A separate test at ~25k tokens
# (matching the old 28000 setting) didn't even return in 300s. So the 30s timeouts
# were never really about thread contention with arch-router/nomic-embed
# (both independently load-tested clean, see chat history) -- they were
# guaranteed by the token budget being ~10x too large for what this CPU
# model can process in time, full stop.
#
# 1500 chosen with real margin, not just under the wall: interpolating the
# benchmark curve, 1500 tokens should land around ~15s prefill, leaving
# headroom below the 30s ceiling for real-world contention and for the
# system-prompt/tool-schema overhead Honcho adds on top of this budget
# (see original comment above -- this setting doesn't include that).
# Dialectic is a retrieval AGENT (search_memory/search_messages/
# get_observation_context/grep_messages/temporal search), not a
# raw-history dump, so a smaller budget means it retrieves less per
# answer, not that it breaks -- confirmed against Honcho's own docs
# (https://honcho.dev/docs/v3/contributing/configuration), default is
# 100000, aibox was already running well below that. NOT YET CONFIRMED
# for actual answer quality -- after this deploys, ask Jarvis a couple of
# real memory-recall questions (not just watch for the timeout going away)
# to check the retrieval agent still gives useful answers at this budget,
# not just fast ones. If answers come back noticeably thinner, raise this
# gradually rather than jumping back toward 28000 -- and consider capping
# DIALECTIC_LEVELS__*__MAX_TOOL_ITERATIONS too, since dialectic's real
# latency is however many sequential tool-call round trips it makes, each
# one a separate hit on this same model.
#
# DERIVER_MAX_INPUT_TOKENS is still 20000 -- same model, almost certainly
# hits the identical wall, just less visibly since it runs in the
# background rather than blocking a live reply. Left alone for now
# (Eldar's call, 2026-09-15) -- revisit if deriver-related slowness shows
# up the same way dialectic's did.
apiVersion: v1
kind: ConfigMap
metadata:
  name: honcho-config
  namespace: ai-memory
data:
  LOG_LEVEL: "INFO"
  NAMESPACE: "honcho"

  # DB_CONNECTION_URI is deliberately NOT here -- it embeds the Postgres
  # password, so it comes from postgres-secret (envFrom on both Deployments
  # below) instead of this ConfigMap. See k8s/secrets/README.md.

  CACHE_ENABLED: "true"
  CACHE_URL: "redis://redis:6379/0?suppress=true"

  AUTH_USE_AUTH: "false"

  # LLM_OPENAI_API_KEY moved out of here -- it's now the real litellm-secret
  # master_key, set as an explicit env: entry on both Deployments below.

  VECTOR_STORE_TYPE: "pgvector"

  EMBED_MESSAGES: "true"
  EMBEDDING_VECTOR_DIMENSIONS: "768"
  EMBEDDING_MODEL_CONFIG__TRANSPORT: "openai"
  EMBEDDING_MODEL_CONFIG__MODEL: "nomic-embed-text-v1.5"
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"

  # This is the flag Eldar's aibox architecture notes flag as critical:
  # without it, the deriver batches work behind a token threshold and no
  # observations get created for a low-traffic single-user setup.
  DERIVER_FLUSH_ENABLED: "true"
  DERIVER_MAX_INPUT_TOKENS: "20000"
  DERIVER_MODEL_CONFIG__TRANSPORT: "openai"
  DERIVER_MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"

  SUMMARY_MODEL_CONFIG__TRANSPORT: "openai"
  SUMMARY_MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"

  DIALECTIC_MAX_INPUT_TOKENS: "1500"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"

  DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_DEDUCTION_MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"
  DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_INDUCTION_MODEL_CONFIG__MODEL: "qwen3-1.7b-gpu"
  DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.ai-models.svc.cluster.local:4000/v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-api
  namespace: ai-memory
  labels:
    app: honcho-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honcho-api
  template:
    metadata:
      labels:
        app: honcho-api
    spec:
      containers:
        - name: honcho-api
          image: ghcr.io/plastic-labs/honcho:latest
          # Matches docker-compose's api service entrypoint exactly: runs DB
          # migrations, then starts the API server.
          command: ["sh", "docker/entrypoint.sh"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LLM_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master_key
          envFrom:
            - configMapRef:
                name: honcho-config
            - secretRef:
                name: postgres-secret
      # No initContainer wait-for-postgres here: the entrypoint script's own
      # migration step (provision_db.py) will retry/fail fast and the
      # Deployment will just restart the pod -- acceptable for a single-node
      # home cluster where postgres starts in a couple seconds anyway.
---
apiVersion: v1
kind: Service
metadata:
  name: honcho-api
  namespace: ai-memory
spec:
  selector:
    app: honcho-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-deriver
  namespace: ai-memory
  labels:
    app: honcho-deriver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-deriver
  template:
    metadata:
      labels:
        app: honcho-deriver
    spec:
      containers:
        - name: honcho-deriver
          image: ghcr.io/plastic-labs/honcho:latest
          # Matches docker-compose's deriver service entrypoint exactly.
          command: ["/app/.venv/bin/python", "-m", "src.deriver"]
          env:
            - name: LLM_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master_key
          envFrom:
            - configMapRef:
                name: honcho-config
            - secretRef:
                name: postgres-secret
