# Honcho — memory library (API server + Deriver background worker), the
# core of P2. Image is the real published ghcr.io/plastic-labs/honcho:latest
# (confirmed pullable — built by their own docker-build.yml workflow from
# the same Dockerfile their docker-compose.yml.example builds locally), so
# no in-cluster image build is needed, same as llama-swap/Open WebUI.
#
# Vector store: pgvector (Postgres), NOT Qdrant. Originally planned to route
# vectors to Qdrant (Honcho has native VECTOR_STORE_TYPE=qdrant support), but
# the published image doesn't bundle the qdrant-client Python package (it's
# a real optional extra in Honcho's pyproject.toml, just not one their
# Dockerfile's build-arg exposes) -- using it crashes both the API and
# scripts/configure_embeddings.py with ModuleNotFoundError. Fixing that would
# mean building/maintaining a custom image, which isn't worth it just to use
# Qdrant instead of the pgvector Honcho already needs anyway for relational
# data. The qdrant.yaml deployment was removed from this directory.
#
# LLM routing: Honcho requires an LLM provider for memory extraction
# (deriver), dialectic chat, summarization, and dream consolidation, PLUS a
# separate embeddings endpoint (EMBED_MESSAGES=true by default). All of it is
# routed to llama-swap's OpenAI-compatible endpoint via per-feature
# OVERRIDES__BASE_URL, using two new CPU-only entries added to the llama-swap
# roster (see k8s/p1/llama-swap-configmap.yaml):
#   - qwen3-1.7b-cpu          -- deriver/dialectic/summary/dream (tool-calling
#     capable, dedicated to Honcho so background memory work never contends
#     for GPU with an active Open WebUI chat session)
#   - nomic-embed-text-v1.5   -- embeddings (Honcho's client SDK still
#     requires *some* value in LLM_OPENAI_API_KEY to initialize even though
#     every actual call is routed elsewhere -- "none" below is a placeholder,
#     matching the same pattern already used for Open WebUI's OPENAI_API_KEY)
#
# DIALECTIC_MAX_INPUT_TOKENS/DERIVER_MAX_INPUT_TOKENS are reduced from
# Honcho's defaults (100000/25000) to fit inside qwen3-1.7b-cpu's -c 32768
# context, with headroom for the system prompt, tools, and output.
apiVersion: v1
kind: ConfigMap
metadata:
  name: honcho-config
  namespace: ai-memory
data:
  LOG_LEVEL: "INFO"
  NAMESPACE: "honcho"

  # DB_CONNECTION_URI is deliberately NOT here -- it embeds the Postgres
  # password, so it comes from postgres-secret (envFrom on both Deployments
  # below) instead of this ConfigMap. See k8s/secrets/README.md.

  CACHE_ENABLED: "true"
  CACHE_URL: "redis://redis:6379/0?suppress=true"

  AUTH_USE_AUTH: "false"

  # Placeholder only -- every actual LLM/embedding call below is routed to
  # llama-swap via an explicit OVERRIDES__BASE_URL, which ignores API keys.
  LLM_OPENAI_API_KEY: "none"

  VECTOR_STORE_TYPE: "pgvector"

  EMBED_MESSAGES: "true"
  EMBEDDING_VECTOR_DIMENSIONS: "768"
  EMBEDDING_MODEL_CONFIG__TRANSPORT: "openai"
  EMBEDDING_MODEL_CONFIG__MODEL: "nomic-embed-text-v1.5"
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"

  # This is the flag Eldar's aibox architecture notes flag as critical:
  # without it, the deriver batches work behind a token threshold and no
  # observations get created for a low-traffic single-user setup.
  DERIVER_FLUSH_ENABLED: "true"
  DERIVER_MAX_INPUT_TOKENS: "20000"
  DERIVER_MODEL_CONFIG__TRANSPORT: "openai"
  DERIVER_MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"

  SUMMARY_MODEL_CONFIG__TRANSPORT: "openai"
  SUMMARY_MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"

  DIALECTIC_MAX_INPUT_TOKENS: "28000"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"

  DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_DEDUCTION_MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"
  DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_INDUCTION_MODEL_CONFIG__MODEL: "qwen3-1.7b-cpu"
  DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://llama-swap.ai-models.svc.cluster.local:8080/v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-api
  namespace: ai-memory
  labels:
    app: honcho-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honcho-api
  template:
    metadata:
      labels:
        app: honcho-api
    spec:
      containers:
        - name: honcho-api
          image: ghcr.io/plastic-labs/honcho:latest
          # Matches docker-compose's api service entrypoint exactly: runs DB
          # migrations, then starts the API server.
          command: ["sh", "docker/entrypoint.sh"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: honcho-config
            - secretRef:
                name: postgres-secret
      # No initContainer wait-for-postgres here: the entrypoint script's own
      # migration step (provision_db.py) will retry/fail fast and the
      # Deployment will just restart the pod -- acceptable for a single-node
      # home cluster where postgres starts in a couple seconds anyway.
---
apiVersion: v1
kind: Service
metadata:
  name: honcho-api
  namespace: ai-memory
spec:
  selector:
    app: honcho-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-deriver
  namespace: ai-memory
  labels:
    app: honcho-deriver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-deriver
  template:
    metadata:
      labels:
        app: honcho-deriver
    spec:
      containers:
        - name: honcho-deriver
          image: ghcr.io/plastic-labs/honcho:latest
          # Matches docker-compose's deriver service entrypoint exactly.
          command: ["/app/.venv/bin/python", "-m", "src.deriver"]
          envFrom:
            - configMapRef:
                name: honcho-config
            - secretRef:
                name: postgres-secret
