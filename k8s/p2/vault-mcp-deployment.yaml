# vault-mcp: the HTTP MCP server Hermes calls to search and ingest into
# Eldar's Obsidian vault (search_vault/ingest_note/ingest_file). Source
# lives in apps/vault-mcp/ in this repo -- built and run locally on aibox,
# no registry involved, same reasoning as media-gen-mcp (one less moving
# part on a single-user home cluster). imagePullPolicy: IfNotPresent means
# k3s/containerd uses whatever image tag already exists on the node instead
# of trying (and failing) to pull it from Docker Hub.
#
# Lives in this k8s/p2/ directory (not a new k8s/vault/ dir) purely so
# ArgoCD's existing aibox-p2 Application (k8s/bootstrap/p2-app.yaml, which
# watches the whole k8s/p2 path regardless of what namespace a manifest in
# it declares) picks this up automatically -- same trick
# media-gen-mcp-deployment.yaml uses living under k8s/media-gen/ while
# declaring namespace: ai-mcp. Runs in ai-mcp per README.md's namespace
# table ("All MCP server pods"), same as media-gen-mcp.
#
# BUILD / DEPLOY (run on aibox, not from this repo checkout on its own --
# the image has to exist as a local containerd/docker image on the node
# before this Deployment can start):
#   cd ~/repos/aibox-platform/apps/vault-mcp
#   docker build -t vault-mcp:latest .
#   docker save vault-mcp:latest | sudo k3s ctr images import -
# After editing server.py/vault_core.py/upload_web.py, repeat both of those, then:
#   kubectl rollout restart deployment/vault-mcp -n ai-mcp
# (a plain `git push` + ArgoCD sync alone does NOT pick up a code change --
# only a manifest change self-triggers; the image itself has to be rebuilt
# and reimported by hand first, same gap as media-gen-mcp.)
#
# WEB UPLOAD PAGE (2026-09-17): this same pod now also runs upload_web.py,
# a plain browser upload form for the vault (see upload_web.py/vault_core.py's
# own top comments for why it's a second process in the same container
# rather than a separate service or routes bolted onto the MCP server).
# Exposed via its own vault-uploader NodePort Service below, :8081 -> :30081
# -- same plain-NodePort pattern as comfyui-nodeport and router-dashboard,
# no ingress/auth yet (Eldar's explicit call, 2026-09-17: "for now lets go
# with nodeport just like all other services we have now" -- an
# ingress/reverse proxy for LAN-friendly URLs + auth is a deliberate next
# step, not done here). Reachable today from aibox's own LAN at
# http://<aibox-lan-ip>:30081/.
#
# When THIS FILE itself changes -- `kubectl apply -f` it directly (or let
# ArgoCD sync k8s/p2 the normal way) in addition to any image rebuild:
#   kubectl apply -f k8s/p2/vault-mcp-deployment.yaml
#
# TWO VOLUMES, both plain hostPath, both fully owned by this pod (no
# cross-pod reads into another pod's storage -- see server.py's own
# top-of-file comment for the multi-attempt story of why that mattered):
# - vault-data: the real Obsidian vault at /data/obsidian_vault (same
#   hostPath scripts/vault_sync.py already reads/writes on the host
#   directly, and the SAME path k8s/p3/hermes-agent.yaml now also mounts
#   read-write into Hermes's own pod) -- mounted read-write here too so
#   ingest_note/ingest_file can create Inbox/ and Attachments/ entries.
#   type: Directory (not DirectoryOrCreate) since the vault already exists;
#   if it's ever missing this should fail loudly rather than silently start
#   writing into a freshly-created empty directory that isn't really the
#   vault.
# - shared-output: same hostPath (/data/media-gen-output) already shared
#   between hermes-agent and media-gen-mcp for OUTGOING generated-media
#   delivery. Mounted read-only -- ingest_file only ever needs to read a
#   file placed here, never write to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-mcp
  namespace: ai-mcp
  labels:
    app: vault-mcp
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: vault-mcp
    spec:
      containers:
        - name: vault-mcp
          image: vault-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8081
              name: upload-http
          env:
            - name: QDRANT_URL
              value: "http://qdrant.ai-memory.svc.cluster.local:6333"
            - name: VAULT_PATH
              value: "/data/obsidian_vault"
            - name: SHARED_INPUT_DIR
              value: "/shared-output"
            # Same base_url/auth pattern media-gen-mcp/hermes-agent/open-webui
            # already use to reach LiteLLM (k8s/p1/litellm.yaml): Bearer auth
            # against its LITELLM_MASTER_KEY, sourced from the same
            # litellm-secret Secret.
            - name: LITELLM_URL
              value: "http://litellm.ai-models.svc.cluster.local:4000/v1"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master_key
          volumeMounts:
            - name: vault-data
              mountPath: /data/obsidian_vault
            - name: shared-output
              mountPath: /shared-output
              readOnly: true
          # Bumped 2026-09-17 (was 100m/128Mi request, 500m/768Mi limit):
          # this pod now runs TWO Python processes (server.py + upload_web.py),
          # each importing the same heavy stack (opencv-python-headless via
          # camelot, pymupdf, pytesseract+Pillow) -- the old 768Mi limit was
          # sized for one process's worth of those imports, not two.
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "1536Mi"
      volumes:
        - name: vault-data
          hostPath:
            path: /data/obsidian_vault
            type: Directory
        - name: shared-output
          hostPath:
            path: /data/media-gen-output
            type: DirectoryOrCreate
  selector:
    matchLabels:
      app: vault-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: vault-mcp
  namespace: ai-mcp
spec:
  selector:
    app: vault-mcp
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
# Separate Service object (not a second port on the one above) so the
# existing ClusterIP Service Hermes uses for MCP stays untouched -- same
# reasoning comfyui-nodeport was added as its own Service instead of
# editing comfyui's existing one. Same pod (selector: app: vault-mcp),
# just a second, externally-reachable way in.
apiVersion: v1
kind: Service
metadata:
  name: vault-uploader
  namespace: ai-mcp
spec:
  type: NodePort
  selector:
    app: vault-mcp
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      name: upload-http
