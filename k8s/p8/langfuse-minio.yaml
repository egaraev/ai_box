# Minio for LangFuse v3 — the S3-compatible blob store LangFuse uses for
# event/media uploads (LANGFUSE_S3_EVENT_UPLOAD_* / _MEDIA_UPLOAD_* below).
# NEW dedicated deployment: nothing else on this cluster needs S3-shaped
# storage today, so unlike Postgres/Redis (reused from k8s/p2, see
# langfuse.yaml's top comment) this one genuinely earns its own moving part.
#
# NOT YET VERIFIED (2026-09-17): image tag `minio/minio:latest` -- a pinned
# recent release tag would be better practice (avoids surprise upgrades on
# pod reschedule), but no specific current tag was independently confirmed
# this session. Consider pinning to whatever `minio/minio:RELEASE.<date>`
# is current before/at first real deploy.
#
# Credentials: new `langfuse-minio-secret` (namespace ai-observe),
# MINIO_ROOT_USER/MINIO_ROOT_PASSWORD -- the standard minio image's own env
# vars. See k8s/secrets/README.md for the kubectl command.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-minio-data
  namespace: ai-observe
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-minio
  namespace: ai-observe
  labels:
    app: langfuse-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: langfuse-minio
  template:
    metadata:
      labels:
        app: langfuse-minio
    spec:
      containers:
        - name: minio
          # FIXED 2026-09-17, first real deploy: minio/minio:latest on
          # Docker Hub -- ErrImagePull, confirmed real and current, not a
          # transient registry blip: MinIO stopped publishing free images
          # to Docker Hub in October 2025 (widely hit -- see e.g.
          # github.com/dfpc-coe/CloudTAK#1803, github.com/milvus-io/
          # milvus#53430), quay.io is the working replacement everyone
          # moved to. Pinned to a real dated release tag rather than a
          # tag that might not exist on quay.io either -- "latest" isn't
          # guaranteed to exist per-registry the way Docker Hub's did.
          image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-minio-secret
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-minio
  namespace: ai-observe
spec:
  selector:
    app: langfuse-minio
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
---
# One-shot bucket creation, using the mc (Minio Client) image rather than
# hand-rolling an init script -- `mc mb --ignore-existing` is idempotent, so
# this Job is safe to `kubectl apply -f` repeatedly (e.g. after any other
# change to this file triggers a re-sync) without erroring on buckets that
# already exist. Two buckets, matching LANGFUSE_S3_EVENT_UPLOAD_BUCKET and
# LANGFUSE_S3_EVENT_MEDIA_UPLOAD_BUCKET... (see langfuse.yaml) --
# langfuse-events (raw ingested event blobs) and langfuse-media (uploaded
# media referenced from traces, e.g. images passed to multimodal calls).
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-minio-create-buckets
  namespace: ai-observe
spec:
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # Same Docker-Hub-removal fix as the minio container above --
          # quay.io/minio/mc is the paired client image MinIO publishes
          # alongside quay.io/minio/minio (same dated-release convention).
          # NOT independently confirmed this exact tag exists on quay.io
          # for mc specifically (only minio/minio's tag was verified
          # against a real fix people applied) -- check `kubectl logs -n
          # ai-observe job/langfuse-minio-create-buckets` on first deploy;
          # if this one tag is missing, quay.io/minio/mc:latest or the
          # nearest dated tag on quay.io's tag list is the fallback.
          image: quay.io/minio/mc:RELEASE.2024-08-17T01-24-54Z
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set langfuse-minio http://langfuse-minio.ai-observe.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing langfuse-minio/langfuse-events
              mc mb --ignore-existing langfuse-minio/langfuse-media
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-minio-secret
                  key: MINIO_ROOT_PASSWORD
