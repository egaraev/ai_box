# promtail: log SHIPPER, tails every container's log file on the node and
# pushes to Loki (loki.yaml). DaemonSet -- single node, so one pod, same
# reasoning as node-exporter.yaml, and for the same reason (it needs to
# read files that live on the HOST filesystem, not inside its own
# container) it needs hostPath mounts, not a regular volume.
#
# KNOWN FUTURE MIGRATION (flagging honestly, not acted on here): Grafana
# has been steering users toward Grafana Alloy as promtail's replacement --
# promtail is in maintenance mode upstream (bugfixes only, no new
# features), with Alloy positioned as the actively-developed successor.
# Not switched to Alloy in this build: the task asked for promtail
# specifically, promtail still works and ships fine with Loki 3.x, and
# Alloy is a bigger surface (a general-purpose telemetry collector, not
# just a log shipper) than this homelab-scale, one-node log pipeline needs
# today -- same "don't add infra weight without a real reason" call this
# whole repo keeps making. Worth revisiting if promtail ever stops
# receiving even bugfixes, or if this stack later wants Alloy's broader
# collection (traces, host metrics via a single agent) instead of separate
# node-exporter/promtail processes.
#
# grafana/promtail:3.3.0 -- kept at the task's given default. A live search
# this session (2026-09-17) confirmed Loki itself is now well past 3.3.0
# (see loki.yaml's 3.7.6), but did NOT turn up a clearly-current matching
# promtail tag to verify against (promtail's Docker Hub tag history is
# noisier/harder to pin down live than Loki's GitHub releases were) --
# flagging this as genuinely unverified rather than guessing a newer number.
# Loki's push API (the only thing promtail talks to Loki over) has stayed
# stable across this version range, so a promtail/Loki version mismatch
# here is low-risk, but worth a quick check of
# https://hub.docker.com/r/grafana/promtail/tags before first deploy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: ai-observe
---
# Read-only, cluster-wide -- needed so promtail's kubernetes_sd_configs
# pipeline (in the ConfigMap below) can look up each log file's owning
# pod/namespace/labels and attach them as Loki stream labels (the same way
# Prometheus's pod-role scrape config in prometheus.yaml needs pod
# metadata). No write access anywhere -- promtail only ever reads pod
# metadata and local log files, never touches the API server otherwise.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: ai-observe
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ai-observe
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080

    positions:
      # Tracks per-file read offsets across pod restarts so a promtail
      # restart doesn't re-ship (or skip) logs -- standard promtail
      # pattern, written to the same hostPath-backed emptyDir-equivalent
      # every published example uses.
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.ai-observe.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      # Standard k8s-pod-logs promtail pattern: discover every pod on THIS
      # node via the API server, then read its log files directly off disk
      # at the kubelet's well-known path (/var/log/pods/<namespace>_<pod>_
      # <uid>/<container>/*.log -- a symlink-farm the kubelet itself
      # maintains, same directory `kubectl logs` reads from under the
      # hood). relabel_configs below attach namespace/pod/container as Loki
      # labels so Grafana's Loki datasource can filter by them the same way
      # `kubectl logs -n <ns> <pod>` would.
      # NOTE: this discovers pods across the WHOLE cluster (kubernetes_sd
      # role: pod has no per-node filter), but since single-node k3s means
      # every pod's log file already only exists locally under /var/log/pods
      # on aibox's own disk, the __path__ glob built below simply never
      # matches anything for a (hypothetical) pod on a different node --
      # harmless today, and the standard pattern most published promtail
      # DaemonSet examples use as-is rather than adding node-name filtering.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages: []
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: ai-observe
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.3.0
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - containerPort: 9080
              name: http-metrics
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            # /var/lib/docker/containers isn't used on k3s (containerd, not
            # dockershim), but /var/log/pods entries are themselves
            # symlinks into containerd's own log storage under
            # /var/lib/rancher/k3s or similar host paths -- mounting the
            # generic /var/log tree (not just /var/log/pods) so those
            # symlinks resolve correctly from inside the container, same
            # pattern the upstream promtail DaemonSet example uses.
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: var-log
          hostPath:
            path: /var/log
        - name: positions
          hostPath:
            path: /var/log/promtail-positions
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: ai-observe
spec:
  # ClusterIP, and only exists for promtail's own /metrics (how MANY logs
  # it's shipping, drop counts, etc.) -- not something Eldar browses, not
  # even something Prometheus scrapes by default today (no
  # prometheus.io/scrape annotation set here; add one later if
  # promtail-about-promtail metrics turn out to matter).
  selector:
    app: promtail
  ports:
    - port: 9080
      targetPort: 9080
      name: http-metrics
