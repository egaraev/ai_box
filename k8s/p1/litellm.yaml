# LiteLLM — the L2.5 model router. Sits between every caller (Hermes,
# Honcho, Open WebUI) and llama-swap, so callers stop hardcoding literal
# GGUF-roster model names and instead call a stable name -- either a real
# model passed straight through, or "auto", which a custom pre-call hook
# resolves to a real model via Arch-Router-1.5B's semantic classification.
#
# ARCHITECTURAL DECISION (via AskUserQuestion): Arch-Router-1.5B's "official"
# home is Katanemo's own gateway product (now rebranded Plano, formerly
# Arch) -- a separate Envoy-based proxy purpose-built for this model. We
# deliberately did NOT deploy that. Instead this file wires the classifier
# in as a small custom LiteLLM pre-call hook (litellm_settings.callbacks,
# an officially-documented LiteLLM extension point -- not a hack), calling
# arch-router-1.5b as just one more CPU-only entry in the existing
# llama-swap roster. Reasoning: this whole build has consistently avoided
# adding infrastructure weight without a real reason (dropped Qdrant rather
# than maintain a custom Honcho image, skipped Docker-in-Docker for Hermes'
# terminal backend) -- a whole new Envoy-based gateway service just to route
# between two GPU models today would be exactly that. Trade-off accepted:
# custom_router_hook.py below is hand-rolled glue, not an official
# integration, and needs updating by hand as new routes/models are added.
#
# ROUTES (2026-09-07, Eldar's own naming; vision target briefly swapped to
# qwopus-general 2026-09-10, then REVERTED back to qwen3.8-27b-Expert-Vision
# the same week after qwopus performed badly in practice -- qwopus-general's
# model_list entry itself removed 2026-09-13 once confirmed genuinely
# unused, no lingering reference kept). Five real destinations -- vision
# (deterministic, image attached) -> qwen3.8-27b-Expert-Vision, medical ->
# medgemma-1.5-4b, casual (quick/easy/regular messages, plus a deterministic
# CASUAL_TRIGGERS keyword fast-path added 2026-09-13 for greetings/pings --
# see that section further down) -> hermes3-llama-3.1-8b, other
# (low-confidence classification that doesn't fit any other route, FIXED
# 2026-09-13 -- used to silently share "reasoning"'s target, see the
# ROUTE_TO_MODEL comment on that entry) -> also hermes3-llama-3.1-8b,
# reasoning (the true default/catch-all) -> qwen3.8-27b-Expert. Eldar's own
# call: the 27B model already covers most things on its own, so
# "casual"/"medical"/"other" only need to catch the cases genuinely better
# served by a smaller/specialist model, not become the common path --
# "reasoning" stays the safe default whenever the classifier is unsure.
# Growing this list further (coder, cloud fallback -- once those GGUF files
# land on aibox and get roster entries in llama-swap-configmap.yaml) is a
# pure data change in custom_router_hook.py, no new plumbing.
#
# DEPENDENCY: hermes3-llama-3.1-8b and medgemma-1.5-4b's GGUF files must
# actually be on aibox (see the "ACTIVATED 2026-09-07" comments in
# llama-swap-configmap.yaml for the download commands) before this file is
# deployed -- otherwise the classifier can pick a route whose backing
# llama-swap model doesn't exist, and that request fails with a real
# user-facing error instead of falling back gracefully (the hook's error
# handling only covers the *classifier* call failing, not the *routed-to*
# model being unavailable).
#
# AUTH: general_settings.master_key is set (from the litellm-secret Secret,
# created directly on the cluster -- see k8s/secrets/README.md, never
# committed). Every other internal service on aibox runs trust/no-auth
# (Postgres, Honcho AUTH_USE_AUTH=false) since there's no public ingress --
# LiteLLM gets a real key anyway because it's the one place multiple
# unrelated callers (Hermes, Honcho, Open WebUI, eventually more agents)
# converge, and LiteLLM's own docs default every real deployment example to
# setting one. No database is configured -- DB is only needed for
# dynamically-issued virtual keys / persisted spend tracking / the admin
# UI, none of which this single-user home setup needs. One static
# master_key checked against every request is enough.
#
# KNOWN QUIRK (hit 2026-09-07, Hermes -> "HTTP 400: No connected db."):
# even with a correct master_key and no DB configured, LiteLLM's auth layer
# still attempts a DB-backed virtual-key lookup on some request paths and
# raises this misleading error instead of just proceeding -- confirmed a
# real LiteLLM bug/quirk (litellm#4880, litellm#2532, litellm#12273), not an
# actual outage: Eldar verified the master_key matched byte-for-byte in both
# ai-models and ai-agents and Hermes's pod had OPENAI_API_KEY set correctly.
# general_settings.allow_requests_on_db_unavailable: true (below) is
# LiteLLM's own documented flag for exactly this DB-less deployment shape.
#
# MEDIA-GEN BUSY FALLBACK (added 2026-09-08): custom_router_hook.py now
# checks the same Redis busy flag (media-gen:busy, ai-memory Redis) that
# apps/media-gen-mcp/server.py sets/clears -- see that file's own top
# comment for the full "full swap" design. When set, EVERY "auto" request
# (all four routes uniformly, per Eldar's own simplification -- "i do not
# think there will be so many, this must simplify the setup") is redirected
# to the openrouter-fallback model_list entry below instead of a local
# model, before the classifier even runs. Real OPENROUTER_API_KEY now
# exists (Eldar added it to a local .env on aibox, kept out of git) -- see
# k8s/secrets/README.md's openrouter-secret section for how it gets into
# the cluster (kubectl, never through this repo or the assistant).
# Model choice: Eldar picked "Google Gemini Flash tier" via AskUserQuestion
# (cheap, fast, multimodal -- vision requests share this one fallback too,
# so it can't be text-only). NOT FULLY VERIFIED: the pinned slug
# (google/gemini-3.8-flash) came from fetching openrouter.ai/models/
# /collections/vision-models live, and two separate fetches of that page
# returned slightly different version numbers (3.7 vs 3.8) -- OpenRouter's
# catalog moves fast. Spot-check the exact slug against
# https://openrouter.ai/models before/at first real deploy and fix the
# model_list entry below if it's changed.
# ALSO NOT YET VERIFIED: whether redis-py is bundled in the
# ghcr.io/berriai/litellm:main-latest image -- LiteLLM's proxy documents
# Redis caching as a first-class built-in feature so it's very likely
# present, but this wasn't confirmed against the live pod (no shell access
# to it from this session). custom_router_hook.py's redis import is wrapped
# in try/except specifically for this -- if it's missing, the busy-check
# just logs a warning and always returns "not busy" (degrades to today's
# behavior) instead of crashing the whole router. Check
# `kubectl logs -n ai-models -l app=litellm` on first deploy for an
# ImportError, same discipline as the P3 honcho-ai risk.
#
# GENERAL AUTO-FALLBACK (added 2026-09-08): closes a real gap the media-gen
# busy-fallback above does NOT cover -- that one only fires when Redis's
# media-gen:busy flag is set. If a local model fails for any OTHER reason
# (the qwen3.8-27b-Expert intermittent CUDA OOM investigated the same day is
# exactly this case), the request just hard-fails back to the caller as a
# real 500 -- no fallback. Fixed using LiteLLM's own native Router-level
# fallback mechanism (litellm_settings.num_retries + .fallbacks below), NOT
# more custom_router_hook.py code -- unlike the busy-check (which has to run
# BEFORE the classifier even picks a model), this is a documented,
# officially-supported LiteLLM proxy feature that operates AFTER a real
# model is chosen and its completion call fails
# (docs.litellm.ai/docs/proxy/reliability). Confirmed via that doc before
# writing this: fallbacks cover generic backend errors (429, 500, etc, not
# just RateLimitError/ContextWindowExceededError), and trigger only after
# num_retries attempts against the ORIGINAL model are exhausted -- so an
# intermittent OOM gets one real local retry (llama-swap reloading the
# crashed process) before ever touching the cloud, matching the "prefer
# local, cloud only as last resort" intent everywhere else in this file.
# num_retries: 1 chosen deliberately low -- each retry means a full model
# reload for a 27B GGUF (real time cost), so this isn't a lever to push
# higher without good reason. request_timeout/allowed_fails/cooldown_time
# deliberately NOT set -- a real observed reasoning-route response took
# 4m45s to legitimately complete (large output, not stuck), so any global
# request_timeout risks killing genuinely slow-but-successful generations;
# cooldown_time/allowed_fails mainly matter for load-balancing across
# multiple deployments of the same model_name, which doesn't apply here
# (exactly one llama-swap backend per model). Applies to all 4 real routed
# models uniformly, same simplification principle as the busy-fallback
# above. NOT YET CONFIRMED on aibox: whether the interaction between
# custom_router_hook.py's async_pre_call_hook (which rewrites "auto" to a
# real model name before the Router ever sees it) and this native fallback
# actually fires as expected -- LiteLLM's own docs don't address that
# interaction directly, so this needs a real induced-failure test after
# deploy (see the P6-adjacent "Cloud aliases + fallback providers" roadmap
# item), not just a clean-request smoke test.
#
# GENERAL AUTO-FALLBACK, ROUND 2 (same day): the round-1 test (scaling
# llama-swap to 0 replicas, via ArgoCD selfHeal paused on the aibox-p1
# Application) found a real problem -- the classifier call fails fast
# (httpx ConnectError, confirming llama-swap really is unreachable), but the
# actual completion call to the routed model then just HANGS, no fallback,
# no error, for several minutes. Root cause: LiteLLM's default response
# timeout is very long (the underlying openai-client default is on the
# order of 10 minutes) and nothing was set to fail faster, so retries/
# fallback in round 1 were technically wired correctly but functionally
# useless in practice -- Eldar's own bar ("redirect to Cloud once model is
# unavailable, just like we have when image is being generated") wasn't
# met. Fix: stream_timeout added per-model below (originally 20, raised to
# 60 on 2026-09-09 -- see that dated note further down) -- LiteLLM's own docs
# (docs.litellm.ai/docs/proxy/timeout) describe this exact setting as being
# for aborting a "hanging" provider and retrying/falling over quickly,
# distinct from the overall `timeout` (deliberately left unset/default --
# see the 4m45s real-response caveat above, `timeout` bounds the WHOLE
# response so setting it short risks killing a legitimately slow-but-
# working generation). stream_timeout only bounds time-to-FIRST-chunk, so a
# response that's actually streaming tokens (even slowly) is unaffected
# once it starts. Net expected latency before failover: roughly 2x
# stream_timeout (one attempt against the original model, one retry, per
# num_retries: 1) -- not instant like the pre-call busy-flag check (which
# has zero added latency since it never attempts the local model at all),
# but close, and vastly better than the multi-minute hang round 1 hit.
# UNVERIFIED ASSUMPTION, flagged rather than guessed past: stream_timeout
# only has any effect if the caller's request actually sets stream: true --
# whether Hermes's requests to LiteLLM do this was NOT confirmed this
# session (no access to Hermes's own outgoing request body). If Hermes
# calls non-streaming, this fix will have NO effect and the hang will
# recur -- the next induced-failure test after deploy needs to watch
# actual wall-clock time to the fallback firing, not just assume 20s worked
# because the config looks right.
#
# stream_timeout 20 -> 60, 2026-09-09: 20s turned out too short for a real
# cold start, not just for detecting a genuinely-dead backend. Confirmed
# live -- after restarting llama-swap's pod (clearing a VRAM-thrash state
# from a heavy video-gen run earlier that day), completely unrelated plain
# chat messages ("Hey bro", "I am chilling") kept failing with a raw 500
# ("Timeout on reading data from socket"), repeated across multiple
# attempts a Telegram user sent manually. Root cause: llama-swap's own DSL
# policy wants arch-router-1.5b + an embedding model + the main 27B model
# resident together for one chat turn, and loading that whole set from
# cold (nothing warm right after a restart) can plainly take longer than
# 20s to produce a first streamed token -- so every request tripped
# stream_timeout, used its one retry (num_retries: 1) while the load was
# still in progress, and surfaced a raw failure straight to the user since
# general fallback-to-cloud is deliberately OFF here (see the top-of-file
# fallback comment). 60s keeps real-dead-backend detection reasonably fast
# (still nowhere near the old multi-minute hang this was added to fix)
# while giving a cold multi-model load realistic room to finish.
# CLOUD ALIASES FOR DELIBERATE USE (added 2026-09-11): closes the last
# "planned" item from the roadmap that wasn't actually a fallback -- this is
# for a real deliberate pick ("I want Opus for this specific thing"), not
# an automatic failure/busy redirect (those two are covered above and are
# unaffected by this). Two new model_list entries below, each a real
# frontier model reachable only by explicitly asking for it in a message.
#
# MODEL CHOICE: Eldar picked "Claude Opus" + "GPT-5 / OpenAI flagship" via
# AskUserQuestion. Slugs verified live against openrouter.ai (WebFetch,
# 2026-09-11), not assumed from training data -- this model landscape moves
# fast and the assistant's own knowledge cutoff (Jan 2026) is already stale
# here: OpenAI's actual current flagship turned out to be GPT-6 Astra
# (released 2026-09-04/05, days before this was written), not any GPT-5.x
# variant -- GPT-5.4/5.5/5.6 are now the PREVIOUS generation.
# REVISED same day, Eldar's explicit call: GPT-6 Astra ($10/$50 per M tok)
# is deliberately NOT wired here -- same top-of-the-line tier as Anthropic's
# "Fable", both too expensive/precious for routine Hermes use. Eldar's own
# framing: Opus and GPT-5.6 Sol are the "maximum" tier he wants available
# inside Hermes day-to-day; Astra/Fable stay manual-only, reached rarely and
# directly from his PC, never wired into aibox. Aliased to GPT-5.6 Sol
# instead -- OpenAI's own "flagship model in the GPT-5.6 series" (the
# generation below Astra), noticeably cheaper than even Opus:
#   - anthropic/claude-opus-5 -- $5/$25 per M tok (in/out), 1M context
#   - openai/gpt-5.6-sol -- $2/$10 per M tok (in/out), 1.1M context
# Both still real money per call, unlike the local models or even the
# openrouter-fallback (Gemini Flash, cheaper still) used for automatic
# fallback above -- deliberately not wired into any automatic path. Re-
# verify both slugs against openrouter.ai/models the same way before ever
# touching this block again -- this landscape moves fast enough that even
# this comment's "current" framing will go stale.
#
# INVOCATION (Eldar's pick via AskUserQuestion): a phrase-trigger in
# custom_router_hook.py, same deterministic-fast-path pattern already used
# for DEEP_REASONING_TRIGGERS below -- not an Open WebUI dropdown pick (would
# also work as one incidentally, since every model_list entry is visible to
# any OpenAI-compatible client that lists LiteLLM's /models, but that wasn't
# the ask). See CLOUD_ALIAS_TRIGGERS/_wants_cloud_alias() further down.
# Checked BEFORE the media-gen-busy check (unlike every other routing rule
# in this file) -- deliberately: these are plain cloud API calls that don't
# touch aibox's GPU at all, so there's no reason an explicit "use opus"
# request should get silently downgraded to the cheaper Gemini-Flash busy-
# fallback just because ComfyUI happens to be generating something at the
# same moment.
# NOT YET DEPLOYED/TESTED on aibox as of this comment -- needs a real
# induced request ("use opus for this") after rollout to confirm the trigger
# actually fires and the OpenRouter call succeeds with the real key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-models
data:
  config.yaml: |
    model_list:
      # Real models, passed straight through under the same names every
      # caller already uses today -- repointing a service at LiteLLM instead
      # of llama-swap directly needs no other config change on that service.
      - model_name: qwen3.8-27b-Expert
        litellm_params:
          model: openai/qwen3.8-27b-Expert
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          # stream_timeout ADDED 2026-09-08 -- see "GENERAL AUTO-FALLBACK,
          # ROUND 2" comment above. Without this, a genuinely-unreachable
          # backend just hangs on LiteLLM's long default response timeout
          # instead of failing fast into the retry/fallback path.
          stream_timeout: 60
      - model_name: qwen3.8-27b-Expert-Vision
        # This IS the live vision-route target (see top-of-file ROUTES
        # comment) -- briefly swapped out for qwopus-general 2026-09-10,
        # reverted back the same week after qwopus performed badly in
        # practice. qwopus-general's own model_list entry removed 2026-09-13
        # once confirmed genuinely unused (no route, no manual-use alias).
        litellm_params:
          model: openai/qwen3.8-27b-Expert-Vision
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          stream_timeout: 60
      - model_name: qwen3-1.7b-gpu
        # RENAMED from qwen3-1.7b-cpu 2026-09-16 (cleanup after the second-GPU
        # migration -- see k8s/p1/llama-swap-configmap.yaml's own comment):
        # this model moved off CPU onto its own dedicated RTX 3060, so the
        # "-cpu" name was actively confusing (and made it invisible under
        # its expected name in llama-swap's own model list UI). Must match
        # the model key in llama-swap-configmap.yaml exactly.
        litellm_params:
          model: openai/qwen3-1.7b-gpu
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
      - model_name: nomic-embed-text-v1.5
        litellm_params:
          model: openai/nomic-embed-text-v1.5
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
      - model_name: hermes3-llama-3.1-8b
        # SWAPPED IN 2026-09-09, replacing llama-3.1-8b as the "casual"
        # route destination -- llama-3.1-8b's own tool-calling format
        # (Meta's python_tag/ipython builtin-tool syntax) doesn't match
        # the <tool_call>{json}</tool_call> convention Hermes Agent's
        # "peg-native" grammar expects, and it was reliably mangling
        # Hermes's `clarify` tool's array-shaped `questions` param on
        # ordinary casual chat (confirmed live via hermes-agent + litellm
        # logs -- "OpenAIException - The model produced output that does
        # not match the expected peg-native format"). NousResearch's own
        # Hermes-3 fine-tune of the same Llama-3.1-8B base is the direct
        # lineage match for that convention. See
        # k8s/p1/llama-swap-configmap.yaml's hermes3-llama-3.1-8b entry
        # for the actual server command and the real download URL.
        # llama-3.1-8b's and qwen3-8b's model entries were kept unwired for a
        # while in case either was wanted again -- REMOVED 2026-09-16
        # (Eldar's cleanup call, neither ever got used again). Restorable
        # from git history (see k8s/p1/llama-swap-configmap.yaml) if either
        # is actually wanted later; the GGUF files themselves are untouched
        # on disk.
        litellm_params:
          model: openai/hermes3-llama-3.1-8b
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          stream_timeout: 60
      - model_name: llama3.1-aloe-beta-8b
        # REPLACES medgemma-1.5-4b as the "medical" route backend, 2026-09-16
        # (Eldar's call). See the long comment above llama3.1-aloe-beta-8b
        # in llama-swap-configmap.yaml for the full root-cause history
        # (medgemma never reliably stopped/answered) and why this specific
        # model was picked (real medical fine-tune of Llama-3.1-8B, same
        # base/template family as hermes3-llama-3.1-8b; a vision-symbiosis
        # split using LLaVA-Med 1.5 was investigated and ruled out
        # separately -- no working vision-capable GGUF exists for it, and
        # its license also restricts deployed use beyond research). No
        # "stop" override needed here -- same base chat template as
        # hermes3-llama-3.1-8b, which has never needed one.
        litellm_params:
          model: openai/llama3.1-aloe-beta-8b
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          stream_timeout: 60

      # "auto" -- semantic routing entry point. litellm_params below is only
      # the FALLBACK target if custom_router_hook.py doesn't run or errors
      # (proxy down, arch-router-1.5b not deployed yet, malformed classifier
      # output, etc.) -- on the happy path the hook rewrites the model
      # before this entry is ever actually used to serve the request.
      - model_name: auto
        litellm_params:
          model: openai/qwen3.8-27b-Expert
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"

      # Uniform cloud fallback for the media-gen busy window -- see the
      # top-of-file "MEDIA-GEN BUSY FALLBACK" comment for the full story,
      # including the caveat that this exact model slug needs a spot-check
      # against openrouter.ai/models before/at first real deploy.
      # LiteLLM's native OpenRouter provider (model: "openrouter/<slug>")
      # doesn't need api_base -- it defaults to https://openrouter.ai/api/v1
      # on its own.
      - model_name: openrouter-fallback
        litellm_params:
          model: openrouter/google/gemini-3.8-flash
          api_key: os.environ/OPENROUTER_API_KEY

      # Deliberate-use cloud aliases -- see the top-of-file "CLOUD ALIASES
      # FOR DELIBERATE USE" comment for the full story (model choice,
      # pricing, why GPT-5.6 Sol and not GPT-6 Astra). Never targeted by the
      # classifier or either fallback mechanism -- only reachable via the
      # CLOUD_ALIAS_TRIGGERS phrase-match in custom_router_hook.py below,
      # or by naming the model directly. GPT-6 Astra and Claude's "Fable"
      # tier deliberately NOT wired here -- Eldar's own top-of-the-line
      # reserve, manual-only from his PC, not for routine Hermes use.
      # PROMPT CACHING, added 2026-09-25: real production cost found -- a
      # single "how big videos can we handle" investigation put ~13 Opus
      # calls through this route in 3 minutes (Eldar's own OpenRouter
      # Activity log), each one resending nearly the same 40-58k-token
      # conversation from scratch at full price (37,946 -> 58,453 input
      # tokens across the run, $0.20-$0.32 EACH), because Hermes's own
      # tool-calling loop necessarily resends the whole growing history on
      # every internal step and nothing here was telling Anthropic which
      # prefix was reusable. cache_control_injection_points is LiteLLM's own
      # documented mechanism (docs.litellm.ai/docs/tutorials/prompt_caching)
      # for auto-inserting Anthropic's ephemeral cache_control breakpoints
      # without Hermes itself having to send them -- confirmed it also
      # applies to OpenRouter's Claude routes, not just direct anthropic/
      # calls (same docs page's supported-provider list). Two breakpoints:
      # the system message (Hermes's own system prompt + SOUL.md content,
      # identical on every call) and the last message in the array (marks
      # everything through the most-recent turn as cacheable, so the NEXT
      # call in the same tool loop -- which only appends one more message --
      # gets a cache hit on everything before it, instead of repricing the
      # whole conversation again). NOT wired onto gpt-sol-alias below: OpenAI
      # caches automatically server-side for prompts over ~1024 tokens, no
      # cache_control markers needed, so this would be a no-op there.
      # UNVERIFIED against this deployment's real traffic (the exact
      # location/role/index keys below are corroborated across three
      # separate LiteLLM GitHub PRs/issues, not read off one single
      # authoritative example -- the docs site itself gave inconsistent
      # answers across repeated fetches) -- check the next real multi-call
      # Opus session in LangFuse or the raw response `usage` block for
      # cache_read_input_tokens > 0 before trusting this actually cut cost.
      # If it silently no-ops, the fallback is Anthropic's own console
      # (console.anthropic.com) cache-analytics view for this key, or just
      # watching whether repeat-call cost in OpenRouter's Activity log drops.
      - model_name: claude-opus-alias
        litellm_params:
          model: openrouter/anthropic/claude-opus-5
          api_key: os.environ/OPENROUTER_API_KEY
          cache_control_injection_points:
            - location: message
              role: system
            - location: message
              index: -1
      - model_name: gpt-sol-alias
        litellm_params:
          model: openrouter/openai/gpt-5.6-sol
          api_key: os.environ/OPENROUTER_API_KEY

    litellm_settings:
      # OBSERVABILITY STACK, 2026-09-17 (see k8s/p8/ -- Prometheus/Grafana/
      # Loki/LangFuse, wired up this same session): "prometheus" is
      # LiteLLM's own documented built-in callback (docs.litellm.ai/docs/
      # proxy/prometheus) -- it exposes request/latency/token/cost metrics
      # at this pod's existing :4000/metrics path, no new port or service
      # needed. success_callback (a SEPARATE key from callbacks, confirmed
      # against LiteLLM's own docs) sends a trace of every completed
      # request to LangFuse (k8s/p8/langfuse.yaml) -- the actual
      # LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY/LANGFUSE_HOST creds are on
      # the Deployment's env block below, not here (LiteLLM's Langfuse
      # integration reads them from the environment, not config.yaml).
      # LiteLLM is the one place nearly every LLM call in this cluster
      # already funnels through (Hermes, Honcho, Open WebUI, the gmail/
      # telegram/vault scripts all call it rather than llama-swap
      # directly), so wiring tracing in here gives full-stack LLM
      # observability without touching any of those callers individually.
      callbacks: ["custom_router_hook.proxy_handler_instance", "prometheus"]
      success_callback: ["langfuse"]
      # FIXED 2026-09-17: Prometheus's scrapes of /metrics were failing live
      # with 401 ("Malformed API Key passed in") -- confirmed via Loki logs
      # once k8s/p8/promtail.yaml's own discovery bug was fixed. LiteLLM's
      # own docs (docs.litellm.ai/docs/proxy/prometheus) describe this flag
      # as defaulting to false (no auth needed on /metrics), but a GitHub
      # security report (BerriAI/litellm#24530: unauthenticated /metrics can
      # leak multi-tenant PII) suggests the real default was flipped to
      # require auth in recent builds -- ghcr.io/berriai/litellm:main-latest
      # (what this cluster runs) clearly enforces it regardless of what the
      # docs say, so setting this explicitly rather than trusting either the
      # docs or the observed behavior to hold across image updates. Safe
      # here for the same reason Postgres/Redis run with no auth elsewhere
      # in this cluster: single-user homelab, no public ingress, nothing
      # multi-tenant -- the exact scenario #24530 was warning about doesn't
      # apply to aibox. Alternative (LiteLLM's dedicated
      # --prometheus_metrics_port) would need a new port + a new Prometheus
      # scrape job just to avoid this one flag -- not worth the extra
      # moving part for a homelab.
      require_auth_for_metrics_endpoint: false
      # Honcho's embedding calls to nomic-embed-text-v1.5 always pass an
      # explicit `dimensions` param (EMBEDDING_VECTOR_DIMENSIONS=768 in
      # k8s/p2/honcho.yaml) -- LiteLLM's own param-validation treats this as
      # an OpenAI-text-embedding-3-and-later-only parameter and rejects it
      # with a 400 for nomic-embed-text-v1.5 too. Confirmed live via
      # honcho-api/honcho-deriver logs, 2026-09-13: every embedding call
      # (dialectic prefetch, message representation save, deriver batch
      # save) failed identically with "litellm.UnsupportedParamsError:
      # Setting dimensions is not supported...", which is why Honcho's own
      # dialectic CHAT worked fine (200s, real LLM round-trips logged) but
      # every save/observation silently failed -- the error message itself
      # names the fix. drop_params makes LiteLLM strip a param the target
      # doesn't support instead of erroring on it -- safe here specifically
      # since nomic-embed-text-v1.5 already natively outputs 768-dim
      # vectors regardless of whether this param reaches it.
      drop_params: true
      # GENERAL AUTO-FALLBACK -- TEMPORARILY DISABLED 2026-09-09 (Eldar's
      # explicit request, while actively testing local-LLM tool-calling
      # behavior post the casual-route model swap): with this on, a local
      # model timing out or erroring silently fails over to cloud, which
      # was masking exactly the kind of local bug we're hunting right now
      # -- no way to tell from the outside whether a reply came from the
      # local model or the cloud fallback without digging into logs (hit
      # this for real testing hermes3-llama-3.1-8b: first "hey bro" test
      # cold-load-timed-out and silently answered from openrouter-fallback
      # instead, which would have read as "bug fixed" if not double-checked).
      # Commented out, not removed -- re-enable by uncommenting
      # num_retries/fallbacks below once testing is done, see the top-of-
      # file comment for the full original story.
      # Does NOT affect the separate media-gen busy-flag redirect
      # (custom_router_hook.py's _media_gen_busy() check below, look for
      # "data[\"model\"] = BUSY_FALLBACK_MODEL") -- that's a direct
      # data["model"] override in the pre-call hook itself, independent of
      # this fallbacks: block, and stays fully active: a VRAM-busy-from-
      # image/video-gen request still redirects to cloud exactly as before.
      # num_retries: 1
      # fallbacks:
      #   - qwen3.8-27b-Expert: ["openrouter-fallback"]
      #   - qwen3.8-27b-Expert-Vision: ["openrouter-fallback"]
      #   - hermes3-llama-3.1-8b: ["openrouter-fallback"]
      #   - llama3.1-aloe-beta-8b: ["openrouter-fallback"]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # See "KNOWN QUIRK" in the top comment -- without this, some request
      # paths raise "No connected db." even with a correct master_key,
      # because there's no database for LiteLLM's auth layer to fall back
      # to checking. Safe here: master_key is still the only thing that can
      # ever authenticate, this just stops a missing DB from hard-failing
      # requests that don't actually need one.
      allow_requests_on_db_unavailable: true

  # Custom pre-call hook: LiteLLM's officially-documented extension point for
  # rewriting a request's target model before routing (see
  # docs.litellm.ai/docs/proxy/call_hooks). Mounted alongside config.yaml and
  # made importable via PYTHONPATH (set on the Deployment below) rather than
  # into the image's own /app, so it never risks shadowing LiteLLM's
  # installed package files.
  custom_router_hook.py: |
    """Semantic router for LiteLLM's "auto" model, backed by Arch-Router-1.5B
    (served as a plain CPU model in llama-swap -- see
    k8s/p1/llama-swap-configmap.yaml). Called once per request routed
    through "auto"; on any failure it falls back to general chat rather than
    ever hard-failing the caller's actual request.
    """
    import json
    import logging
    import re

    import httpx
    from litellm.integrations.custom_logger import CustomLogger

    # ADDED 2026-09-08: guarded import -- NOT CONFIRMED that redis-py ships
    # inside ghcr.io/berriai/litellm:main-latest (see top-of-file comment).
    # If it's missing, _media_gen_busy() below just always returns False
    # (busy-check degrades to a no-op, today's routing behavior) instead of
    # this whole module failing to import and taking the router down.
    try:
        import redis.asyncio as _redis_lib
        _REDIS = _redis_lib.from_url(
            "redis://redis.ai-memory.svc.cluster.local:6379/0", decode_responses=True
        )
    except Exception:  # noqa: BLE001 -- ImportError or a bad URL, either way degrade gracefully
        _REDIS = None

    logger = logging.getLogger("custom_router_hook")
    # Explicit level + our own handler, not relying on root logger config:
    # Python's root logger only surfaces WARNING+ by default with no
    # handlers attached (its "handler of last resort") -- that's exactly why
    # the earlier failure warnings showed up as bare unstyled text while
    # LiteLLM's own INFO-level proxy logs (with their timestamp/prefix) come
    # from a separately configured logger. Without this, the success log
    # line added below (logger.info, once classification actually started
    # working) would be silently swallowed the same way -- confirmed 2026-
    # 09-07: a request went through 200 OK with no failure warning at all,
    # meaning it worked, but there was no way to see it working.
    logger.setLevel(logging.INFO)
    if not logger.handlers:
        _handler = logging.StreamHandler()
        _handler.setFormatter(logging.Formatter("%(asctime)s custom_router_hook %(levelname)s: %(message)s"))
        logger.addHandler(_handler)
        logger.propagate = False

    # media-gen:busy is set/cleared by apps/media-gen-mcp/server.py around
    # every ComfyUI generation (full-swap GPU handoff -- see that file's own
    # top comment). Checked first, before the deterministic image-check and
    # before spending an arch-router-1.5b classifier call on a request that's
    # going to cloud regardless -- ALL four routes redirect uniformly when
    # busy (Eldar's own simplification), so there's nothing left to classify.
    MEDIA_GEN_BUSY_KEY = "media-gen:busy"
    BUSY_FALLBACK_MODEL = "openrouter-fallback"

    # ADDED 2026-09-24, real production bug: the Redis flag above ONLY gets
    # set by media-gen-mcp's own code -- a generation submitted directly
    # through ComfyUI's own UI (which is how every LTX-2.3 model/graph on
    # this box was actually validated before wiring it into media-gen-mcp,
    # see apps/media-gen-mcp/server.py's own VIDEO_WORKFLOW_TEMPLATE
    # comment) never touches that key at all, even though it fully occupies
    # the same shared 5070 Ti every local chat model (qwen3.8-27b-Expert,
    # hermes3-llama-3.1-8b, etc -- see llama-swap-configmap.yaml, almost
    # every GPU model group is pinned to that one card) also needs. Real
    # incident: qwen3.8-27b-Expert and hermes3-llama-3.1-8b both hit repeated
    # "upstream command exited prematurely" (llama-swap's generic wrapper
    # around a CUDA OOM) while a manual ComfyUI-UI generation was running,
    # because this check saw Redis clear and routed to the local model as
    # normal -- the cloud fallback never engaged even though it exists
    # specifically for this situation. Fix: ALSO ask ComfyUI's own /queue
    # endpoint whether it's actively working on something right now,
    # regardless of who submitted it -- that's the real, authoritative
    # signal for "is this GPU busy", the Redis flag was only ever a fast
    # proxy for it on the one submission path that bothers to set it.
    COMFYUI_URL = "http://comfyui.ai-models.svc.cluster.local:8188"
    # Short timeout deliberately -- this runs on the hot path for every
    # single "auto" chat request, so a slow/unreachable ComfyUI must never
    # noticeably delay an ordinary chat message. Fails open (treated as
    # "not running anything") on any error, same fail-open principle the
    # Redis check already uses -- a missed busy signal degrades to
    # yesterday's behavior (a chat request might race ComfyUI for VRAM),
    # not a new failure mode, so there's no reason to ever block a chat
    # request on this check itself.
    COMFYUI_QUEUE_CHECK_TIMEOUT_SECONDS = 3.0

    async def _media_gen_busy():
        if _REDIS is not None:
            try:
                if bool(await _REDIS.get(MEDIA_GEN_BUSY_KEY)):
                    return True
            except Exception as exc:  # noqa: BLE001 -- Redis unreachable etc. -- fall through to the ComfyUI check
                logger.warning(
                    "media-gen busy check (redis) failed (%s: %s) -- falling back to comfyui queue check",
                    type(exc).__name__, exc,
                )
        try:
            async with httpx.AsyncClient(timeout=COMFYUI_QUEUE_CHECK_TIMEOUT_SECONDS) as client:
                resp = await client.get(f"{COMFYUI_URL}/queue")
                resp.raise_for_status()
                # ComfyUI's own /queue shape: {"queue_running": [...],
                # "queue_pending": [...]} -- non-empty queue_running means a
                # job is actively being worked on right now (as opposed to
                # merely queued), which is the real GPU-contention signal.
                if resp.json().get("queue_running"):
                    return True
        except Exception as exc:  # noqa: BLE001 -- ComfyUI unreachable/slow etc. -- never block chat on this
            logger.warning(
                "media-gen busy check (comfyui queue) failed (%s: %s) -- assuming not busy",
                type(exc).__name__, exc,
            )
        return False

    ARCH_ROUTER_URL = "http://llama-swap.ai-models.svc.cluster.local:8080/v1/chat/completions"
    ARCH_ROUTER_MODEL = "arch-router-1.5b"

    # Grow this list (and ROUTE_TO_MODEL below) as more GGUF files actually
    # land on aibox and get real llama-swap-configmap.yaml roster entries --
    # no other code changes needed.
    # BUG FIXED 2026-09-07: with only abstract descriptions (no example
    # utterances), arch-router-1.5b routed genuinely plain greetings like
    # "what's up" to "reasoning" a real fraction of the time (Eldar tested
    # a batch of only-casual messages via kubectl logs and caught it
    # directly). Root cause: "reasoning"'s old wording told the classifier
    # to pick it "whenever a request doesn't clearly and obviously belong
    # to one of the other routes" -- for a 1.5B model with nothing concrete
    # to anchor on, that phrasing itself nudges borderline-but-actually-
    # simple messages toward reasoning too easily. Fix (Katanemo's own
    # recommended technique for Arch-Router): give each route a few example
    # utterances, not just an abstract description, so the model has real
    # anchors instead of guessing at the boundary from prose alone.
    ROUTES = [
        {
            "name": "vision",
            "description": (
                "The user attached or refers to a specific image, photo, "
                "screenshot, or diagram and wants it looked at, described, "
                "or read."
            ),
        },
        {
            "name": "medical",
            "description": (
                "The user is asking about a health condition, symptom, "
                "medication, diagnosis, or other medical/clinical topic. "
                "Examples: 'I've had a headache and sore throat for two "
                "days, could this be a cold?', 'what's a normal resting "
                "heart rate for a 40 year old?', 'is it safe to take "
                "ibuprofen with this medication?'"
            ),
        },
        {
            # WIDENED 2026-09-09 (Eldar's explicit request): "casual" used
            # to mean just greetings/small talk, so most everyday traffic
            # (general discussion, language practice, quick searches) fell
            # through to "reasoning" -> the 27B model -> a real 30-50s wait
            # for stuff that didn't need it. hermes3-llama-3.1-8b is fast
            # AND (since the 2026-09-09 swap) follows Hermes's tool-call
            # format correctly, so it's fine for tool-using casual requests
            # too, not just plain text. Goal: make this the everyday
            # workhorse route, reasoning the exception -- not the reverse.
            "name": "casual",
            "description": (
                "Everyday conversational traffic that doesn't need deep "
                "analysis or careful multi-step judgment -- this is the "
                "default workhorse route, not just greetings. Covers: "
                "small talk and greetings; quick factual lookups with one "
                "clear answer (capitals, unit conversions, 'what time is "
                "it in Tokyo'); simple web searches that just relay a "
                "single result ('what's the weather', 'any news on X'); "
                "casual language-learning practice -- vocabulary, everyday "
                "grammar questions, short translations, conversational "
                "drills; a lightweight recommendation ('suggest a movie "
                "for tonight'); a one-line tech explanation ('what does "
                "this error mean', 'what's a Kubernetes pod'); basic "
                "arithmetic or conversions; a short casual summary of a "
                "message or paragraph; a quick joke or one-liner; a "
                "how-to with one obvious answer. Examples: 'hey', "
                "'what's up', 'thanks!', 'how do you say thank you in "
                "Georgian', \"what's the weather in Katowice\", 'what "
                "does a 504 error mean', 'suggest a quick dinner idea', "
                "'how do I unzip a .tar.gz on Linux', 'search for the "
                "latest news on X'. Route here whenever the request is "
                "genuinely answerable in one pass without weighing "
                "tradeoffs or synthesizing multiple sources -- don't "
                "escalate just because a message is longer than a "
                "one-liner or uses a tool."
            ),
        },
        {
            "name": "reasoning",
            "description": (
                "A request with real depth, complexity, or substance -- "
                "writing or debugging code, architecture/infra decisions, "
                "multi-step planning, weighing tradeoffs, synthesizing or "
                "reconciling multiple sources, multi-step math, "
                "long-document analysis, longer creative writing, or "
                "anything where being wrong actually matters. Examples: "
                "'plan a 3-day trip to Tbilisi with a rough budget', "
                "'write a Python function that merges overlapping "
                "intervals', 'what's the tradeoff between Postgres and "
                "SQLite here', 'compare these three job offers'. This is "
                "the fallback whenever a request genuinely has real "
                "substance to it and doesn't fit vision/medical/casual -- "
                "not a default for short or casual-sounding messages just "
                "because the classifier isn't fully certain. (Explicit "
                "'think deeply' / 'be thorough' / 'step by step' style "
                "requests never even reach this classifier -- they're "
                "caught by a deterministic keyword check earlier in the "
                "hook and routed straight here, see "
                "_wants_deep_reasoning below.)"
            ),
        },
    ]

    ROUTE_TO_MODEL = {
        # "vision" briefly CHANGED 2026-09-10: qwen3.8-27b-Expert-Vision ->
        # qwopus-general, then REVERTED back the same week after qwopus
        # performed badly in practice. qwopus-general's model_list entry
        # itself removed 2026-09-13 once confirmed genuinely unused. See the
        # top-of-file ROUTES comment for the full history.
        "vision": "qwen3.8-27b-Expert-Vision",
        "medical": "llama3.1-aloe-beta-8b",  # CHANGED 2026-09-16: medgemma-1.5-4b retired (broken), see llama-swap-configmap.yaml for full history
        # "casual" CHANGED 2026-09-09: llama-3.1-8b -> hermes3-llama-3.1-8b
        # (see the litellm_params comment on the hermes3-llama-3.1-8b
        # model_list entry above for why). Previously changed 2026-09-08:
        # qwen3-8b -> llama-3.1-8b, for an unrelated context-length reason.
        "casual": "hermes3-llama-3.1-8b",
        "reasoning": "qwen3.8-27b-Expert",
        # "other" CHANGED 2026-09-13 (Eldar's own finding, confirmed via
        # 6h of real routing logs): arch-router answers "other" whenever a
        # request doesn't confidently fit vision/medical/casual/reasoning
        # -- in practice this was firing mostly on trivial exchanges
        # ("Alive?", "Its fixed", short Honcho test pings) and, notably,
        # Hermes's own internal "review this conversation, consider saving
        # to memory" housekeeping prompt, which routes through this same
        # "auto" endpoint on every turn. None of that needed the 27B
        # model. Was qwen3.8-27b-Expert (same as "reasoning") -- that made
        # every low-confidence classification silently expensive/slow
        # instead of defaulting to fast. Trade-off accepted knowingly: a
        # genuinely complex request the classifier ISN'T confident enough
        # to call "reasoning" now gets the fast model's answer instead of
        # the careful one, where before it accidentally got the careful
        # one. Revisit if that trade-off starts showing up as a real
        # quality problem, not just a hunch.
        "other": "hermes3-llama-3.1-8b",
    }

    SYSTEM_PROMPT = """You are a helpful assistant designed to find the best suited route.
    You are provided with route description within <routes></routes> XML tags:
    <routes>
    {routes}
    </routes>

    <conversation>
    {conversation}
    </conversation>

    Analyze the conversation and pick exactly one route. Respond with only a
    JSON object: {{"route": "route_name"}}, or {{"route": "other"}} if
    nothing fits."""


    # BUG FOUND + FIXED 2026-09-16 (Eldar's report: "once any image appeared
    # in the chat, hermes constantly use vision model for even answering me
    # whazzup question"): this originally scanned EVERY message in the
    # whole conversation for an image_url part, not just the latest turn --
    # so once any image was ever sent or generated earlier in a
    # conversation, every later message (even a plain-text "whazzup") kept
    # matching and got force-routed to the vision model for the rest of
    # that conversation. Exact same bug shape as DEEP_REASONING_TRIGGERS'
    # 2026-09-09 fix above (conversation-history-wide match instead of a
    # per-request check) -- fixed the same way: only look at the single
    # most recent user-role message, same as _wants_deep_reasoning does.
    # MEMORY_CONTEXT_MARKER / _strip_memory_context ADDED 2026-09-16: real
    # root cause of the vision-misrouting bug below, found via the new
    # logging on _wants_vision_tool -- Eldar's actual message ("Whaaaazzzu
    # uuuppp") is genuinely the latest role=user content, but Hermes's own
    # Honcho memory-prefetch plugin appends a huge recalled-memory block
    # directly onto that SAME string, wrapped in "<memory-context>...",
    # explicitly labeled "[System note: ... NOT new user input ... this is
    # the agent's persistent memory]" -- confirmed live via the new log
    # line, a 1433-char message where everything past the first two words
    # was a 14,121-char (truncated in the log) memory dump. Somewhere in
    # THAT recalled text was a reference to /opt/data/cache/images/ (almost
    # certainly an old real image exchange Honcho recalled and cited by
    # path), which is what actually matched -- not anything Eldar typed.
    # Hermes stuffs this into the user-role content string itself rather
    # than a separate message, so nothing in the "only look at the latest
    # user message" fix (see _has_image's own comment below) protects
    # against it -- the latest message IS the right one, but its content
    # is only partly Eldar's own text.
    #
    # This isn't unique to the vision check: _wants_deep_reasoning and
    # _wants_cloud_alias below do the identical whole-string substring
    # scan, so a recalled memory mentioning e.g. "step by step" or "use
    # opus" could just as easily force deep-reasoning or trigger a real
    # paid cloud API call the same way. _wants_casual is NOT affected --
    # it requires the ENTIRE (stripped) message to exactly equal a short
    # phrase, and a 14k-char memory dump can never equal one. _has_image
    # isn't affected either -- it only matches list-shaped multimodal
    # content, a different structure from this text-stuffing bug. So this
    # strip is applied to all three substring-scanning functions
    # (_wants_vision_tool, _wants_deep_reasoning, _wants_cloud_alias) and
    # deliberately left out of _has_image/_wants_casual, which don't need
    # it.
    MEMORY_CONTEXT_MARKER = "<memory-context>"


    def _strip_memory_context(text):
        idx = text.find(MEMORY_CONTEXT_MARKER)
        return text if idx == -1 else text[:idx]


    def _has_image(messages):
        for m in reversed(messages):
            if m.get("role") != "user":
                continue
            content = m.get("content")
            if isinstance(content, list):
                for part in content:
                    if isinstance(part, dict) and part.get("type") == "image_url":
                        return True
            # only the latest user turn counts -- stop here either way
            return False
        return False


    HERMES_IMAGE_MARKERS = ("vision_analyze", "/opt/data/cache/images/")


    # LOGGING ADDED 2026-09-16 (Eldar's report: routing kept landing on
    # vision for plain follow-up messages, no image anywhere, starting
    # right after a reply that happened to include an emoji): this
    # function already only looks at the single most recent role="user"
    # message (same latest-turn-only pattern as _has_image/
    # _wants_deep_reasoning), so if it's still misfiring, the most likely
    # explanation isn't a scanning bug on our side -- it's that Hermes's
    # own agent loop appended a TOOL RESULT as a role="user" message
    # (common in ReAct-style agents that don't use a native tool/function
    # role) placed after the real human question in that same request, so
    # by the time this hook runs for the final reply, the "latest
    # role=user message" is that tool artifact, not what Eldar actually
    # typed. Can't inspect/patch Hermes's own vendored source to confirm
    # this directly (see hermes-agent.yaml's own comment on that
    # limitation), so instead of guessing further, logging exactly what
    # matched (which marker, and a snippet of the message it matched
    # in) -- next occurrence tells us definitively whether this is really
    # a stale tool artifact and what it actually contains, same diagnostic
    # approach DEEP_REASONING_TRIGGERS already uses above.
    def _wants_vision_tool(messages):
        for m in reversed(messages):
            if m.get("role") != "user":
                continue
            content = m.get("content")
            if isinstance(content, str):
                content = _strip_memory_context(content)
                for marker in HERMES_IMAGE_MARKERS:
                    if marker in content:
                        logger.info(
                            "hermes-image-marker %r matched in latest "
                            "role=user message, after memory-context strip "
                            "(len=%d): %r",
                            marker, len(content), content[:300],
                        )
                        return True
            return False
        return False


    # ADDED 2026-09-09, alongside widening "casual" (see the ROUTES comment
    # above): an explicit "go deep" instruction should never be at the
    # mercy of a 1.5B classifier's semantic judgment -- if the user says
    # "think deeply", they should always get the 27B model, not "probably".
    # Same deterministic-fast-path pattern as _has_image above: checked
    # BEFORE the classifier call, so it also saves a classifier round-trip
    # on these. Substring match on the lowercased text, not a regex --
    # simple and good enough; false positives (a trigger phrase appearing
    # in an unrelated sentence) just mean an occasional casual message
    # gets the slower, more careful model, which is a safe failure
    # direction, not a broken one.
    #
    # BUG FOUND + FIXED same day, live testing: originally scanned EVERY
    # role="user" message in the whole conversation, not just the latest
    # one -- so a single earlier "think deeply about X" test message stayed
    # matched on every later, completely unrelated turn in that same
    # conversation (confirmed live: a plain "what's the weather in Baku"
    # follow-up got forced to reasoning twice in the same exchange, with no
    # trigger phrase anywhere in that actual request). A deterministic
    # per-request check has to judge THIS request, not conversation
    # history. Fixed to only look at the single most recent user-role
    # message. logger.info added on match (phrase + a content snippet) so
    # a future false-positive shows exactly what matched instead of being
    # guessed at again.
    DEEP_REASONING_TRIGGERS = (
        "think deeply", "think carefully", "think hard", "reason through",
        "analyze in depth", "analyse in depth", "be thorough",
        "thorough analysis", "step by step", "step-by-step", "deep dive",
        "in detail", "don't rush", "do not rush", "take your time",
        "double check", "double-check", "carefully consider",
        # ADDED 2026-09-13 (Eldar's request). "think harder"/"ultrathink"
        # mirror Claude Code's own real graduated-thinking trigger phrases
        # (https://claudefa.st/blog/guide/performance/deep-thinking-techniques)
        # -- established precedent for this exact pattern. The rest are
        # Eldar's requested intents (think/analyse/find out/double check/
        # investigate/design/architect/plan), written as multi-word
        # phrases rather than bare words on purpose, same discipline as
        # the rest of this list -- a bare "plan"/"design"/"analyse" would
        # match ordinary casual usage ("any plans for the weekend", "what
        # do you think") and reintroduce the over-triggering bug this
        # list already had fixed once before (see the bug note above).
        # Deliberately did NOT add a technical-vocabulary keyword list
        # (e.g. "kubernetes"/"docker"/"api") despite that being LiteLLM's
        # own Auto Router v2 pattern -- ROUTES["casual"]'s own description
        # above explicitly wants one-line tech questions ("what's a
        # Kubernetes pod") to stay on the fast model, so topic-vocabulary
        # keywords would directly undo that 2026-09-09 fix. Left to
        # arch-router's own semantic judgment instead, which already
        # correctly classified a real troubleshooting thread as
        # "reasoning" on 2026-09-13 without needing a keyword for it.
        "think harder", "ultrathink",
        "investigate this", "look into this", "dig into this",
        "find out why", "figure out why",
        "help me design", "help me plan", "help me architect",
    )


    def _wants_deep_reasoning(messages):
        for m in reversed(messages):
            if m.get("role") != "user":
                continue
            content = m.get("content")
            if isinstance(content, str):
                content = _strip_memory_context(content)
                lowered = content.lower()
                for t in DEEP_REASONING_TRIGGERS:
                    if t in lowered:
                        logger.info(
                            "deep-reasoning trigger matched %r in: %r",
                            t, content[:200],
                        )
                        return True
            # only the latest user turn counts -- stop here either way
            return False
        return False


    # ADDED 2026-09-24, real production bug (Eldar's report: "with music it
    # is constantly failing... generate the same kind of music... Did you
    # call the tool?" repeated across a whole Telegram thread). Root-caused
    # by correlating litellm's own "auto -> route -> model" log against
    # media-gen-mcp's log of its two genuinely real generate_music calls
    # that session: BOTH real successes AND every single fabricated
    # "MEDIA:/shared-output/..." response traced back to the SAME model,
    # hermes3-llama-3.1-8b, via the SAME "other" route -- not one
    # fabrication traced to qwen3.8-27b-Expert (the "reasoning" route),
    # which only ever produced short confession/starting stubs, never a
    # fake result. So this isn't "the 8B model can't call tools" (it did,
    # twice, for real) -- it's that arch-router's classifier has no
    # deterministic fast path for tool-use requests the way it already does
    # for vision/deep-reasoning above, so an ordinary tool-use follow-up
    # ("generate me a song", "did you call the tool?") carries none of
    # DEEP_REASONING_TRIGGERS' keywords and kept landing on "other" ->
    # hermes3-llama-3.1-8b, the less reliable of the two models at actually
    # invoking a tool instead of narrating plausible text -- and that
    # unreliability compounds the longer a fabricated "success" already
    # sits in the conversation history for the model to pattern-match
    # against. Same deterministic-fast-path pattern as
    # DEEP_REASONING_TRIGGERS/_wants_vision_tool above: skip the 1.5B
    # classifier's judgment call entirely and go straight to "reasoning" ->
    # qwen3.8-27b-Expert whenever the request plausibly needs ANY of
    # Hermes's real tools (see hermes-agent.yaml's mcp_servers block and
    # each server's own @mcp.tool()-decorated functions for the current
    # source-of-truth tool list -- extend this list here whenever a new
    # tool is added there). Multi-word phrases, not bare verbs like
    # "generate"/"create"/"make" alone, same discipline
    # DEEP_REASONING_TRIGGERS already explains above (a bare-word list
    # would swallow ordinary casual chat) -- but a false positive here is
    # the same safe failure direction as deep-reasoning's: an occasional
    # non-tool message just gets the slower, more careful model instead of
    # the fast one.
    # CHANGED 2026-09-24 (real miss caught live): this started as a fixed
    # phrase list ("generate a mp3", "generate music", etc.), same shape as
    # DEEP_REASONING_TRIGGERS. First real test broke it immediately --
    # Eldar's actual message was "Generate me a mp3 file with music for
    # kids", and NONE of the fixed phrases matched, because "generate a
    # mp3" is not a substring of "generate me a mp3" (the inserted "me"
    # breaks it), same for "generate music" vs "generate me a mp3 file
    # with music for kids" (the words aren't adjacent). A fixed-phrase list
    # can't keep up with ordinary word order variation. Switched the media
    # generation/editing half to a verb-anywhere AND noun-anywhere check
    # instead (MEDIA_ACTION_VERBS / MEDIA_NOUNS below) -- order- and
    # phrasing-independent, so "generate me a mp3", "produce a song",
    # "please make a video of", "can you edit this photo" all match without
    # needing every word-order variant spelled out. Vault
    # operations/explicit tool names/meta tool-use phrases stay as fixed
    # phrases (VAULT_TRIGGERS/TOOL_NAME_TRIGGERS/TOOL_META_TRIGGERS below)
    # since those are much more fixed idioms in practice than "please can
    # you generate/create/make/produce me a <thing>" is.
    MEDIA_ACTION_VERBS = (
        "generate", "regenerate", "create", "compose", "produce",
        "make me", "make a", "make an", "write me", "give me", "sing",
        "edit", "change", "replace", "swap", "remove", "modify", "retouch",
    )

    MEDIA_NOUNS = (
        "image", "picture", "photo", "video", "clip", "gif", "song",
        "music", "mp3", "lyrics", "background",
    )

    VAULT_TRIGGERS = (
        "search_vault", "search the vault", "ingest_file", "ingest_note",
        "add this to the vault", "add to the vault", "save this to the vault",
        "save to the vault", "add to my notes", "save to my notes",
    )

    # ADDED 2026-09-27, same root cause as the media-gen fix above, caught
    # live on movies-mcp: Eldar's "Update movie info that i stoped watching
    # Fringe on episode 19-th" got a confident "I've updated it" reply from
    # Hermes with nothing actually written (confirmed by reading
    # watch-history.yaml directly -- still the empty seed). None of these
    # phrasings carry a MEDIA_ACTION_VERBS+MEDIA_NOUNS match (no
    # generate/create + image/video/song), so they were falling through to
    # the classifier same as the original media-gen bug did. Fixed-phrase
    # list, same discipline as VAULT_TRIGGERS above (movie requests are
    # varied enough that a verb+noun pattern would either miss real
    # requests or catch unrelated ones -- see server.py's own tool
    # docstrings in apps/movies-mcp/server.py for the real phrasings this
    # is modeled on).
    MOVIE_TRIGGERS = (
        "mark as watched", "mark it as watched", "mark this as watched",
        "stopped watching", "stop watching", "i stopped", "on hold",
        "update watch history", "update my watch history",
        "update the watch history", "watch history", "movie info",
        "update movie info", "add to anticipated", "anticipated list",
        "waiting for the next season", "waiting for a new season",
        "new season of", "next season of", "is back yet", "any update on",
        "what am i waiting on", "recommend a movie", "recommend a show",
        "recommend something to watch", "what should i watch",
        "movie recommendation",
    )

    # explicit tool function names, in case Hermes's own narration or a
    # pasted error message ends up in the latest user turn
    TOOL_NAME_TRIGGERS = (
        "generate_image", "generate_video", "generate_music", "edit_image",
        "ask_movies", "update_watch_history", "check_anticipated",
    )

    # meta -- about tool use/honesty itself. Real transcript evidence this
    # was added for: once a fabrication happens, every follow-up in that
    # thread is the user pushing back ("Did you use the tool?", "did you
    # call the tool") -- these carry none of the media keywords above
    # (they're about the PROOF, not a new request) but are exactly the
    # turns that most need the reliable model, since this is precisely
    # where hermes3-llama-3.1-8b kept re-fabricating instead of admitting
    # it or actually retrying.
    # EXTENDED 2026-09-27: the movies-mcp incident's own follow-ups
    # ("Check if you updated that", "You did not update anything") don't
    # contain the word "tool" at all -- the original list would have missed
    # them completely. Generic update/save-confirmation phrasing added
    # alongside the tool-specific ones; a false positive here just means an
    # unrelated message gets the slower, more careful model, same safe
    # failure direction as every other trigger list in this file.
    TOOL_META_TRIGGERS = (
        "use the tool", "used the tool", "use that tool", "call the tool",
        "called the tool", "run the tool", "did you use the tool",
        "did you call the tool", "did you run the tool",
        "actually call the tool", "actually use the tool",
        "never fabricate", "don't fabricate", "fabricat",
        "did you update", "did you save", "did you actually",
        "you did not update", "you didn't update", "you did not save",
        "you didn't save", "check if you updated", "check if you saved",
    )


    def _wants_tool_use(messages):
        for m in reversed(messages):
            if m.get("role") != "user":
                continue
            content = m.get("content")
            if isinstance(content, str):
                content = _strip_memory_context(content)
                lowered = content.lower()
                # media generation/editing: verb ANYWHERE + noun ANYWHERE
                # in the message, not a fixed phrase -- see the comment
                # above TOOL_USE_TRIGGERS' replacement for why.
                has_verb = any(v in lowered for v in MEDIA_ACTION_VERBS)
                has_noun = any(n in lowered for n in MEDIA_NOUNS)
                if has_verb and has_noun:
                    logger.info(
                        "tool-use media verb+noun matched in: %r",
                        content[:200],
                    )
                    return True
                for t in VAULT_TRIGGERS + MOVIE_TRIGGERS + TOOL_NAME_TRIGGERS + TOOL_META_TRIGGERS:
                    if t in lowered:
                        logger.info(
                            "tool-use trigger matched %r in: %r",
                            t, content[:200],
                        )
                        return True
            # only the latest user turn counts -- stop here either way
            return False
        return False


    # ADDED 2026-09-13 (Eldar's finding + fix): investigating the same
    # "why does qwen3.8 get used so much" complaint that led to the
    # ROUTE_TO_MODEL["other"] fix above turned up a second, separate cause.
    # A fully isolated "Alive?" test (no conversation history, no keyword
    # anywhere in it) got classified by arch-router's own LLM judgment as
    # "reasoning" -- confirmed live via this hook's own log line:
    # `arch-router raw response: "{'route': 'reasoning'}"`, decode speed
    # corroborating (43.47 tok/s, qwen3.8-27b-Expert's documented range,
    # not the 8B model's). The ROUTE_TO_MODEL["other"] fix above doesn't
    # touch this case at all -- "Alive?" was never classified "other", it
    # was explicitly "reasoning". So: a deterministic fast path for trivial
    # greetings/pings, same pattern as DEEP_REASONING_TRIGGERS/_has_image
    # above -- skip the 1.5B classifier's judgment call entirely for a
    # message that's nothing but a greeting/farewell/thanks/status-ping,
    # straight to "casual".
    #
    # WHOLE-MESSAGE match, not substring (deliberately different from
    # DEEP_REASONING_TRIGGERS' substring match above): a substring check
    # would misfire on "hey, can you help me architect this system"
    # (matches "hey") or "thanks for double-checking that build" (matches
    # "thanks"). For reasoning triggers a false positive just means an
    # occasional casual message gets the careful model -- a safe failure
    # direction. For casual triggers a false positive means a genuinely
    # substantial request silently gets the fast model -- not safe -- so
    # this only fires when the ENTIRE message (whitespace/punctuation
    # stripped from the ends, lowercased) matches one of these phrases,
    # nothing else in it. List entries are themselves already
    # punctuation-free for the same reason -- _wants_casual strips "?"/"!"
    # etc. off the incoming message before comparing, so a trailing "?" in
    # a trigger phrase here would never match anything.
    #
    # Curated from real-world small-talk taxonomies (Rasa's well-known
    # default smalltalk intents -- greet/goodbye/thankyou/bot_challenge --
    # are the standard reference for this category) plus the actual case
    # that found this bug ("Alive?").
    CASUAL_TRIGGERS = (
        # status / aliveness pings -- the category that found this bug
        "alive", "are you there", "you there", "still there", "you up",
        "you awake", "anybody home", "anybody there", "ping", "test",
        "testing", "just testing", "can you hear me", "can you see this",
        # greetings
        "hi", "hello", "hey", "hiya", "yo", "sup", "good morning",
        "good afternoon", "good evening", "morning", "evening", "howdy",
        # farewells
        "bye", "goodbye", "bye bye", "see you", "see ya", "later",
        "catch you later", "good night", "night", "talk later",
        "talk soon", "take care",
        # thanks / acknowledgment
        "thanks", "thank you", "thanks a lot", "thanks so much", "thx",
        "ty", "cheers", "appreciate it", "much appreciated", "got it",
        "noted", "ok", "okay", "cool", "cool thanks", "great thanks",
        "perfect thanks", "sounds good", "alright", "nice one",
        "awesome thanks",
        # how-are-you small talk
        "how are you", "how are you doing", "how's it going",
        "hows it going", "what's up", "whats up", "you good", "all good",
        "how have you been",
        # casual status/mood replies -- ADDED 2026-09-13 (Eldar's finding:
        # a lone "chilling" took ~15s round-tripping through the arch-
        # router LLM classifier before landing on "casual" anyway -- same
        # deterministic-fast-path logic applies here as everywhere else in
        # this file: if the classifier reliably lands on casual for it,
        # skip the round trip entirely instead of paying for it every time)
        "chilling", "chillin", "just chilling", "relaxing", "vibing",
        "nothing much", "not much", "nm", "bored", "tired", "sleepy",
        "just here", "just browsing", "same old", "same as usual",
        # bot/identity chit-chat
        "who are you", "what are you", "are you a bot", "are you human",
        "are you real", "are you an ai",
    )


    def _wants_casual(messages):
        for m in reversed(messages):
            if m.get("role") != "user":
                continue
            content = m.get("content")
            if isinstance(content, str):
                # Strip whitespace and common leading/trailing punctuation,
                # lowercase -- the ENTIRE message must match, see comment
                # above for why this isn't a substring check.
                normalized = content.strip().lower().strip(" \t\n.!?,;:-")
                if normalized in CASUAL_TRIGGERS:
                    logger.info(
                        "casual trigger matched (whole message): %r",
                        content[:200],
                    )
                    return True
            # only the latest user turn counts -- stop here either way
            return False
        return False


    # ADDED 2026-09-11, same deterministic-fast-path/latest-turn-only pattern
    # as DEEP_REASONING_TRIGGERS above (and the same 2026-09-09 bug already
    # fixed once there -- checking the whole conversation instead of just the
    # latest user turn would let one old "use opus" message stick to every
    # later unrelated reply). Deliberately real phrases ("use X", "ask X",
    # "switch to X"), not a bare model name alone -- these are paid API calls
    # with no cap, so a broad single-word match ("opus", "gpt") would be too
    # easy to trip by accident inside an unrelated sentence. First match wins
    # if a message somehow names both.
    CLOUD_ALIAS_TRIGGERS = {
        "claude-opus-alias": (
            "use opus", "ask opus", "switch to opus", "via opus",
            "with opus", "use claude opus", "ask claude opus",
        ),
        "gpt-sol-alias": (
            "use sol", "ask sol", "switch to sol", "via sol", "with sol",
            "use gpt sol", "use gpt-5.6", "use gpt-5.6 sol",
        ),
        # Deliberately no trigger phrases for gpt-6-astra or a "Fable"-tier
        # Claude model -- neither has a model_list entry at all, on
        # purpose (see the top-of-file comment). If one gets added later
        # for real manual-only use, it should NOT get a phrase trigger here
        # either -- that's exactly the routine-use path Eldar wants to
        # avoid for that tier.
    }


    def _wants_cloud_alias(messages):
        for m in reversed(messages):
            if m.get("role") != "user":
                continue
            content = m.get("content")
            if isinstance(content, str):
                content = _strip_memory_context(content)
                lowered = content.lower()
                for model_name, triggers in CLOUD_ALIAS_TRIGGERS.items():
                    for t in triggers:
                        if t in lowered:
                            logger.info(
                                "cloud-alias trigger matched %r -> %s, in: %r",
                                t, model_name, content[:200],
                            )
                            return model_name
            # only the latest user turn counts -- stop here either way
            return None
        return None


    class ArchRouterHook(CustomLogger):
        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            if data.get("model") != "auto":
                return data

            # Checked before EVERYTHING else, including the media-gen-busy
            # check right below -- a deliberate "use opus" ask is a plain
            # cloud API call that never touches aibox's GPU, so it has no
            # reason to wait on or be downgraded by whatever ComfyUI is
            # doing. See the top-of-file "CLOUD ALIASES FOR DELIBERATE USE"
            # comment and CLOUD_ALIAS_TRIGGERS above.
            alias_model = _wants_cloud_alias(data.get("messages", []))
            if alias_model:
                data["model"] = alias_model
                logger.info("auto -> cloud alias -> %s", alias_model)
                return data

            # Checked before anything else -- if ComfyUI has the GPU, every
            # route (including vision/medical) goes to the cloud fallback
            # uniformly, so there's no point running the image check or
            # paying for a classifier call first.
            if await _media_gen_busy():
                data["model"] = BUSY_FALLBACK_MODEL
                logger.info("auto -> %s (media-gen busy)", BUSY_FALLBACK_MODEL)
                return data

            messages = data.get("messages", [])

            # Deterministic fast path: an attached image always needs the
            # vision model. No reason to spend a classifier call on a signal
            # we can just check for directly.
            if _has_image(messages):
                data["model"] = ROUTE_TO_MODEL["vision"]
                logger.info("auto -> vision (image attached) -> %s", data["model"])
                return data

            if _wants_vision_tool(messages):
                data["model"] = ROUTE_TO_MODEL["vision"]
                logger.info("auto -> vision (hermes image marker) -> %s", data["model"])
                return data

            # Deterministic fast path, same idea as the image check above:
            # an explicit "think deeply" / "be thorough" / "step by step"
            # style instruction always goes to the 27B model, no classifier
            # judgment call involved. See DEEP_REASONING_TRIGGERS above.
            if _wants_deep_reasoning(messages):
                data["model"] = ROUTE_TO_MODEL["reasoning"]
                logger.info(
                    "auto -> reasoning (explicit deep-thought keyword) -> %s",
                    data["model"],
                )
                return data

            # Deterministic fast path, same idea as the checks above: any
            # request that plausibly needs one of Hermes's real tools
            # (media generation/editing, vault search/ingest) goes straight
            # to the 27B model, no classifier judgment call involved -- see
            # TOOL_USE_TRIGGERS above for the real production bug this
            # fixes (hermes3-llama-3.1-8b, the "other"/"casual" route
            # model, fabricating tool results instead of calling the tool).
            if _wants_tool_use(messages):
                data["model"] = ROUTE_TO_MODEL["reasoning"]
                logger.info(
                    "auto -> reasoning (tool-use keyword) -> %s",
                    data["model"],
                )
                return data

            # Deterministic fast path, same idea as the checks above: a
            # message that's nothing but a greeting/farewell/thanks/status-
            # ping always goes straight to "casual", no classifier judgment
            # call. See CASUAL_TRIGGERS above for why this exists (the
            # "Alive?" -> reasoning finding) and why it's a WHOLE-message
            # match rather than substring.
            if _wants_casual(messages):
                data["model"] = ROUTE_TO_MODEL["casual"]
                logger.info(
                    "auto -> casual (greeting/ping keyword) -> %s",
                    data["model"],
                )
                return data

            route = "other"
            try:
                # BUG FIXED 2026-09-07: this used to include every message
                # verbatim -- including Hermes's own system message, which
                # carries its full agent harness (SOUL.md, tool defs, skills)
                # and alone runs into the tens of thousands of tokens (Eldar
                # saw 13.1k/131.1k on Hermes's own status bar for a single
                # "hey"). arch-router-1.5b only has an 8192-token context
                # (-c 8192 in llama-swap-configmap.yaml) -- that overflow is
                # exactly what caused every classification call to fail with
                # "400 Bad Request" and silently fall back to "other" on
                # every single message, defeating the router entirely.
                # Arch-Router only needs the recent human/assistant turns to
                # classify intent, not an agent's full system prompt -- drop
                # system messages and cap to the last few turns.
                #
                # SECOND BUG FIXED 2026-09-09, ROOT-CAUSED via a diagnostic
                # log of the real convo array (kept temporarily, then
                # removed once this confirmed it -- see git history if
                # needed again): role="tool" messages were NOT excluded by
                # the filter above (their content is a plain string, same
                # as a normal turn, so isinstance(str) let them straight
                # through) -- live evidence: a live weather-search follow-up
                # question sent the classifier `[assistant:'',
                # tool:<huge raw weather-API JSON>, assistant:'Barcelona
                # today...', user:'what's the weather in Warsaw?',
                # assistant:'', tool:<huge raw weather-API JSON>]` as its
                # last-6-message window -- two giant raw JSON blobs
                # completely dominating the window, the actual human
                # question buried in the middle, and the LAST message the
                # classifier saw being raw tool telemetry, not a real
                # conversational turn. Unsurprising a 1.5B model answered
                # "other" on that. Same fix as the system-message bug above,
                # same reasoning: the classifier needs real human/assistant
                # turns, not tool output. Excludes "tool" from the filter.
                # THIRD BUG FIXED 2026-09-09, ROOT-CAUSED via the re-added
                # convo diagnostic below (live evidence this time, pod
                # restart confirmed via a genuinely new pod name): a
                # tool-call-only assistant turn has empty string content
                # ("") -- that passes isinstance(str) same as real text, so
                # it wasn't excluded either. Live example: the classifier's
                # last-6 window for a real "what's the weather in Gdansk?"
                # follow-up ended with an empty assistant turn (the
                # tool-call-in-progress stub) as the LAST item, one slot
                # after the actual question -- the classifier's most recent
                # impression of the conversation was a blank line, not the
                # real request. Also drops empty/whitespace-only content.
                # FOURTH BUG FIXED 2026-09-16 (Eldar's question: "will it
                # work the same way for other models like reasoning,
                # medical?"): the _strip_memory_context fix on
                # _wants_vision_tool/_wants_deep_reasoning/_wants_cloud_alias
                # (see MEMORY_CONTEXT_MARKER's own comment above) only
                # covers the deterministic keyword shortcuts -- "medical"
                # has no keyword shortcut at all, and "reasoning" only has
                # one for explicit trigger phrases, so any request that
                # falls through to arch-router's OWN classifier call (which
                # is most of them) was still handing this same huge
                # Honcho-injected <memory-context> blob to a 1.5B model with
                # a much smaller context window than the GPU chat models,
                # unstripped, on every single "auto" call that reaches this
                # point -- not just a misrouting risk (old recalled topics
                # bleeding into what should be a fresh classification) but a
                # real waste of arch-router's limited -c 24576 context and
                # the exact CPU time the -t 8->12 bump above was meant to
                # free up. Stripped here too, per-message, so arch-router
                # never sees recalled-memory text for ANY route it decides,
                # not just the ones with a keyword shortcut.
                convo = []
                for m in messages:
                    if m.get("role") in ("system", "tool"):
                        continue
                    content = m.get("content")
                    if not isinstance(content, str):
                        continue
                    content = _strip_memory_context(content).strip()
                    if not content:
                        continue
                    convo.append({"role": m.get("role"), "content": content})
                convo = convo[-6:]
                logger.info("arch-router convo (post tool-filter): %r", convo)
                prompt = SYSTEM_PROMPT.format(
                    routes=json.dumps(ROUTES), conversation=json.dumps(convo)
                )
                # timeout bumped 10.0 -> 30.0 2026-09-07: arch-router-1.5b
                # runs ttl:0 (always resident) once started, but the very
                # first call after a llama-swap/litellm restart has to cold-
                # start its llama-server process (load the ~986MB GGUF from
                # disk) before it can answer at all -- 10s wasn't enough and
                # every classification call failed with an httpx.ReadTimeout
                # right after a restart. httpx timeout exceptions stringify
                # to "" (a real Python gotcha), which is why the previous log
                # line showed "...defaulting to general chat: " with nothing
                # after the colon -- not a logging bug, a genuinely empty
                # message. type(exc).__name__ added below so this is
                # diagnosable from the log line itself next time, without
                # having to guess.
                async with httpx.AsyncClient(timeout=30.0) as client:
                    resp = await client.post(
                        ARCH_ROUTER_URL,
                        json={
                            "model": ARCH_ROUTER_MODEL,
                            "messages": [{"role": "user", "content": prompt}],
                            "temperature": 0,
                            "max_tokens": 20,
                        },
                    )
                    resp.raise_for_status()
                    text = resp.json()["choices"][0]["message"]["content"]
                    # ADDED 2026-09-07: every classification call started
                    # landing on "other" -- not via the exception branch
                    # below (which never fired, confirmed via kubectl logs),
                    # meaning the model answers successfully but the regex
                    # below stopped matching whatever it's actually saying
                    # now. We had zero visibility into the raw text before
                    # this point -- only the final resolved route was ever
                    # logged. Logging it raw (repr'd, so stray whitespace/
                    # newlines/quote-style are visible) is the fastest way
                    # to see the real cause on the next request instead of
                    # guessing at the regex or the prompt again.
                    logger.info("arch-router raw response: %r", text)
                    # BUG FIXED 2026-09-07: arch-router-1.5b (Q4_K_M, this
                    # serving setup) reliably answers with single-quoted,
                    # Python-dict-style output -- {'route': 'casual'} -- not
                    # strict double-quoted JSON, which made json.loads() fail
                    # on every single classification with a JSONDecodeError
                    # (silently falling back to "other" every time, same
                    # end result as the earlier timeout/context bugs, just a
                    # different cause). Rather than fight the model's actual
                    # output format, extract the route value directly with a
                    # regex that accepts either quote style and ignores any
                    # surrounding text -- more robust than requiring the
                    # whole response to be parseable JSON in the first place.
                    match = re.search(r'["\']route["\']\s*:\s*["\']([\w-]+)["\']', text)
                    route = match.group(1) if match else "other"
            except Exception as exc:  # noqa: BLE001 -- any failure just falls back
                logger.warning(
                    "arch-router classification failed (%s: %s), defaulting to general chat",
                    type(exc).__name__, exc,
                )
                route = "other"

            data["model"] = ROUTE_TO_MODEL.get(route, ROUTE_TO_MODEL["other"])
            # Success case, logged at INFO specifically so it's visible via
            # `kubectl logs -n ai-models -l app=litellm` -- otherwise the
            # only visible signal a caller gets back is the literal string
            # "auto" (Hermes's status bar showed exactly that and Eldar had
            # no way to confirm a route actually fired without this).
            logger.info("auto -> %s -> %s", route, data["model"])
            return data


    proxy_handler_instance = ArchRouterHook()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-models
  labels:
    app: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      # 2026-09-17: picked up automatically by k8s/p8/prometheus.yaml's
      # pod-annotation-based scrape config (kubernetes_sd_configs role:
      # pod, looking for exactly these three annotation names) -- no
      # change needed on the prometheus.yaml side when this pod restarts.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/litellm-extra/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PYTHONPATH
              value: "/litellm-extra"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master_key
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter-secret
                  key: OPENROUTER_API_KEY
            # LANGFUSE tracing creds, 2026-09-17 (see litellm_settings.
            # success_callback above and k8s/p8/langfuse.yaml). Unlike
            # every other secret in this cluster, these AREN'T
            # self-generated random values -- LANGFUSE_PUBLIC_KEY/
            # LANGFUSE_SECRET_KEY are issued by LangFuse itself from
            # inside its own web UI (Project Settings -> API Keys), only
            # AFTER Eldar has logged in once and created a project there.
            # So litellm-langfuse-secret has to be created by hand after
            # that first login, not alongside the other secrets -- see
            # k8s/secrets/README.md's litellm-langfuse-secret section.
            #
            # optional: true on BOTH refs, added 2026-09-17 after first
            # real deploy: without this, a secretKeyRef to a Secret/key
            # that doesn't exist yet blocks the WHOLE pod from starting
            # (CreateContainerConfigError), not just that one env var --
            # confirmed live, this took down litellm cluster-wide (every
            # caller: Hermes, Honcho, Open WebUI, the sync scripts) the
            # moment this file was applied, since litellm-langfuse-secret
            # can't exist yet at that point (see comment above -- it needs
            # a LangFuse login first). optional: true makes k8s just leave
            # the env var unset instead of refusing to start the
            # container when the Secret/key is missing -- LiteLLM's own
            # Langfuse integration handles missing creds by logging a
            # warning and skipping that one trace, not crashing, so this
            # is safe either way. Once litellm-langfuse-secret is created
            # for real, a pod restart picks up the real values normally.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-langfuse-secret
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-langfuse-secret
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.ai-observe.svc.cluster.local:3000"
          volumeMounts:
            - name: config
              mountPath: /litellm-extra
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-models
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      name: http
