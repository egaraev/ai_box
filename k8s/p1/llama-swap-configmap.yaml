      #      llama-swap behavior confirmed it gets evicted every time a
      #      model in that set starts, and vice versa. It's back in the set
      #      (ANDed in with "& arch"), which is what actually keeps it
      #      concurrent. ttl: 0 only controls idle-unload timing, nothing
      #      to do with concurrency.
      #
      # STATUS: real file confirmed present on aibox 2026-09-07 (was
      # speculative when this comment was first written). Arch-Router-1.5B-
      # Q4_K_M.gguf (~986MB), from Hugging Face at katanemo/Arch-Router-1.5B.gguf.
      # Original download commands, for reference:
      #   mkdir -p /data/models/arch-router-1.5B
      #   cd /data/models/arch-router-1.5B
      #   wget https://huggingface.co/katanemo/Arch-Router-1.5B.gguf/resolve/main/Arch-Router-1.5B-Q4_K_M.gguf
      arch-router-1.5b:
        # -c bumped 8192 -> 24576 2026-09-07: CPU-only + a ~1B-class model,
        # so this costs system RAM, not the GPU's tight VRAM budget -- cheap
        # to size generously. Real fix for the "400 Bad Request on every
        # classification call" bug was capping what custom_router_hook.py
        # actually sends (see its own comment in litellm.yaml -- it was
        # forwarding Hermes's full system-prompt/tool-harness, tens of
        # thousands of tokens, into an 8192-token context); this is just
        # headroom on top of that fix, not the fix itself.
        #
        # env: CUDA_VISIBLE_DEVICES="" ADDED 2026-09-07: -ngl 0 alone does
        # NOT stop a CUDA-built llama-server from touching the GPU (still
        # creates a CUDA context, can offload some compute buffer ops
        # regardless). Once this model was ANDed into resident_router
        # (below) so it's always concurrent with qwen3.8-27b-Expert, that
        # small reserved overhead was enough to push the already razor-thin
        # 27B model into "cudaMalloc failed: out of memory" on a 400MB
        # allocation, even with 14GB+ nominally free per nvidia-smi (a
        # startup-time CUDA contention issue, not a real aggregate
        # shortage). This forces genuinely CPU-only execution, same fix as
        # nomic-embed-text-v1.5 and qwen3-1.7b-cpu.
        #
        # -t 8 -> 12 CHANGED 2026-09-16 (Eldar's call, after the second-GPU
        # migration freed real CPU headroom): this model is on the hot path
        # for literally every chat message (arch-router classifies every
        # "auto" request before routing), and was still capped at the same
        # -t 8 set back on 2026-09-07 purely to survive 48-thread
        # oversubscription from qwen3-1.7b-cpu's old -t 16 -- that model is
        # gone from the CPU picture entirely now (moved to its own GPU, see
        # qwen3-1.7b-gpu's own comment below, its CPU footprint pinned to a
        # known small -t 2 the same day this changed rather than left on an
        # unverified default). With that reservation freed and every GPU
        # chat model's CPU threads mostly idle (fully -ngl 99 offloaded,
        # their -t 8 covers prompt/sampling overhead, not real compute),
        # arch-router -- a genuinely CPU-bound classifier -- gets a real
        # bump instead of the previous survive-only value. 12 leaves
        # explicit margin on aibox's 16 logical cores for nomic-embed's -t 2
        # and whatever slice of a GPU model's -t 8 is actually active at
        # once, rather than claiming all 16. NOT YET CONFIRMED on aibox --
        # after this deploys, re-run the same kind of multi-turn concurrent
        # test that originally caught the httpx.ReadTimeout regression (see
        # qwen3.8-27b-Expert's own -t history above) and confirm arch-router
        # classification calls come back faster with no renewed timeouts.
        # MOVED TO GPU 2026-09-18 (Eldar's call: "cannot wait 7-10 seconds
        # for each decision" -- arch-router classifies every single "auto"
        # chat message on the hot path, so its decode speed is felt on
        # literally every message). Supersedes the -t 8->12 CPU-tuning
        # rationale above -- this model is no longer CPU-bound at all.
        # Moved to the RTX 3060 (GPU 0), the same card qwen3-1.7b-gpu (and
        # therefore Honcho's deriver/dialectic/summary/dream calls) already
        # runs on -- Eldar's own framing for this change. -ngl 0 -> 99,
        # --no-mmap dropped (meaningless once weights are on GPU),
        # --flash-attn on added, -t 12 -> 2 (same small value as
        # qwen3-1.7b-gpu and nomic-embed-text-v1.5 -- CPU now only covers
        # prompt/sampling overhead, not real compute).
        #
        # PINNED BY UUID, NOT INDEX, same as every other GPU model in this
        # file after the index-pin bug found during the original second-GPU
        # migration (see qwen3-1.7b-gpu's own comment above for the full
        # root cause) -- GPU-e52569a1-1ceb-1492-9abe-cd07922b1cf8 is the
        # 3060 specifically, not whatever index CUDA happens to rank it.
        #
        # VRAM check: 3060 is 12288MiB total; qwen3-1.7b-gpu alone already
        # uses ~5.5GB there. Arch-Router-1.5B-Q4_K_M is a small ~1GB-class
        # model at this context size, so the combined footprint should
        # comfortably fit -- but this box has hit razor-thin-VRAM OOMs
        # before on the 5070 Ti (see qwen3.8-27b-Expert's own comment), so
        # worth an nvidia-smi check after first boot rather than assuming.
        # NOT YET CONFIRMED on aibox.
        cmd: |
          llama-server
          -m /models/arch-router-1.5B/Arch-Router-1.5B-Q4_K_M.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          --flash-attn on
          -t 2
          -c 24576
          --temp 0
        env:
          - "CUDA_VISIBLE_DEVICES=GPU-e52569a1-1ceb-1492-9abe-cd07922b1cf8"    # 3060
        ttl: 0

    matrix:
      # vars/sets TRIMMED 2026-09-07 to match the models actually on aibox
      # (Eldar's call -- removed agents-a1/a1, ornith-35b/orn,
      # qwen3.6-35b/qw6, gpt-oss-20b/goss, qwen3-vl-30b/qvl, none of which
      # had a GGUF on disk). gemma4-26b and qwopus-general (qpg) both had
      # real folders on aibox at that point but neither was wired into the
      # LiteLLM router yet -- qpg stayed in resident_router below since it
      # already was, ahead of actually being routed to (which happened
      # 2026-09-10 -- it's now the "vision" route target, see litellm.yaml).
      # gemma4-26b was never in this set and still isn't, since it still has
      # no router role.
      vars:
        qpg:  qwopus-general
        h31:  hermes3-llama-3.1-8b
        # med: value CHANGED 2026-09-16 (medgemma-1.5-4b -> llama3.1-aloe-beta-8b,
        # see the model entry above for the full why) -- alias itself kept
        # stable, same pattern as q17's rename below, so resident_router
        # doesn't need touching.
        med:  llama3.1-aloe-beta-8b
        arch: arch-router-1.5b
        qwe:  qwen3.8-27b-Expert
        qwv:  qwen3.8-27b-Expert-Vision
        emb:  nomic-embed-text-v1.5
        q17:  qwen3-1.7b-gpu

      sets:

        # BUG FIXED 2026-09-07: the comment that used to be here claimed
        # ttl:0 alone keeps a CPU-only model "always resident independent
        # of whatever's swapped in on the GPU" -- confirmed FALSE by real
        # llama-swap behavior (kubectl logs showed explicit
        # "evict=[arch-router-1.5b] target=[qwen3.8-27b-Expert]" and the
        # reverse, every single time either side started -- the semantic
        # router was silently falling back to "other" on a huge fraction of
        # real requests because of this). llama-swap's matrix/groups solver
        # only keeps concurrent whatever's actually named inside the DSL
        # expression -- ttl is purely about idle-unload timing, unrelated to
        # concurrency. Per llama-swap's own docs (Groups V2/matrix design,
        # github.com/mostlygeek/llama-swap#643), the correct way to keep a
        # model concurrent alongside a whole OR-set is to AND it into that
        # set explicitly -- which is exactly what the ORIGINAL Windows-lab
        # config already did for the old 7B autocomplete model ("& q7",
        # dropped only because that model itself was retired, not because
        # the pattern was wrong -- see the no-rewrite-principle note at the
        # top of this file). Restored that pattern here, and extended it to
        # nomic-embed-text-v1.5 and qwen3-1.7b-cpu (now qwen3-1.7b-gpu) too:
        # both have the exact same ttl:0-is-enough assumption and no matrix
        # var at all, meaning Honcho's background deriver/embedding calls
        # have almost certainly been hitting this same silent eviction on
        # every GPU model swap, just unnoticed since Honcho retries quietly
        # in the background rather than surfacing an error to a human.
        # h31 (hermes3-llama-3.1-8b) is the "casual"/"other" route
        # destination (see litellm.yaml) -- without it in this OR-group,
        # arch/emb/q17 would get silently evicted whenever it's the model
        # actually loaded.
        #
        # q8 (qwen3-8b) and l31 (llama-3.1-8b) REMOVED 2026-09-16 along with
        # their model entries above (Eldar's cleanup call, both long unwired
        # -- see the REMOVED comment where their entries used to be).
        # q17 (qwen3-1.7b-gpu) TAKEN OUT of this AND-group, then PUT BACK,
        # same day 2026-09-18: briefly tried letting it idle-evict off the
        # 3060 between Honcho calls, reverted within minutes once Eldar
        # clarified he wants instant responses from both q17 and
        # arch-router-1.5b, not just arch-router. Both stay permanently
        # resident, same "ttl alone isn't enough, must be ANDed into this
        # set too" mechanism the 2026-09-07 bug fix above established.
        resident_router: "(qpg | h31 | med | qwe | qwv) & arch & emb & q17"
