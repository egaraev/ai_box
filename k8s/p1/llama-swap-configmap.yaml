apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: ai-models
data:
  config.yaml: |
    # llama-swap config.yaml — migrated from the Windows lab
    # (D:\repo\ai_ml_cv_projects\ai-lab\configs_llama\config.yaml) per the
    # no-rewrite principle: same model definitions and tuning, only the binary
    # path and model paths changed for the containerized Linux environment.
    #
    #   C:\llama-cpp\llama-server.exe        -> llama-server   (baked into the
    #                                            ghcr.io/mostlygeek/llama-swap:unified-cuda
    #                                            image, already on PATH)
    #   C:\AI\HF_llama.cpp\<model-dir>\...    -> /models/<model-dir>/...
    #                                            (hostPath /data/models on aibox,
    #                                            mounted into the container at /models)
    #
    # P1 only has qwen3.8-27b-Expert's and qwen3.8-27b-Expert-Vision's GGUF
    # files actually present on aibox so far — every other entry below is
    # carried over structurally (matching the Windows config 1:1) but won't
    # serve anything until its files are copied into the matching
    # /data/models/<dir>/ subfolder.
    healthCheckTimeout: 300
    logLevel: info

    models:

      qwen3.8-27b-Expert:
        # PATH UPDATED 2026-09-07: aibox's /data/models moved from a flat
        # qwen3.8-27B-MTP/ folder holding everything to qwen3.8-27B/ (base
        # model directly inside) + qwen3.8-27B/vision/ (the vision quant +
        # its mmproj, kept separate since only Expert-Vision needs them).
        # 2026-09-05: LOCKED at -c 65536, no vision, on aibox (RTX 5070 Ti 16GB;
        # XFCE desktop holds ~530MB VRAM at all times -- Xorg/Chromium GPU process
        # -- eating into the same razor-thin headroom the Windows benchmark
        # already had at 85k context). Empirically confirmed on aibox, clean pod
        # each time, no leftover processes:
        #   - 65536, no --mmproj:  WORKS. 44.8 t/s decode (matches the Windows
        #     benchmark for this quant). This is the configuration in use.
        #   - 65536, with --mmproj (vision): OOM, ~885MB short.
        #   - 80000, no --mmproj:  OOM, ~470MB short on the compute buffer alone.
        #   - 90000, no --mmproj:  OOM, worse than 80000.
        # 65536 already satisfies Hermes Agent's 64K minimum context requirement,
        # so this is locked in rather than continuing to chase 80k/90k, which
        # reproducibly fails. --parallel 1 kept (server defaults to n_slots=4
        # otherwise per its own startup log, which cost headroom for no benefit
        # here). Going higher than 65536 and/or restoring --mmproj both require
        # actually freeing VRAM, not more context tuning -- the real lever is the
        # desktop's ~530MB baseline (planned nvidia-drm.modeset=0 / no-GUI
        # switch), not another value to try here.
        cmd: |
          llama-server
          -m /models/qwen3.8-27B/Qwen3.8-27B-UD-IQ4_XS.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -t 16
          --no-mmap
          --parallel 1
          -fa on
          -c 65536 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 4096
          --reasoning-effort medium
        ttl: 300

      qwen3.8-27b-Expert-Vision:
        # 2026-09-06: LOCKED. Started life as "qwen3.8-27b-Test" -- a lighter
        # Q3_K_XL quant (~1.1GB smaller than Expert's IQ4_XS) tried specifically
        # to see whether the VRAM savings alone (holding context at Expert's
        # proven-safe 65536, not cutting it further) would be enough to also fit
        # --mmproj (vision) on this GPU. Empirically confirmed on aibox, clean
        # pod, no leftover processes:
        #   - 65536, with --mmproj: WORKS. No OOM. 68.62 t/s prompt / 47.17 t/s
        #     decode -- actually faster than Expert's 44.8-45.1 t/s, and has
        #     vision where Expert doesn't. Confirmed end-to-end via Open WebUI
        #     with a real image (model correctly described it), not just a
        #     clean load.
        #   - 100000, with --mmproj: OOM, same 884.62 MiB short on the mmproj
        #     buffer as Expert hit at 65536 -- confirms the shortfall scales
        #     with context, not quant alone; 65536 is still the ceiling for
        #     vision on this box until the desktop's ~530MB baseline is freed.
        # Renamed from "Test" to "Expert-Vision" now that it's confirmed as the
        # go-to vision-capable model, better than Expert on every axis measured
        # here (speed, vision) for the same 65536 context. Same lower-bit-quant
        # quality tradeoff vs Expert's IQ4_XS applies in principle (Q3_K_XL is
        # a smaller quant), but no quality regression observed in testing so
        # far. --parallel 1 kept for the same reason as Expert (avoid the
        # default n_slots=4 overhead). 2026-09-06: --reasoning-effort bumped
        # from medium to high (tried xhigh first, settled on high) to test
        # whether more reasoning improves output quality on this box -- watch
        # decode speed, this is untested. Note: --reasoning-budget is still
        # capped at 4096 tokens, which caps how much effort levels above
        # medium can actually use -- raise the budget too if higher effort
        # doesn't seem to change anything.
        cmd: |
          llama-server
          -m /models/qwen3.8-27B/vision/Qwen3.8-27B-UD-Q3_K_XL.gguf
          --mmproj /models/qwen3.8-27B/vision/mmproj-F16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -t 16
          --no-mmap
          --parallel 1
          -fa on
          -c 65536 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 4096
          --reasoning-effort high
        ttl: 300

      # ── NEW (P2, 2026-09-06): CPU-only models supporting the Honcho memory
      # layer. Both run -ngl 0 (no GPU layers) so they never contend with
      # Open WebUI's GPU chat models via llama-swap's model-swap mechanism --
      # Honcho's background deriver/embedding calls can fire at any time,
      # including mid-conversation, without disrupting whatever's loaded on
      # the GPU. ttl: 0 (like arch-router-1.5b) keeps them always resident
      # since they cost no VRAM either way.
      nomic-embed-text-v1.5:
        # Embeddings-only model for Honcho's EMBED_MESSAGES pipeline (see
        # k8s/p2/honcho.yaml). Q8_0 quant, ~140MB. --pooling mean is
        # nomic-embed-text-v1.5's documented setting for llama.cpp serving.
        # Known minor quality caveat: nomic-embed-text-v1.5 is trained with
        # task-instruction prefixes ("search_query: ...", "search_document:
        # ...") for best retrieval quality -- Honcho's embedding calls won't
        # send these, so embeddings will work but may be somewhat less
        # precise than the model's benchmarked numbers. Not a blocker.
        #
        # env: CUDA_VISIBLE_DEVICES="" ADDED 2026-09-07: -ngl 0 alone does
        # NOT stop a CUDA-built llama-server from touching the GPU -- it
        # still creates a CUDA context and can offload some compute buffer
        # ops regardless (confirmed via llama.cpp's own maintainers). This
        # only became a real problem once this model was ANDed into the
        # matrix's resident_router set (below) so it's always concurrent
        # with the GPU models -- qwen3.8-27b-Expert already runs at a
        # documented, razor-thin VRAM ceiling on this card, and three CPU
        # models each quietly reserving a bit of CUDA context overhead was
        # enough to push it into "cudaMalloc failed: out of memory" on a
        # mere 400MB allocation, even with 14GB+ nominally free (a startup-
        # time CUDA contention/fragmentation issue, not a simple aggregate
        # shortage). CUDA_VISIBLE_DEVICES="" forces this process to never
        # initialize CUDA at all -- genuinely CPU-only, not just -ngl 0.
        cmd: |
          llama-server
          -m /models/nomic-embed-text-v1.5/nomic-embed-text-v1.5.Q8_0.gguf
          --port ${PORT}
          --host 0.0.0.0
          --embedding
          --pooling mean
          -ngl 0
          -t 8
          -c 8192
          -b 8192
          -ub 8192
        env:
          - "CUDA_VISIBLE_DEVICES="
        ttl: 0

      qwen3-1.7b-cpu:
        # Dedicated tiny CPU model for all of Honcho's non-embedding LLM
        # calls (deriver extraction, dialectic, summary, dream) -- see
        # k8s/p2/honcho.yaml's per-feature MODEL_CONFIG overrides, all
        # pointed at this model name. Context capped at 32768; Honcho's
        # DERIVER_MAX_INPUT_TOKENS/DIALECTIC_MAX_INPUT_TOKENS are reduced in
        # honcho.yaml to fit inside this with headroom for output.
        # Sampling params are Qwen3's own documented non-thinking defaults.
        # 2026-09-06: -t bumped 8->16 (aibox has 16 cores, this was only
        # using half) after the first real smoke test showed ~82-92s per
        # deriver extraction call. Confirmed via re-test: only a modest,
        # inconsistent improvement (avg ~77s across 5 calls, range 42-106s)
        # -- thread count wasn't the dominant bottleneck. The likely real
        # cause: Qwen3 dense models think by default (emit reasoning_content
        # before the actual answer/tool-call) unless told not to, and this
        # model never had --reasoning-budget set, unlike every GPU model in
        # this roster. On CPU, token *generation* speed is the bottleneck,
        # and thinking mode can multiply generated tokens well past what
        # Honcho's deriver actually needs (a structured
        # extraction/tool-call, not visible reasoning) -- so
        # --reasoning-budget 0 added to disable it. Re-test after this
        # change before concluding a smaller model is needed.
        # env: CUDA_VISIBLE_DEVICES="" ADDED 2026-09-07: see the identical
        # comment on nomic-embed-text-v1.5 above -- same fix, same reason
        # (this model being ANDed into resident_router is what surfaced it).
        cmd: |
          llama-server
          -m /models/qwen3-1.7B/Qwen3-1.7B-Q8_0.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 0
          -t 16
          --no-mmap
          -c 32768
          --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0
          --reasoning-budget 0
        env:
          - "CUDA_VISIBLE_DEVICES="
        ttl: 0

      # NOTE 2026-09-07: still inactive placeholders (no GGUF on aibox, per
      # the top-of-file P1 comment) -- not touched as part of the
      # qwen3.8-27B folder restructure below, so their -m/-mmproj paths
      # still point at the now-gone qwen3.8-27B-MTP/ layout. Fix the paths
      # for real if these are ever activated.
      qwen3.8-27b-Atomic:
        cmd: |
          llama-server
          -m /models/qwen3.8-27B-MTP/Qwen3.8-27B-AD-IQ3_S.gguf
          --mmproj /models/qwen3.8-27B-MTP/mmproj-F16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -t 16
          --no-mmap
          -fa on
          -c 80000 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 4096
          --reasoning-effort medium
        ttl: 300

      qwen3.8-27b-MTP:
        cmd: |
          llama-server
          -m /models/qwen3.8-27B-MTP/Qwen3.8-27B-UD-IQ4_XS.gguf
          --model-draft /models/qwen3.8-27B-MTP/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -ngld 99
          -t 16
          --no-mmap
          --parallel 1
          --spec-type draft-mtp --spec-draft-n-max 4
          -fa on
          -c 40000 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 2048
          --reasoning-effort low
        ttl: 300

      agents-a1:
        cmd: |
          llama-server
          -m /models/agents-a1/agents-a1-Q4_K_M-MTP-graft-headQ6.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          --n-cpu-moe 32
          -t 16
          --no-mmap
          --flash-attn on
          -ctk q8_0
          -ctv q8_0
          -c 131072
          -b 2048 -ub 512
          --cache-reuse 256
          --jinja
          --temp 0.85
          --top-p 0.95
          --top-k 20
          --min-p 0.0
          --presence-penalty 1.1
          --repeat-penalty 1.0
          --spec-type draft-mtp
          --spec-draft-n-max 3
          --dry-multiplier 0.8
          --dry-base 1.75
          --dry-allowed-length 2
          --dry-penalty-last-n 4096
          --reasoning-budget -1
        ttl: 300

      ornith-35b:
        cmd: |
          llama-server
          -m /models/ornith-35b/ornith-1.0-35b-MXFP4_MOE-MTP.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          --n-cpu-moe 32
          -t 16
          --no-mmap
          --flash-attn on
          --jinja
          -ctk q4_0
          -ctv q4_0
          -c 131072
          -b 2048 -ub 512
          --cache-reuse 256
          --spec-type draft-mtp
          --spec-draft-n-max 3
          --dry-multiplier 0.8
          --dry-base 1.75
          --dry-allowed-length 2
          --dry-penalty-last-n 4096
          --reasoning-budget 8096
        ttl: 300

      # qwopus-coder: RETIRED 2026-07-14 -- repeated reliability problems
      # (circling, wrong-directory writes, excessive thinking time). Replaced by
      # qwen3.6-35b as the "code" role in litellm_config.yaml. Block removed
      # entirely; re-add from git history if ever needed again.

      qwopus-general:
        cmd: |
          llama-server
          -m /models/qwopus3.6-35B/Qwopus3.6-35B-A3B-v1-APEX-MTP-I-Balanced.gguf
          --mmproj /models/qwopus3.6-35B/mmproj-F16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          --n-cpu-moe 25
          -t 16
          --no-mmap
          --flash-attn on
          --jinja
          -ctk q4_0
          -ctv q4_0
          -c 131072
          -b 2048 -ub 512
          --cache-reuse 256
          --spec-type draft-mtp
          --spec-draft-n-max 4
          --dry-multiplier 0.8
          --dry-base 1.75
          --dry-allowed-length 2
          --dry-penalty-last-n 4096
          --reasoning-budget 8096
        ttl: 1800

      # qwen2.5-coder-7b / qwen2.5-coder-7b-lora-20260712: DROPPED for aibox --
      # these existed on the Windows lab purely as the IDE tab-complete model
      # (kept ttl:0/resident so autocomplete never waits on a reload). aibox has
      # no IDE pointed at it, so there's no autocomplete workload to serve; if
      # that ever changes, restore both blocks + the "q7" matrix var from the
      # Windows config.yaml git history.

      # qwen3-coder-30b: RETIRED 2026-07-14 -- slow, high VRAM (no MTP draft
      # head in this quant), and had no fallback chain of its own in
      # litellm_config.yaml (a real production gap that surfaced once already).
      # Replaced by qwen3.6-35b as the "code" role. Block removed entirely;
      # re-add from git history if ever needed again.

      gemma4-26b:
        cmd: |
          llama-server
          -m /models/Gemma4-26B/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
          --mmproj /models/Gemma4-26B/mmproj-F16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          --n-cpu-moe 20
          -t 16
          --no-mmap
          --flash-attn on
          --jinja
          -ctk q4_0
          -ctv q4_0
          -c 32768
        ttl: 300

      qwen3.6-35b:
        cmd: |
          llama-server
          -m /models/qwen3.6-35b/Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          --n-cpu-moe 32
          -t 16
          --no-mmap
          --flash-attn on
          --jinja
          -ctk q4_0
          -ctv q4_0
          -c 131072
          -b 2048 -ub 512
          --cache-reuse 256
          --spec-type draft-mtp
          --spec-draft-n-max 3
          --reasoning-budget 1024
        ttl: 300

      gpt-oss-20b:
        cmd: |
          llama-server
          -m /models/gpt-oss-20B/gpt-oss-20b-f16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          --n-cpu-moe 28
          -t 16
          --no-mmap
          --flash-attn on
          --jinja
          -ctk q4_0
          -ctv q4_0
          -c 131072
        ttl: 300

      # ── ACTIVATED 2026-09-07: wired into LiteLLM's semantic router as the
      # "fast" route (see k8s/p1/litellm.yaml's custom_router_hook.py) --
      # quick/simple questions that don't need the 27B model's full weight.
      # STATUS: config only until the GGUF is actually on aibox. Real file,
      # confirmed on Hugging Face at unsloth/Qwen3-8B-GGUF:
      #   mkdir -p /data/models/qwen3-8B
      #   cd /data/models/qwen3-8B
      #   wget https://huggingface.co/unsloth/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
      qwen3-8b:
        cmd: |
          llama-server
          -m /models/qwen3-8B/Qwen3-8B-Q4_K_M.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          -t 8
          --no-mmap
          --flash-attn on
          --jinja
          -ctk q8_0
          -ctv q8_0
          -c 32768
          --reasoning-budget 1024
        ttl: 300

      # ── ACTIVATED 2026-09-07: wired into LiteLLM's semantic router as the
      # "medical" route (see k8s/p1/litellm.yaml's custom_router_hook.py).
      # Files confirmed present on aibox 2026-09-07 via `kubectl exec ... ls
      # /models/medgemma-1.5-4B/`. PATH FIXED same day: the -m filename was
      # -Q5_K_M.gguf (matching the casing implied by the HF filename), but
      # the file actually downloaded to aibox as -q5_k_m.gguf (lowercase) --
      # Linux paths are case-sensitive, so llama-server couldn't find it and
      # exited immediately with no useful error, which llama-swap could only
      # report as the generic "upstream command exited prematurely" (root
      # cause found via `kubectl logs -l app=llama-swap` + a real `ls` on
      # the mounted /models path, not guessing from the wrapper error alone).
      # mmproj-F16.gguf's casing already matched, no change needed there.
      #   mkdir -p /data/models/medgemma-1.5-4B
      #   cd /data/models/medgemma-1.5-4B
      #   wget https://huggingface.co/unsloth/medgemma-1.5-4b-it-GGUF/resolve/main/medgemma-1.5-4b-it-Q5_K_M.gguf -O medgemma-1.5-4b-it-q5_k_m.gguf
      #   wget https://huggingface.co/unsloth/medgemma-1.5-4b-it-GGUF/resolve/main/mmproj-F16.gguf
      # --no-jinja -> --jinja FIXED 2026-09-07: llama-server hard-requires
      # --jinja whenever a request includes a "tools" param, and Hermes (the
      # only real caller of the medical route) always sends tool/function
      # definitions -- it's an agent, not a plain chat client. --no-jinja
      # was carried over without checking that against how this model would
      # actually be called; every other GPU model in this roster already
      # runs --jinja for the same reason.
      #
      # --chat-template chatml ADDED 2026-09-07 (second bug, found right
      # after the --jinja fix): with --jinja alone (using this quant's own
      # embedded GGUF chat-template metadata), the model never actually
      # stopped generating -- it kept emitting literal "<|im_end|>"/
      # "<|im_start|>" as plain text and looping the same answer over and
      # over instead of the server recognizing end-of-turn. FIRST ATTEMPT
      # (chatml) DID NOT WORK -- same live-tested and still looped, emitting
      # literal "<|im_end|>"/"<|im_start|>user" as text and re-running the
      # whole exchange. That retest is the actual root-cause signal: MedGemma
      # is a Google Gemma-3-derived checkpoint, and Gemma's real, trained
      # turn/stop tokens are <start_of_turn>/<end_of_turn>, not ChatML's
      # <|im_start|>/<|im_end|>. This unsloth GGUF's embedded chat-template
      # metadata was apparently mislabeled as ChatML by the conversion
      # tooling, but the underlying weights were never trained on ChatML
      # control tokens -- so prompting it in genuine ChatML (either via the
      # GGUF's own mislabeled metadata, or by explicitly forcing --chat-
      # template chatml, which is what we just tried) makes the model
      # imitate the ChatML shape as plain sub-word text it has no special
      # stopping behavior bound to, instead of ever emitting its real EOS
      # special token. CHANGED 2026-09-07 to --chat-template gemma (also a
      # real llama.cpp built-in named preset) so the prompt is built in the
      # model's actual native <start_of_turn>/<end_of_turn> format, letting
      # it emit its genuine, correctly-wired EOS token. NOT YET CONFIRMED on
      # aibox -- if this still loops, the fallback is dropping --mmproj
      # (known llama.cpp bug where --mmproj can affect chat-template
      # handling) at the cost of vision on this specific model, and/or
      # grepping the model's startup log line for "EOS token"/"chat
      # template" (`kubectl logs -l app=llama-swap | grep -A2 -i "eos
      # token\|chat template"` right after it loads) to see the token
      # llama-server actually resolved, rather than guessing again.
      medgemma-1.5-4b:
        cmd: |
          llama-server
          -m /models/medgemma-1.5-4B/medgemma-1.5-4b-it-q5_k_m.gguf
          --mmproj /models/medgemma-1.5-4B/mmproj-F16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          -t 8
          --no-mmap
          --flash-attn on
          --jinja
          --chat-template gemma
          -c 32768
        ttl: 300

      # ── NEW: Qwen3-VL 30B-A3B (multimodal MoE, OCR/doc/vision) — "vision" role ───
      qwen3-vl-30b:
        cmd: |
          llama-server
          -m /models/qwen3-VL-30B/Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf
          --mmproj /models/qwen3-VL-30B/mmproj-F16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --n-gpu-layers 99
          --n-cpu-moe 20
          -t 8
          --no-mmap
          --flash-attn on
          --jinja
          -ctk q4_0
          -ctv q4_0
          -c 65536
          --no-mmproj-offload
        ttl: 300

      # ── Arch-Router-1.5B — semantic-router classifier for LiteLLM's "auto"
      # model (see k8s/p1/litellm.yaml's custom_router_hook.py). Called on
      # every request routed through "auto", so two changes from the
      # Windows-lab config this was carried over from:
      #   1. -ngl 0 (CPU), not -ngl 99. The Windows box had GPU headroom to
      #      spare; aibox's RTX 5070 Ti is already razor-thin at 65536
      #      context for the main model (see qwen3.8-27b-Expert's own
      #      comment above) -- a second GPU-resident model, even a small
      #      one, isn't worth risking against a budget that OOMs on modest
      #      context increases. Same reasoning as nomic-embed-text-v1.5 and
      #      qwen3-1.7b-cpu below: CPU is fine for a ~1B-class classifier
      #      that only needs to emit a few tokens of JSON.
      #   2. BUG (2026-09-07, now fixed -- see the matrix "sets" comment
      #      below): originally dropped from the "resident_router" matrix
      #      set on the assumption that ttl: 0 alone keeps a CPU-only model
      #      always resident regardless of GPU swaps. That's false -- real
      #      llama-swap behavior confirmed it gets evicted every time a
      #      model in that set starts, and vice versa. It's back in the set
      #      (ANDed in with "& arch"), which is what actually keeps it
      #      concurrent. ttl: 0 only controls idle-unload timing, nothing
      #      to do with concurrency.
      #
      # STATUS: real file confirmed present on aibox 2026-09-07 (was
      # speculative when this comment was first written). Arch-Router-1.5B-
      # Q4_K_M.gguf (~986MB), from Hugging Face at katanemo/Arch-Router-1.5B.gguf.
      # Original download commands, for reference:
      #   mkdir -p /data/models/arch-router-1.5B
      #   cd /data/models/arch-router-1.5B
      #   wget https://huggingface.co/katanemo/Arch-Router-1.5B.gguf/resolve/main/Arch-Router-1.5B-Q4_K_M.gguf
      arch-router-1.5b:
        # -c bumped 8192 -> 24576 2026-09-07: CPU-only + a ~1B-class model,
        # so this costs system RAM, not the GPU's tight VRAM budget -- cheap
        # to size generously. Real fix for the "400 Bad Request on every
        # classification call" bug was capping what custom_router_hook.py
        # actually sends (see its own comment in litellm.yaml -- it was
        # forwarding Hermes's full system-prompt/tool-harness, tens of
        # thousands of tokens, into an 8192-token context); this is just
        # headroom on top of that fix, not the fix itself.
        #
        # env: CUDA_VISIBLE_DEVICES="" ADDED 2026-09-07: -ngl 0 alone does
        # NOT stop a CUDA-built llama-server from touching the GPU (still
        # creates a CUDA context, can offload some compute buffer ops
        # regardless). Once this model was ANDed into resident_router
        # (below) so it's always concurrent with qwen3.8-27b-Expert, that
        # small reserved overhead was enough to push the already razor-thin
        # 27B model into "cudaMalloc failed: out of memory" on a 400MB
        # allocation, even with 14GB+ nominally free per nvidia-smi (a
        # startup-time CUDA contention issue, not a real aggregate
        # shortage). This forces genuinely CPU-only execution, same fix as
        # nomic-embed-text-v1.5 and qwen3-1.7b-cpu.
        cmd: |
          llama-server
          -m /models/arch-router-1.5B/Arch-Router-1.5B-Q4_K_M.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 0
          -t 8
          --no-mmap
          -c 24576
          --temp 0
        env:
          - "CUDA_VISIBLE_DEVICES="
        ttl: 0

    matrix:
      vars:
        a1:   agents-a1
        orn:  ornith-35b
        qpg:  qwopus-general
        qw6:  qwen3.6-35b
        goss: gpt-oss-20b
        q8:   qwen3-8b
        med:  medgemma-1.5-4b
        qvl:  qwen3-vl-30b
        arch: arch-router-1.5b
        qwe:  qwen3.8-27b-Expert
        qwv:  qwen3.8-27b-Expert-Vision
        emb:  nomic-embed-text-v1.5
        q17:  qwen3-1.7b-cpu

      sets:

        # BUG FIXED 2026-09-07: the comment that used to be here claimed
        # ttl:0 alone keeps a CPU-only model "always resident independent
        # of whatever's swapped in on the GPU" -- confirmed FALSE by real
        # llama-swap behavior (kubectl logs showed explicit
        # "evict=[arch-router-1.5b] target=[qwen3.8-27b-Expert]" and the
        # reverse, every single time either side started -- the semantic
        # router was silently falling back to "other" on a huge fraction of
        # real requests because of this). llama-swap's matrix/groups solver
        # only keeps concurrent whatever's actually named inside the DSL
        # expression -- ttl is purely about idle-unload timing, unrelated to
        # concurrency. Per llama-swap's own docs (Groups V2/matrix design,
        # github.com/mostlygeek/llama-swap#643), the correct way to keep a
        # model concurrent alongside a whole OR-set is to AND it into that
        # set explicitly -- which is exactly what the ORIGINAL Windows-lab
        # config already did for the old 7B autocomplete model ("& q7",
        # dropped only because that model itself was retired, not because
        # the pattern was wrong -- see the no-rewrite-principle note at the
        # top of this file). Restored that pattern here, and extended it to
        # nomic-embed-text-v1.5 and qwen3-1.7b-cpu too: both have the exact
        # same ttl:0-is-enough assumption and no matrix var at all, meaning
        # Honcho's background deriver/embedding calls have almost certainly
        # been hitting this same silent eviction on every GPU model swap,
        # just unnoticed since Honcho retries quietly in the background
        # rather than surfacing an error to a human.
        resident_router: "(a1 | orn | qpg | qw6 | goss | q8 | med | qvl | qwe | qwv) & arch & emb & q17"
