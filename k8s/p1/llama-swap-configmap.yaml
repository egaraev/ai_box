apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: ai-models
data:
  config.yaml: |
    # llama-swap config.yaml — migrated from the Windows lab
    # (D:\repo\ai_ml_cv_projects\ai-lab\configs_llama\config.yaml) per the
    # no-rewrite principle: same model definitions and tuning, only the binary
    # path and model paths changed for the containerized Linux environment.
    #
    #   C:\llama-cpp\llama-server.exe        -> llama-server   (baked into the
    #                                            ghcr.io/mostlygeek/llama-swap:unified-cuda
    #                                            image, already on PATH)
    #   C:\AI\HF_llama.cpp\<model-dir>\...    -> /models/<model-dir>/...
    #                                            (hostPath /data/models on aibox,
    #                                            mounted into the container at /models)
    #
    # TRIMMED 2026-09-07 (Eldar's call): every model entry below now has a
    # real GGUF folder on aibox's /data/models -- arch-router-1.5B,
    # gemma4-26B, medgemma-1.5-4B, nomic-embed-text-v1.5, qwen3-1.7B,
    # qwen3-8B, qwen3.8-27B (Expert + Expert-Vision), qwopus3.6-35B. Every
    # other placeholder carried over from the Windows-lab config (which had
    # no file on disk) was removed rather than kept as dead config -- see
    # the REMOVED comments inline below for what was dropped and why.
    # gemma4-26b has files present but isn't wired into LiteLLM's router yet
    # (no route maps to it in litellm.yaml). qwopus-general WAS in the same
    # boat until 2026-09-10, when it took over the "vision" route from
    # qwen3.8-27b-Expert-Vision -- see litellm.yaml's top-of-file ROUTES
    # comment for why.
    healthCheckTimeout: 300
    logLevel: info

    models:

      qwen3.8-27b-Expert:
        # PATH UPDATED 2026-09-07: aibox's /data/models moved from a flat
        # qwen3.8-27B-MTP/ folder holding everything to qwen3.8-27B/ (base
        # model directly inside) + qwen3.8-27B/vision/ (the vision quant +
        # its mmproj, kept separate since only Expert-Vision needs them).
        # 2026-09-05: LOCKED at -c 65536, no vision, on aibox (RTX 5070 Ti 16GB;
        # XFCE desktop holds ~530MB VRAM at all times -- Xorg/Chromium GPU process
        # -- eating into the same razor-thin headroom the Windows benchmark
        # already had at 85k context). Empirically confirmed on aibox, clean pod
        # each time, no leftover processes:
        #   - 65536, no --mmproj:  WORKS. 44.8 t/s decode (matches the Windows
        #     benchmark for this quant). This is the configuration in use.
        #   - 65536, with --mmproj (vision): OOM, ~885MB short.
        #   - 80000, no --mmproj:  OOM, ~470MB short on the compute buffer alone.
        #   - 90000, no --mmproj:  OOM, worse than 80000.
        # 65536 already satisfies Hermes Agent's 64K minimum context requirement,
        # so this is locked in rather than continuing to chase 80k/90k, which
        # reproducibly fails. --parallel 1 kept (server defaults to n_slots=4
        # otherwise per its own startup log, which cost headroom for no benefit
        # here). Going higher than 65536 and/or restoring --mmproj both require
        # actually freeing VRAM, not more context tuning -- the real lever is the
        # desktop's ~530MB baseline (planned nvidia-drm.modeset=0 / no-GUI
        # switch), not another value to try here.
        #
        # -t 16 -> 8 CHANGED 2026-09-07: found via real timeouts, not
        # guessed. Once the matrix fix (see arch-router-1.5b/nomic-embed-
        # text-v1.5/qwen3-1.7b-cpu below) forced those three to always stay
        # resident alongside whichever GPU model is active, aibox's 16
        # logical cores (nproc confirmed: 8 physical/16 virtual) were being
        # asked for up to 8+8+16+16=48 threads at once whenever this model
        # was actively decoding a long response -- arch-router-1.5b's own
        # classification calls (which run on literally every single
        # message, on the hot path) started missing its 30s httpx timeout
        # under that contention, silently defaulting every route to
        # "other" (confirmed live: 3 classification calls in a row hit
        # genuine httpx.ReadTimeout right after two back-to-back reasoning-
        # route responses kept this model busy). This model is fully GPU-
        # offloaded (-ngl 99) -- its CPU threads mainly cover prompt
        # processing/sampling overhead, not the actual layer compute -- so
        # halving to 8 should cost little decode speed while giving arch-
        # router-1.5b real headroom. NOT YET CONFIRMED on aibox.
        #
        # -b/-ub ADDED 2026-09-08: this model started intermittently
        # OOMing live on exactly the same class of failure the 80000-
        # context test above already hit ("~470MB short on the compute
        # buffer alone") -- but now at the supposedly-safe 65536, under
        # real concurrent load. Root-caused via a live nvidia-smi capture
        # (not guessed): the "~530MB desktop baseline" assumption above is
        # stale -- real baseline now runs ~700-800MB (Xorg + a couple of
        # Chromium/Electron processes), PLUS a previously-unaccounted-for
        # persistent ~420MB held by ComfyUI's idle python3 process the
        # whole time it's running (confirmed via `ps -p <pid>` and via
        # testing ComfyUI's own /free endpoint against it live -- /free
        # made ZERO difference, so that 420MB is the floor cost of
        # ComfyUI having a live CUDA context at all, not something
        # reclaimable without stopping the pod). Net: real spare margin
        # for this model is thinner than the clean-pod benchmark above
        # ever measured, since that test had none of ComfyUI/media-gen
        # running yet. Fix attempt (Eldar's choice among 3 real options --
        # this one over freeing the desktop's VRAM, which is bigger/more
        # disruptive since aibox's desktop is actively used): -b 512
        # -ub 128 shrinks the specific compute/graph_reserve buffer that's
        # been failing to allocate, without touching -c (so Hermes's 64K
        # floor stays satisfied) or the quant (no quality cost) -- prompt
        # processing may be modestly slower (more sequential chunks),
        # generation speed unaffected. Confidence here is MODERATE, not
        # proven: grounded in a third-party llama.cpp tuning guide's claim
        # that -b to -ub reduction "meaningfully reduces peak memory," not
        # a verified-on-this-exact-model test.
        #
        # ROUND 1 RESULT (-ub 128), confirmed via /logs/stream/upstream:
        # PARTIAL effect only. The failing compute buffer did shrink (from
        # 400.28 MiB / 419725568 bytes down to 292.27 MiB / 306467072
        # bytes -- so the lever is real), but stress-testing (5-6 back-to-
        # back reasoning-route messages) still hit repeated "upstream
        # command exited prematurely" / cudaMalloc OOM failures, arguably
        # more consistently than the pre-fix baseline. One capture also
        # showed a second, different-looking failure right at the end --
        # a raw CUDA error inside ggml_cuda_kernel_can_use_pdl (a
        # cudaFuncGetAttributes call, part of llama.cpp's Programmatic
        # Dependent Launch support, see github.com/ggml-org/llama.cpp
        # issue #15479). That function only queries kernel metadata and
        # doesn't itself allocate real memory, so per the well-documented
        # CUDA "OOM on an unrelated call" pattern (e.g. ggml-org/llama.cpp
        # issue #1866, forums.developer.nvidia.com/t/cudafuncgetattributes
        # -failed-out-of-memory/112473), this is read as the SAME
        # underlying OOM leaving the CUDA context sticky, not a distinct
        # bug introduced by -ub -- next unrelated CUDA call after a failed
        # cudaMalloc can surface the same error. Conclusion: -ub 128 alone
        # is insufficient given current real VRAM pressure.
        #
        # ROUND 2 (2026-09-08): Eldar's choice -- push the batch size
        # lever further before considering the bigger structural fix
        # (freeing the desktop's VRAM baseline via nvidia-drm.modeset=0).
        # -ub 128 -> 64 (halved again; -b left at 512, -ub is the one that
        # actually bounds the graph_reserve/compute buffer size per the
        # same tuning-guide source as round 1). NOT YET CONFIRMED on aibox
        # -- after deploying, trigger several reasoning-route messages in
        # a row (same test as round 1) and watch /logs/stream/upstream for
        # cudaMalloc OOM / the ggml_cuda_kernel_can_use_pdl error to
        # actually stop recurring, not just one lucky success. If -ub 64
        # still isn't enough, the remaining options are: push -ub lower
        # still (e.g. 32, though returns are diminishing and very small
        # -ub can start costing real prompt-processing speed), or take the
        # bigger swing at the actual non-model VRAM baseline (desktop +
        # ComfyUI idle floor).
        cmd: |
          llama-server
          -m /models/qwen3.8-27B/Qwen3.8-27B-UD-IQ4_XS.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -t 8
          --no-mmap
          --parallel 1
          -b 512 -ub 64
          -fa on
          -c 65536 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 4096
          --reasoning-effort medium
        # CUDA_VISIBLE_DEVICES=1 ADDED 2026-09-16: second GPU (RTX 3060) now
        # on the node, dedicated to qwen3-1.7b-cpu only (see that model's own
        # comment) -- every other GPU model, this one included, is pinned to
        # GPU 1 (the 5070 Ti, confirmed via `nvidia-smi -L` after the 3060
        # was installed) so nothing silently lands on the small card once
        # llama-swap-deployment.yaml exposes both devices via
        # NVIDIA_VISIBLE_DEVICES=all instead of the old single-GPU resource
        # request. See gpu-migration-2026-09-15/README.md for the full
        # reasoning behind dropping the device-plugin resource request.
        env:
          - "CUDA_VISIBLE_DEVICES=1"
        ttl: 300

      qwen3.8-27b-Expert-Vision:
        # 2026-09-06: LOCKED. Started life as "qwen3.8-27b-Test" -- a lighter
        # Q3_K_XL quant (~1.1GB smaller than Expert's IQ4_XS) tried specifically
        # to see whether the VRAM savings alone (holding context at Expert's
        # proven-safe 65536, not cutting it further) would be enough to also fit
        # --mmproj (vision) on this GPU. Empirically confirmed on aibox, clean
        # pod, no leftover processes:
        #   - 65536, with --mmproj: WORKS. No OOM. 68.62 t/s prompt / 47.17 t/s
        #     decode -- actually faster than Expert's 44.8-45.1 t/s, and has
        #     vision where Expert doesn't. Confirmed end-to-end via Open WebUI
        #     with a real image (model correctly described it), not just a
        #     clean load.
        #   - 100000, with --mmproj: OOM, same 884.62 MiB short on the mmproj
        #     buffer as Expert hit at 65536 -- confirms the shortfall scales
        #     with context, not quant alone; 65536 is still the ceiling for
        #     vision on this box until the desktop's ~530MB baseline is freed.
        # Renamed from "Test" to "Expert-Vision" now that it's confirmed as the
        # go-to vision-capable model, better than Expert on every axis measured
        # here (speed, vision) for the same 65536 context. Same lower-bit-quant
        # quality tradeoff vs Expert's IQ4_XS applies in principle (Q3_K_XL is
        # a smaller quant), but no quality regression observed in testing so
        # far. --parallel 1 kept for the same reason as Expert (avoid the
        # default n_slots=4 overhead). 2026-09-06: --reasoning-effort bumped
        # from medium to high (tried xhigh first, settled on high) to test
        # whether more reasoning improves output quality on this box -- watch
        # decode speed, this is untested. Note: --reasoning-budget is still
        # capped at 4096 tokens, which caps how much effort levels above
        # medium can actually use -- raise the budget too if higher effort
        # doesn't seem to change anything.
        #
        # -t 16 -> 8 CHANGED 2026-09-07: same CPU-thread-oversubscription
        # fix as qwen3.8-27b-Expert above (see that model's comment for the
        # full diagnosis) -- this model is also ANDed into resident_router
        # below, so it hits the exact same contention with arch-router-1.5b
        # whenever the vision route is active. NOT YET CONFIRMED on aibox.
        #
        # -b 8192 ADDED 2026-09-14: real OCR failures on a photographed
        # note (via gmail_sync.py's attachment pipeline) hit "input (4614
        # tokens) is larger than the max context size (2048 tokens).
        # skipping" in /logs/stream/upstream -- confirmed via a live
        # ps aux capture that this model's actual running argv had no -b/
        # -ub at all, so it was silently on llama.cpp's default n_batch of
        # 2048 (matches the error's "2048" exactly -- not -c, which was
        # already correctly 65536 live). A real photo's vision-encoded
        # tokens can comfortably exceed 2048, so mtmd's whole-image chunk
        # (submitted as one n_batch-sized unit) got rejected outright.
        # Fix: raise -b to 8192 for real headroom above any one image.
        # -ub deliberately left untouched (defaults to 512) -- per
        # qwen3.8-27b-Expert's own hard-won lesson right above this block,
        # -ub (not -b) is what actually drives the VRAM-costly compute/
        # graph_reserve buffer, and 512 is already the value this exact
        # quant+mmproj combo was proven to work under at 65536 context (see
        # the 2026-09-06 clean-pod benchmark above). -b just changes how
        # many tokens can be accepted/queued at once, not how big a single
        # GPU compute step is, so this should be low VRAM risk -- watch
        # /logs/stream/upstream on the next real OCR test to confirm no
        # new cudaMalloc OOM shows up before calling this settled.
        # -c 65536 -> 81920 TESTED 2026-09-14: a real Telegram conversation
        # (Hermes re-running vision OCR on an image mid-thread) hit
        # ContextWindowExceededError at 67120 tokens -- just over the old
        # 65536 ceiling, not anywhere near needing the full 100000 that was
        # already confirmed OOM (884.62 MiB short on the mmproj buffer, see
        # the 2026-09-06 benchmark above) at this same quant+mmproj combo.
        # 81920 gives ~14.8k tokens of real headroom above the actual
        # failure while staying 18% under the known-bad ceiling. NOT YET
        # CONFIRMED live -- watch /logs/stream/upstream on first load after
        # this deploys for a cudaMalloc OOM before calling this settled; if
        # it OOMs, the next lever is dropping -ub below its current default
        # (512) rather than pushing -c further, same fix already applied to
        # qwen3.8-27b-Expert's own compute-buffer OOM above.
        #
        # -c 81920 REVERTED back to 65536 2026-09-14: didn't OOM outright,
        # but confirmed BAD via a live nvidia-smi capture taken while this
        # model was loaded at 81920 -- 16303MiB total, 15789MiB used, only
        # ~514MiB free, with llama-server alone holding 15156MiB. That's the
        # card maxed to the edge, not cleanly fitting and not cleanly OOMing
        # either, and prompt processing collapsed to 11-16 t/s (vs the
        # normal ~1400-1600 t/s baseline documented above) as a direct
        # result -- whatever happens at that VRAM boundary is catastrophically
        # slow, not just tight. Confirms the 2026-09-06 ceiling finding above
        # (100000 OOMs outright, 884.62 MiB short) extends downward: 81920
        # already sits in the same razor-thin danger zone even though it
        # technically loads without erroring. Back to the proven-safe 65536
        # until the real fix (freeing the desktop's/ComfyUI's non-model VRAM
        # baseline, same lever already identified on qwen3.8-27b-Expert
        # above) actually happens -- more -c tuning alone won't fix this,
        # the card just doesn't have the headroom.
        cmd: |
          llama-server
          -m /models/qwen3.8-27B/vision/Qwen3.8-27B-UD-Q3_K_XL.gguf
          --mmproj /models/qwen3.8-27B/vision/mmproj-F16.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -t 8
          --no-mmap
          --parallel 1
          -fa on
          -b 8192
          -c 65536 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 4096
          --reasoning-effort high
        # CUDA_VISIBLE_DEVICES=1 ADDED 2026-09-16: pinned to the 5070 Ti --
        # see qwen3.8-27b-Expert's own comment above for the full reasoning
        # (second GPU now on the node, everything except qwen3-1.7b-cpu
        # stays on GPU 1).
        env:
          - "CUDA_VISIBLE_DEVICES=1"
        ttl: 300

      # ── NEW (P2, 2026-09-06): CPU-only models supporting the Honcho memory
      # layer. Both run -ngl 0 (no GPU layers) so they never contend with
      # Open WebUI's GPU chat models via llama-swap's model-swap mechanism --
      # Honcho's background deriver/embedding calls can fire at any time,
      # including mid-conversation, without disrupting whatever's loaded on
      # the GPU. ttl: 0 (like arch-router-1.5b) keeps them always resident
      # since they cost no VRAM either way.
      nomic-embed-text-v1.5:
        # Embeddings-only model for Honcho's EMBED_MESSAGES pipeline (see
        # k8s/p2/honcho.yaml). Q8_0 quant, ~140MB. --pooling mean is
        # nomic-embed-text-v1.5's documented setting for llama.cpp serving.
        # Known minor quality caveat: nomic-embed-text-v1.5 is trained with
        # task-instruction prefixes ("search_query: ...", "search_document:
        # ...") for best retrieval quality -- Honcho's embedding calls won't
        # send these, so embeddings will work but may be somewhat less
        # precise than the model's benchmarked numbers. Not a blocker.
        #
        # env: CUDA_VISIBLE_DEVICES="" ADDED 2026-09-07: -ngl 0 alone does
        # NOT stop a CUDA-built llama-server from touching the GPU -- it
        # still creates a CUDA context and can offload some compute buffer
        # ops regardless (confirmed via llama.cpp's own maintainers). This
        # only became a real problem once this model was ANDed into the
        # matrix's resident_router set (below) so it's always concurrent
        # with the GPU models -- qwen3.8-27b-Expert already runs at a
        # documented, razor-thin VRAM ceiling on this card, and three CPU
        # models each quietly reserving a bit of CUDA context overhead was
        # enough to push it into "cudaMalloc failed: out of memory" on a
        # mere 400MB allocation, even with 14GB+ nominally free (a startup-
        # time CUDA contention/fragmentation issue, not a simple aggregate
        # shortage). CUDA_VISIBLE_DEVICES="" forces this process to never
        # initialize CUDA at all -- genuinely CPU-only, not just -ngl 0.
        #
        # -t 8 -> 2 CHANGED 2026-09-07: this model being permanently
        # resident (ttl: 0, ANDed into resident_router below) alongside
        # arch-router-1.5b and whichever GPU model is active meant up to
        # 48 threads were being requested at once on aibox's 16 logical
        # cores -- confirmed as the real cause of arch-router-1.5b's
        # classification calls hitting genuine httpx.ReadTimeout under load
        # (see qwen3.8-27b-Expert's comment for the full diagnosis). A
        # ~140MB embeddings-only model doing simple mean-pooling forward
        # passes doesn't need 8 threads to itself; trimmed to free real
        # headroom for arch-router-1.5b, which is on the hot path for
        # every single chat message. NOT YET CONFIRMED on aibox.
        #
        # -c 8192 -> 32768, --parallel 4 ADDED 2026-09-14, THEN REVERTED THE
        # SAME DAY, in two steps -- both turned out to be the wrong fix, kept
        # here since the dead ends are worth knowing about:
        #  1. This model never set --parallel, so it silently ran on
        #     llama-server's default of 4 slots. Found via a real failure:
        #     vault_sync.py's /v1/embeddings call on a note with one big
        #     unbroken blockquote (10957 chars, 4614 tokens) got rejected,
        #     the JSON body itself naming the cause -- 'n_ctx': 2048.
        #     Assumed -c 8192 was being split 4 ways -- raised -c to 32768
        #     expecting 32768/4=8192 per slot. Deployed, live argv confirmed
        #     via `ps aux`, but the SAME chunk failed again with the exact
        #     same 'n_ctx': 2048, byte-for-byte identical. Theory was wrong.
        #  2. Guessed the model's real native context was 8192 and that
        #     --parallel 1 (one slot, no division) would let that whole
        #     8192 through -- deployed, live argv confirmed again, STILL
        #     'n_ctx': 2048, even with only 1 slot and no division happening
        #     at all. Also wrong.
        # Ground truth came from `curl http://localhost:<port>/props` against
        # the live process itself (bypassed llama-swap's own proxy logs and
        # the unreliable /logs/stream/upstream endpoint): this GGUF's real
        # n_ctx is 2048, full stop -- not 8192, and not a --parallel/-c
        # tuning question at all. llama-server silently clamps any -c
        # request above a GGUF's real trained context and only logs a
        # warning (a gotcha already documented elsewhere on this box).
        # No launch flag fixes this. The actual fix lives in
        # scripts/vault_sync.py's chunker instead (MAX_CHUNK_CHARS +
        # _split_oversized(), added 2026-09-14): it now splits any block
        # over ~3000 chars -- comfortably under 2048 tokens even at this
        # note's measured ~2.4 chars/token -- before ever calling
        # /v1/embeddings, so no single chunk can exceed the real ceiling.
        # -c 8192 / --parallel 1 below are left as-is from step 2: harmless
        # now that chunking guarantees every request fits well inside the
        # true 2048 limit, and -parallel 1 is arguably still correct anyway
        # (a value like -c 8192 that's silently ignored doesn't matter, but
        # a mis-set --parallel could still divide the real 2048 ceiling
        # across slots). Tradeoff: Honcho's EMBED_MESSAGES calls now queue
        # through a single slot instead of 4 concurrent -- untested whether
        # that matters in practice for this small/fast a model; revisit if
        # Honcho embedding throughput becomes a real problem, but rule out
        # queueing latency (not the 2048 ceiling) as the cause first if so.
        # CPU-only model (env: CUDA_VISIBLE_DEVICES= below) -- no VRAM
        # ceiling to weigh against, unlike the GPU models' -c/-b tuning
        # elsewhere in this file.
        cmd: |
          llama-server
          -m /models/nomic-embed-text-v1.5/nomic-embed-text-v1.5.Q8_0.gguf
          --port ${PORT}
          --host 0.0.0.0
          --embedding
          --pooling mean
          -ngl 0
          -t 2
          --parallel 1
          -c 8192
          -b 8192
          -ub 8192
        env:
          - "CUDA_VISIBLE_DEVICES="
        ttl: 0

      qwen3-1.7b-cpu:
        # Dedicated tiny CPU model for all of Honcho's non-embedding LLM
        # calls (deriver extraction, dialectic, summary, dream) -- see
        # k8s/p2/honcho.yaml's per-feature MODEL_CONFIG overrides, all
        # pointed at this model name. Context capped at 32768; Honcho's
        # DERIVER_MAX_INPUT_TOKENS/DIALECTIC_MAX_INPUT_TOKENS are reduced in
        # honcho.yaml to fit inside this with headroom for output.
        # Sampling params are Qwen3's own documented non-thinking defaults.
        # 2026-09-06: -t bumped 8->16 (aibox has 16 cores, this was only
        # using half) after the first real smoke test showed ~82-92s per
        # deriver extraction call. Confirmed via re-test: only a modest,
        # inconsistent improvement (avg ~77s across 5 calls, range 42-106s)
        # -- thread count wasn't the dominant bottleneck. The likely real
        # cause: Qwen3 dense models think by default (emit reasoning_content
        # before the actual answer/tool-call) unless told not to, and this
        # model never had --reasoning-budget set, unlike every GPU model in
        # this roster. On CPU, token *generation* speed is the bottleneck,
        # and thinking mode can multiply generated tokens well past what
        # Honcho's deriver actually needs (a structured
        # extraction/tool-call, not visible reasoning) -- so
        # --reasoning-budget 0 added to disable it. Re-test after this
        # change before concluding a smaller model is needed.
        # env: CUDA_VISIBLE_DEVICES="" ADDED 2026-09-07: see the identical
        # comment on nomic-embed-text-v1.5 above -- same fix, same reason
        # (this model being ANDed into resident_router is what surfaced it).
        #
        # -t 16 -> 4 CHANGED 2026-09-07: the 2026-09-06 bump to 16 already
        # measured only a modest, inconsistent improvement (see comment
        # above) -- thread count was never the dominant bottleneck for this
        # model. Now that it's permanently resident (ttl: 0) alongside
        # arch-router-1.5b and whichever GPU model is active, that unused
        # headroom is actively harmful: up to 48 threads were being
        # requested at once on aibox's 16 logical cores, which is the
        # confirmed cause of arch-router-1.5b's classification calls
        # hitting genuine httpx.ReadTimeout under load (full diagnosis on
        # qwen3.8-27b-Expert's comment above). Trimmed to 4 -- frees real
        # headroom for arch-router-1.5b (every chat message's hot path)
        # while costing this model little, since 16 threads were barely
        # helping it anyway. NOT YET CONFIRMED on aibox.
        #
        # --parallel 1 ADDED 2026-09-15: this model never set --parallel,
        # unlike nomic-embed-text-v1.5 right above it -- so it was accepting
        # llama-server's default of multiple concurrent slots on only 4
        # total threads. Root-caused live via llama-swap's own dashboard
        # (In-Flight Requests) while chasing the "Jarvis hangs" reports:
        # after cutting honcho.yaml's DIALECTIC_MAX_INPUT_TOKENS 28000->1500
        # (see that file's own comment -- real cause of the 30.0s Honcho
        # timeouts, confirmed via bench_qwen17b_prefill_scaling.py), a
        # SINGLE real Telegram question still produced 6-7 simultaneous
        # in-flight requests to this model that grew rather than drained --
        # confirmed via two dashboard snapshots 51.4s apart where every
        # request was the exact same one just aging, zero completions.
        # honcho-api's own PERFORMANCE telemetry explained what they were:
        # two real dialectic_chat tool-loop calls (input_tokens=5163 each,
        # one reusing 3924 cached tokens from the other) plus one
        # minimal_deriver call, all genuinely concurrent -- not a retry
