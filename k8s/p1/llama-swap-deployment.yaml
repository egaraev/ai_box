# llama-swap: the GPU model-serving layer for P1. Runs the
# ghcr.io/mostlygeek/llama-swap:unified-cuda13 image (bundles a CUDA-built
# llama-server + llama-swap in one container), reads its model roster from
# the ConfigMap in llama-swap-config.yaml, and reads GGUF files from
# /data/models on the host (hostPath — fine for a single-node cluster).
#
# IMAGE TAG 2026-09-18 (Eldar's call): switched unified-cuda -> unified-cuda13.
# Root cause investigated, not guessed: unified-cuda is built for compute
# capabilities 60;61;75;86;89 (Pascal through Ada) -- it has NO native kernels
# for the RTX 5070 Ti (Blackwell, sm_120/compute capability 12.0). It was
# still running via CUDA's PTX forward-compatibility (JIT-compiling the
# embedded sm_89 PTX at load time), not via Blackwell-native MMQ kernels --
# same class of "wrong kernel path" gap documented publicly to cost 5-6x
# prompt-processing throughput on Blackwell when the binary falls back off
# its native arch (github.com/mostlygeek/llama-swap unified-cuda13 tag is
# built CUDA 13.3.1 for 80;86;89;90;100;120, sm_120 included). Confirmed
# aibox's host driver (595.91.07, CUDA 13.2 per `nvidia-smi`) clears
# unified-cuda13's CUDA 13 / R580+ driver requirement before switching --
# this pod only needs the host driver, not a host CUDA toolkit install.
# VRAM margin on the 5070 Ti is already thin (see llama-swap-configmap.yaml's
# qwen3.8-27b-Expert comments, -b 512 -ub 64 already tuned down once for
# OOM) -- a different CUDA/cuBLAS build can shift that baseline slightly
# either way, so after deploying: re-run the same reasoning-route stress
# test used for the -ub tuning (5-6 back-to-back messages), confirm no new
# OOM via /logs/stream/upstream, and compare decode t/s against the
# previously-measured baseline (44.8 t/s on qwen3.8-27b-Expert at -c 65536)
# before treating this as a proven win.
#
# NOTE: the ConfigMap is mounted via subPath, so a `kubectl apply` /
# ArgoCD sync of a config change updates the file on disk but does NOT
# restart the running llama-swap process automatically. After editing the
# config, roll the deployment: `kubectl rollout restart deployment/llama-swap -n ai-models`
#
# SECOND GPU 2026-09-16 (Eldar's call): a 3060 12GB was added alongside the
# 5070 Ti so qwen3-1.7b-cpu (Honcho's model, see llama-swap-configmap.yaml's
# own comment on it) could move off CPU without contending with every other
# GPU model for the 5070 Ti's VRAM. This pod's child llama-server
# subprocesses (one per model, spawned by llama-swap itself) each pick a
# physical card via their own CUDA_VISIBLE_DEVICES env var in the ConfigMap
# -- so this ONE pod needs to see BOTH physical GPUs at once, which the k8s
# NVIDIA device plugin can't reliably provide: it hands back one opaque
# physical device per `nvidia.com/gpu` unit requested (confirmed via
# kubernetes/kubernetes#133618 -- a plain NVIDIA_VISIBLE_DEVICES pod env var
# can't add a device the plugin's Allocate() call didn't already mount in),
# and its device selection isn't controllable per physical card (NVIDIA
# GitHub discussion #1021). Fix: drop the `resources.limits.nvidia.com/gpu`
# request entirely (bypasses Allocate() -- never invoked without a resource
# request) and set NVIDIA_VISIBLE_DEVICES=all directly instead, the same
# mechanism plain `docker run --gpus all` has always used, independent of
# k8s device-plugin accounting. Fine on this single-node cluster -- no
# second node this pod could be scheduled away from. Full reasoning/apply
# history: gpu-migration-2026-09-15/README.md in this repo.
#
# GPU PINNING HISTORY, 2026-09-16 -- two attempts before landing on the one
# actually in use (see llama-swap-configmap.yaml's per-model env blocks for
# the live config):
#   1. Pinned by INDEX (CUDA_VISIBLE_DEVICES=0/1, matching nvidia-smi -L's
#      PCI-bus-order listing). BROKE live: qwen3-1.7b-cpu (pinned =0, meant
#      for the 3060) loaded onto the 5070 Ti instead -- confirmed via
#      `nvidia-smi` showing its llama-server process on the wrong card right
#      after a real completion call. Root cause: nvidia-smi/
#      NVIDIA_VISIBLE_DEVICES order GPUs by PCI bus id (0=3060, 1=5070 Ti),
#      but the CUDA RUNTIME's own device numbering (what
#      CUDA_VISIBLE_DEVICES=0/1 actually indexes into, once
#      NVIDIA_VISIBLE_DEVICES=all exposes both devices into this container)
#      defaults to CUDA_DEVICE_ORDER=FASTEST_FIRST, not PCI order -- so CUDA
#      ranked the faster 5070 Ti as its own device 0, exactly reversing the
#      intended pins.
#   2. Tried adding CUDA_DEVICE_ORDER=PCI_BUS_ID here (pod-level env, forces
#      CUDA's numbering to match nvidia-smi's) to fix attempt 1 without
#      changing the ConfigMap. Still index-based under the hood, so still
#      one more thing to get right and re-verify -- superseded before it was
#      even confirmed working.
#   3. SETTLED ON (Eldar's call): pin by UUID instead
#      (CUDA_VISIBLE_DEVICES=GPU-<uuid>) in the ConfigMap. A UUID always
#      names one specific physical card regardless of enumeration order, so
#      the whole index/CUDA_DEVICE_ORDER question is moot -- no env var
#      needed here at all. This pod only needs NVIDIA_VISIBLE_DEVICES=all so
#      both physical devices are visible for child processes to select from
#      by UUID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
  namespace: ai-models
  labels:
    app: llama-swap
spec:
  replicas: 1
  strategy:
    type: Recreate   # only one process may hold the GPU at a time
  selector:
    matchLabels:
      app: llama-swap
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      runtimeClassName: nvidia
      containers:
        - name: llama-swap
          image: ghcr.io/mostlygeek/llama-swap:unified-cuda13
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          volumeMounts:
            - name: config
              mountPath: /etc/llama-swap/config/config.yaml
              subPath: config.yaml
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: llama-swap-config
        - name: models
          hostPath:
            path: /data/models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llama-swap
  namespace: ai-models
spec:
  selector:
    app: llama-swap
  ports:
    - port: 8080
      targetPort: 8080
      name: http
