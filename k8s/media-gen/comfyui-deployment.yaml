# ComfyUI: image/video generation backend for the Media Generation roadmap
# item. Runs mmartial/comfyui-nvidia-docker (ships CUDA 12.9 + a recent
# PyTorch — Blackwell/RTX 50-series (sm_120) capable, requires NVIDIA driver
# 570+, which aibox already runs).
#
# SECOND GPU 2026-09-16 (Eldar's call): a 3060 12GB was added alongside the
# 5070 Ti, dedicated to Honcho's qwen3-1.7b-cpu model on the llama-swap side
# (see k8s/p1/llama-swap-configmap.yaml). ComfyUI stays on the 5070 Ti --
# it needs the bigger card's VRAM, the 3060 doesn't have room for it. Pinned
# the same way llama-swap's own models are pinned: dropped the
# `resources.limits.nvidia.com/gpu` device-plugin request (its device
# selection isn't controllable per physical card once 2 different GPUs
# exist on the node -- see llama-swap-deployment.yaml's own comment for the
# full reasoning/kubernetes#133618 citation) and set NVIDIA_VISIBLE_DEVICES
# directly to GPU 1's index (confirmed via `nvidia-smi -L` after the 3060
# was installed: GPU 0 = 3060, GPU 1 = 5070 Ti). Unlike llama-swap (which
# needs to see both cards for its own per-model CUDA_VISIBLE_DEVICES
# pinning), ComfyUI only ever needs one GPU, so it's pinned directly to "1"
# rather than "all" -- simpler, and this pod's container never sees the
# 3060 at all. The former single-GPU time-slicing workaround in
# k8s/p0/nvidia-device-plugin.yaml is no longer load-bearing for scheduling
# either this pod or llama-swap's, now that neither requests
# `nvidia.com/gpu` through the device plugin any more -- left in place
# since nothing else currently depends on removing it, not touched here.
# llama-swap and ComfyUI are still not meant to actually generate
# concurrently -- that's coordinated at the app level (a busy-flag +
# llama-swap's /api/models/unload endpoint, still to be built), not by
# anything in this manifest or by GPU placement.
#
# Host directories this expects to already exist before first apply (see
# deploy notes), owned by the uid/gid set in WANTED_UID/WANTED_GID below:
#   /data/comfyui/basedir/models/checkpoints   <- Z-Image Turbo etc. go here
#   /data/comfyui/basedir/models/vae
#   /data/comfyui/basedir/input
#   /data/comfyui/basedir/output
#   /data/comfyui/basedir/custom_nodes
#   /data/comfyui/run                          <- venv + ComfyUI source, container-managed
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: ai-models
  labels:
    app: comfyui
spec:
  replicas: 1
  strategy:
    type: Recreate   # only one process should hold the GPU slot at a time
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      runtimeClassName: nvidia
      containers:
        - name: comfyui
          image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda12.9-latest
          ports:
            - containerPort: 8188
              name: http
          env:
            - name: WANTED_UID
              value: "1000"   # verify with `id eldar` on aibox — edit if different
            - name: WANTED_GID
              value: "1000"
            - name: BASE_DIRECTORY
              value: /basedir
            - name: SECURITY_LEVEL
              value: normal
            - name: USE_UV
              value: "true"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "1"   # 5070 Ti only -- GPU 1, confirmed via nvidia-smi -L
            # LTX-2.3 TEST 2026-09-24: the LTXAV transformer (23.8GB staged,
            # per live log) doesn't fit in this card's 15.8GB VRAM, so
            # ComfyUI's DynamicVRAM/comfy-aimdo system pages it in/out of
            # host RAM on demand (real mechanism -- comfy_aimdo's VBAR
            # page-fault model, not a naive cache). Live log showed the
            # 23.8GB model getting "prepared for dynamic VRAM loading" TWICE
            # in one generation (once per sampling pass, low-res then
            # high-res), suggesting real eviction between the two passes,
            # not just a logging artifact. Testing whether that's caused by
            # inaccurate VRAM-pressure readings: NVML can under/over-report
            # free VRAM inside a containerized/nvidia-runtimeClass pod vs a
            # bare-metal Windows install, which would trigger eviction
            # earlier than actually needed. --disable-nvml-pressure switches
            # DynamicVRAM to raw CUDA pressure polling instead. This env var
            # is read by the mmartial image's init.bash and appended
            # verbatim to ComfyUI's main.py launch line (COMFY_CMDLINE_EXTRA
            # -- confirmed via the image's own init.bash source). Compare
            # the next generation's log for whether "23835MB Staged" still
            # appears twice -- if it does, this wasn't the cause and should
            # be reverted (remove this env var) rather than left in as dead
            # weight.
            - name: COMFY_CMDLINE_EXTRA
              value: "--disable-nvml-pressure"
          volumeMounts:
            - name: run
              mountPath: /comfy/mnt
            - name: basedir
              mountPath: /basedir
      volumes:
        - name: run
          hostPath:
            path: /data/comfyui/run
            type: Directory
        - name: basedir
          hostPath:
            path: /data/comfyui/basedir
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui
  namespace: ai-models
spec:
  selector:
    app: comfyui
  ports:
    - port: 8188
      targetPort: 8188
      name: http
---
# Browser access to ComfyUI's own native web UI (served at "/" on 8188 --
# no separate dashboard path like the other services) -- additive NodePort
# Service, same pattern as k8s/p1/dashboards.yaml and k8s/p2/qdrant.yaml's
# qdrant-nodeport: points at the same pod the ClusterIP Service above
# already exposes, nothing about that Service changes. NOT meant for
# concurrent use with real chat/agent traffic -- see the top-of-file
# comment: ComfyUI and llama-swap's GPU chat models (everything except
# qwen3-1.7b-cpu, which lives on its own dedicated 3060) still share the
# 5070 Ti via a full-swap design, so generating an image here will evict
# whatever chat model is currently loaded on that card.
apiVersion: v1
kind: Service
metadata:
  name: comfyui-nodeport
  namespace: ai-models
spec:
  type: NodePort
  selector:
    app: comfyui
  ports:
    - port: 8188
      targetPort: 8188
      nodePort: 30188
      name: http
