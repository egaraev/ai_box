# n8n: the L3 Integration/orchestration layer -- closes the gap where
# anything landing in the Obsidian vault outside Hermes's own ingest_note/
# ingest_file MCP calls (a manual Obsidian edit, or the future Gmail/
# Telegram sync scripts) never gets indexed into Qdrant on its own. Source
# image built from apps/n8n/Dockerfile -- built and run locally on aibox,
# no registry involved, same reasoning/pattern as vault-mcp and
# media-gen-mcp (one less moving part on a single-user home cluster).
# imagePullPolicy: IfNotPresent means k3s/containerd uses whatever image
# tag already exists on the node instead of trying (and failing) to pull it
# from Docker Hub.
#
# Lives in its own k8s/n8n/ dir + its own bootstrap Application
# (k8s/bootstrap/n8n-app.yaml), same "not phase-numbered, inserted ahead of
# its strict P-slot" pattern as k8s/media-gen/ -- N8N is nominally P-later
# in the roadmap doc but got built now because Eldar wanted the ingestion
# gap closed today, not in strict phase order. Namespace ai-integration
# per README.md's namespace table ("N8N/LangFuse/LangServe -- L3
# Integration").
#
# BUILD / DEPLOY (run on aibox; see apps/n8n/Dockerfile's own top comment
# for the exact build command -- it differs slightly from vault-mcp/
# media-gen-mcp's since this image needs files from ../../scripts/, so the
# build context is the repo root, not this app's own dir):
#   cd ~/repos/aibox-platform
#   docker build -f apps/n8n/Dockerfile -t aibox-n8n:latest .
#   docker save aibox-n8n:latest | sudo k3s ctr images import -
# After editing scripts/*.py or the Dockerfile, repeat both, then:
#   kubectl rollout restart deployment/n8n -n ai-integration
#
# When THIS FILE itself changes -- `kubectl apply -f` it directly (or let
# ArgoCD sync k8s/n8n the normal way) in addition to any image rebuild:
#   kubectl apply -f k8s/n8n/n8n-deployment.yaml
#
# litellm-secret: this namespace (ai-integration) needs its OWN copy of
# the Secret, same as every other namespace that calls LiteLLM (see
# k8s/secrets/README.md's litellm-secret section, now updated to include
# ai-integration in its namespace loop) -- Secrets don't cross namespaces,
# so skipping that step leaves this pod stuck CreateContainerConfigError.
#
# TWO VOLUMES, both plain hostPath (same convention as vault-mcp/
# hermes-agent, avoids k3s's local-path-provisioner multi-attach
# limitations already hit twice on this project -- see vault-mcp/server.py's
# top comment for that story):
# - vault-data: the real Obsidian vault at /data/obsidian_vault, mounted
#   read-write (same hostPath vault-mcp and hermes-agent both already
#   mount) -- vault_sync.py needs read access to every note to reindex it,
#   and the future gmail_sync.py/telegram_sync.py need write access to
#   create new notes under AI/. type: Directory (not DirectoryOrCreate)
#   since the vault already exists -- same reasoning as vault-mcp's own
#   mount, fail loudly rather than silently start against an empty dir.
# - n8n-data: n8n's OWN persistent state (workflows, credentials, the
#   SQLite execution DB) at /home/node/.n8n -- without this, every pod
#   restart would wipe every workflow you've built. type: DirectoryOrCreate
#   since this is a brand new volume on first deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: ai-integration
  labels:
    app: n8n
spec:
  replicas: 1
  # n8n's own SQLite execution DB (under /home/node/.n8n) isn't safe for
  # concurrent access from two pods -- same reasoning honcho-api/open-webui/
  # hermes-agent already use Recreate for their own PVC/hostPath state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: aibox-n8n:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: GENERIC_TIMEZONE
              value: "Europe/Warsaw"   # Eldar's own timezone -- so Schedule Trigger cron times match his local clock, not UTC
            - name: TZ
              value: "Europe/Warsaw"
            # The Execute Command node turned out to be unusable on this
            # image (confirmed live 2026-09-14: files + manifest entry both
            # present, yet n8n reports "Unrecognized node type:
            # n8n-nodes-base.executeCommand" -- root cause still unclear,
            # possibly this Docker Hardened Image build excludes it at a
            # level neither the manifest nor an env var exposes). Workaround,
            # same one the original Windows-lab workflow already used: a
            # Code node calling child_process.execSync directly. n8n's Code
            # node sandboxes which Node built-ins it may require() -- by
            # default child_process is NOT allowed ("Module 'child_process'
            # is disallowed", confirmed live testing a bare Code node) --
            # this env var explicitly whitelists it. Standard documented n8n
            # behavior, unlike the executeCommand mystery above.
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: "child_process"
            # Confirmed live 2026-09-14, right after the child_process fix
            # above started working: the Code node's own script ran fine,
            # but the python script it launched via execSync failed with
            # "Set LITELLM_MASTER_KEY first" -- even though `kubectl exec
            # ... -- env` on the real pod shows LITELLM_MASTER_KEY/
            # QDRANT_URL/LITELLM_URL all present. First guess
            # (N8N_BLOCK_ENV_ACCESS_IN_NODE, below) turned out to be the
            # wrong mechanism -- kept anyway since it's the correct toggle
            # for $env/process access in principle, but it didn't fix this.
            # Real root cause: since n8n 1.x/2.x, Code nodes don't run
            # inline in the main n8n process -- they run in a separate
            # "task runner" process, spawned via n8n's bundled
            # task-runner-launcher, which by default hands that runner
            # process only a small curated set of n8n's OWN env vars (auth
            # token, broker port, etc), not the container's full
            # environment. So execSync-spawned commands inherit that
            # stripped runner environment, not this pod spec's env, no
            # matter what's set here. N8N_RUNNERS_MODE=internal (below)
            # sidesteps this: it runs the runner as a plain child process
            # of n8n itself instead of through the launcher, which inherits
            # the real process environment normally -- simpler than editing
            # the launcher's own /etc/n8n-task-runners.json allowed-env
            # list, and the "less secure but simpler" tradeoff is fine here,
            # same reasoning as literal credentials in this file already.
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            - name: N8N_RUNNERS_MODE
              value: "internal"
            # Confirmed live 2026-09-14, once the env fixes above got the
            # real (non---dry-run) Obsidian -> Qdrant sync actually running:
            # "Task execution aborted because runner became unresponsive".
            # execSync is SYNCHRONOUS -- it blocks the whole runner
            # process's event loop for as long as vault_sync.py takes, so
            # the runner can't answer the broker's heartbeat ping during
            # that whole window. Past ~30s of silence (the default
            # heartbeat interval) the broker assumes the runner died and
            # kills the task, even though the script itself was still
            # running fine. This just widens that window -- 300s to match
            # the 300000ms timeout already set in each Code node's own
            # execSync call, so the two limits agree instead of the
            # heartbeat cutting in first.
            - name: N8N_RUNNERS_HEARTBEAT_INTERVAL
              value: "300"
            # n8n's own default data folder is ~/.n8n (database.sqlite --
            # workflows, credentials, executions, the owner account itself).
            # Since this container runs as root (see Dockerfile), $HOME here
            # is /root (confirmed live, chat 2026-09-14), NOT /home/node --
            # so n8n was actually writing to /root/.n8n this whole time,
            # which is nowhere on the n8n-data hostPath mount below (that
            # mount sits at /home/node/.n8n, a path n8n never used). Every
            # pod Recreate wiped it, hence being asked to re-register on
            # every restart. N8N_USER_FOLDER overrides n8n's own default
            # regardless of $HOME, same fix pattern as GMAIL_MCP_DIR/
            # TELEGRAM_SYNC_STATE_DIR above for the same root-vs-HERE class
            # of bug.
            - name: N8N_USER_FOLDER
              value: "/home/node/.n8n"
            # QDRANT_URL/LITELLM_URL: read by scripts/vault_sync.py (and,
            # once wired up, gmail_sync.py/telegram_sync.py) via
            # os.environ.get(..., "http://localhost:<nodeport>") -- that
            # localhost default only works run directly on the aibox host,
            # not from inside this pod's own network namespace, so both
            # MUST be overridden here to the real in-cluster Service DNS.
            # NOTE the exact shape expected: vault_sync.py/gmail_sync.py/
            # telegram_sync.py all build their own "/v1/..." suffix
            # (f"{LITELLM_URL}/v1/embeddings" etc), so LITELLM_URL here
            # must NOT include a trailing /v1 -- unlike vault-mcp/server.py's
            # own LITELLM_URL env var, which DOES bake /v1 in because that
            # file's code doesn't add it itself. Same variable name, two
            # different expected shapes depending which codebase reads it --
            # worth re-checking the consuming script before copy-pasting
            # this pattern elsewhere.
            - name: QDRANT_URL
              value: "http://qdrant.ai-memory.svc.cluster.local:6333"
            - name: LITELLM_URL
              value: "http://litellm.ai-models.svc.cluster.local:4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master_key
            # GMAIL_SYNC_STATE_DIR / GMAIL_MCP_DIR / TELEGRAM_SYNC_STATE_DIR:
            # point gmail_sync.py/telegram_sync.py's own state+session+
            # credential files at subfolders of the n8n-data hostPath mount
            # (already below, /home/node/.n8n) instead of their HERE-relative
            # (/opt/scripts, baked into the image) or $HOME-relative (/root,
            # also ephemeral -- confirmed live, see chat 2026-09-14) defaults
            # -- otherwise every pod Recreate would silently lose Telegram's
            # login session and both scripts' "already synced" bookkeeping.
            # No separate volume needed -- these are just subdirectories
            # under the one hostPath already mounted below; each script
            # creates its own subfolder on first run (STATE_DIR.mkdir(...)).
            - name: GMAIL_SYNC_STATE_DIR
              value: "/home/node/.n8n/gmail-sync"
            - name: GMAIL_MCP_DIR
              value: "/home/node/.n8n/gmail-mcp"
            - name: TELEGRAM_SYNC_STATE_DIR
              value: "/home/node/.n8n/telegram-sync"
            # Telegram app registered at https://my.telegram.org/apps
            # (app title "ai_integration"). Literal values here, not a
            # Secret -- same comfort level as GENERIC_TIMEZONE above, fine
            # for a single-user home cluster (see k8s/secrets/README.md if
            # that changes later).
            - name: TELEGRAM_API_ID
              value: "32474119"
            - name: TELEGRAM_API_HASH
              value: "80bccc31ddb1fc2e54a03efcc5d62804"
            # The actual credential/session FILES still need to be copied
            # onto the aibox host (not something a k8s manifest can express)
            # -- see the chat from 2026-09-14 for the one-time copy from
            # /home/eldar/temp_files/ into /data/n8n/gmail-mcp/ and
            # /data/n8n/telegram-sync/ (== /home/node/.n8n/gmail-mcp and
            # /home/node/.n8n/telegram-sync inside the pod, per
            # GMAIL_MCP_DIR/TELEGRAM_SYNC_STATE_DIR above).
          volumeMounts:
            - name: vault-data
              mountPath: /data/obsidian_vault
            - name: n8n-data
              mountPath: /home/node/.n8n
            # Confirmed live 2026-09-14, after N8N_RUNNERS_MODE=internal
            # (above) still didn't fix it: n8n's Code node execution --
            # internal or external mode, doesn't matter -- runs in a
            # separate "task runner" process that only ever gets a small
            # hardcoded set of n8n's own vars (N8N_RUNNERS_*, PATH,
            # NODE_FUNCTION_ALLOW_BUILTIN, a couple others) passed to it.
            # None of this pod's app env (QDRANT_URL, LITELLM_URL,
            # LITELLM_MASTER_KEY, TELEGRAM_*, GMAIL_*) ever reaches a
            # Code node or anything it execSyncs, full stop -- this isn't
            # configurable via env vars in internal mode (external mode
            # has an allowed-env option in its own launcher config file,
            # but that file is documented as NOT read in internal mode).
            # Rather than fight that, this mounts litellm-secret as a
            # FILE instead of relying on the env var above -- file mounts
            # are a completely separate k8s mechanism, invisible to n8n's
            # env allowlisting, and the Code node's execSync already has
            # full filesystem access (proven live running scripts from
            # /opt/scripts). The three sync Code nodes read this file
            # directly via shell command substitution and pass
            # QDRANT_URL/LITELLM_URL/TELEGRAM_* inline in the exec
            # command itself instead of expecting them from the
            # environment -- see aibox-ingestion-pipeline.json.
            - name: litellm-secret-vol
              mountPath: /etc/secrets/litellm
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
      volumes:
        - name: vault-data
          hostPath:
            path: /data/obsidian_vault
            type: Directory
        - name: n8n-data
          hostPath:
            path: /data/n8n
            type: DirectoryOrCreate
        - name: litellm-secret-vol
          secret:
            secretName: litellm-secret
  selector:
    matchLabels:
      app: n8n
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: ai-integration
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
      name: http
---
# Same additive-NodePort pattern as litellm-nodeport/llama-swap-nodeport/
# qdrant-nodeport/comfyui-nodeport (k8s/p1/dashboards.yaml,
# k8s/media-gen/comfyui-deployment.yaml) -- no ingress on this cluster yet,
# so every web UI gets its own NodePort. :30678 chosen to echo n8n's own
# default port 5678, doesn't collide with any NodePort already in use
# (30400/30808/30633/30188/30860/30119).
apiVersion: v1
kind: Service
metadata:
  name: n8n-nodeport
  namespace: ai-integration
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
      nodePort: 30678
      name: http
