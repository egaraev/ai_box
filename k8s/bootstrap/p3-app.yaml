# P3 Application — Hermes Agent (the first real agent layer, on top of
# P1's plain chat UI). Same pattern as aibox-p0/p1/p2: ArgoCD watches
# k8s/p3/ in this repo and keeps the cluster in sync automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aibox-p3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:egaraev/ai_box.git
    targetRevision: main
    path: k8s/p3
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
