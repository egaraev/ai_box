# P2 Application — memory layer (Qdrant + Honcho: API server + Deriver +
# Postgres + Redis). Same pattern as aibox-p0/aibox-p1: ArgoCD watches
# k8s/p2/ in this repo and keeps the cluster in sync automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aibox-p2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:egaraev/ai_box.git
    targetRevision: main
    path: k8s/p2
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
