# P8 Application -- observability (Prometheus + Grafana + Loki + Promtail +
# node-exporter + dcgm-exporter + kube-state-metrics), all in the
# already-reserved ai-observe namespace (see k8s/p0/namespaces.yaml).
# Same pattern as aibox-p0/p1/p2/p3: ArgoCD watches k8s/p8/ in this repo and
# keeps the cluster in sync automatically. LangFuse (LLM tracing) is being
# built into this same k8s/p8/ path and ai-observe namespace in parallel by
# a separate change -- both land under the one aibox-p8 Application below,
# same as how ai-mcp already holds both vault-mcp and media-gen-mcp under
# separate Applications watching different paths.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aibox-p8
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:egaraev/ai_box.git
    targetRevision: main
    path: k8s/p8
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
