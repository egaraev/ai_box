# P1 Application — llama-swap (GPU model serving) + Open WebUI (chat
# interface). Same pattern as aibox-p0: ArgoCD watches k8s/p1/ in this repo
# and keeps the cluster in sync automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aibox-p1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:egaraev/ai_box.git
    targetRevision: main
    path: k8s/p1
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
